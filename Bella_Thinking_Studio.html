:2,"title":"Evidence that supports a claim","goal":"I can identify evidence that gives us more reason to believe a claim.","story":"The workshop is trying helpful changes: clearer labels, better trays and easier signs. Before saying a change works, the team wants evidence. You will choose new information that makes a claim more believable. Keep your words careful: a useful result can support an idea while leaving more to learn.","tool":"Support ladder","steps":["Find the exact claim.","Choose a new fact that would be expected if the claim were right.","Explain how it helps, without turning support into a promise."],"worked":{"stem":"Mia thinks labels help children find the right costume box faster.","ask":"Which observation best supports her idea?","explanation":["Mia's idea connects labels with quicker finding.","The similar searches provide a comparison of that outcome.","The result supports the idea, but does not guarantee labels work equally well in every setting."],"hints":["What outcome would show the labels helping?","Look for a comparison about finding the right box."],"think":"Use \"supports\" rather than \"proves every time\" in your explanation.","visual":null,"id":"m06l02-w","kind":"worked","options":["In two similar searches, the children found the costumes faster when the boxes had labels.","The labels were printed on Tuesday.","Some children enjoy singing.","The boxes have four corners."],"answer":0,"optionWhy":["The searches compare finding speed with and without the proposed help.","The print day does not connect labels with finding speed.","Singing preferences do not test costume searching.","Box corners do not show whether labels help searching."]},"questions":[{"stem":"Leo thinks a tray with raised edges will help stop counters falling off while he carries them.","ask":"Which result supports the idea most directly?","explanation":["The claim is about losing fewer counters during carrying.","The same walk gives a useful comparison between the surfaces.","Fewer fallen counters is supporting evidence for the edged tray."],"hints":["What problem should the tray reduce?","Choose an observation about that problem."],"think":"What could Leo repeat to become more confident?","visual":null,"id":"m06l02-q1","kind":"guided","options":["The tray's underside is yellow.","On the same short walk, fewer counters fell from the edged tray than from a flat board.","Leo knows the word counter.","There are clouds outside."],"answer":1,"optionWhy":["The underside colour does not show that counters stay on.","This compares the relevant outcome while using the same route.","Knowing a word does not test the tray.","The weather fact does not compare the carrying surfaces."]},{"stem":"Ari thinks a particular magnet can lift the metal clips on the table. The clips have not yet been tested with it.","ask":"Which new observation supports that claim?","explanation":["The claim concerns this magnet and these clips.","Lifting one of them is direct evidence that it can do so.","Testing other clips would check whether the result extends to the rest."],"hints":["Which observation uses the actual magnet and a clip?","A test with a different tool does not check this claim."],"think":"What has been checked, and what has not yet been checked?","visual":null,"id":"m06l02-q2","kind":"practice","options":["The magnet is shaped like a star.","Ari can lift the clips with a hand.","The magnet lifts one of those clips without help.","The clips are in a blue bowl."],"answer":2,"optionWhy":["Its shape alone does not show whether it lifts these clips.","A hand test does not test the magnet.","This shows that the magnet can lift at least one clip from the stated set.","The bowl colour does not test the magnet's action."]},{"stem":"The theatre team thinks a large-print sign is easier to read from the back row than its small-print sign.","ask":"Which result supports this claim?","explanation":["The claim compares reading from the back row.","The children read more words correctly with the larger print.","That result supports the claim for this comparison."],"hints":["What is being compared?","Look for a result from the back row using both signs."],"think":"Why is reading from the front row a different check?","visual":null,"id":"m06l02-q3","kind":"practice","options":["The small-print sign was made first.","The signs both contain words.","The front row has five chairs.","The same children read more words correctly on the large-print sign from the back row."],"answer":3,"optionWhy":["Order of making does not show which is easier to read.","This is true of both signs but does not compare readability.","A front-row count does not answer a back-row reading question.","This compares reading success at the relevant distance."]},{"stem":"Noor thinks a lid helps keep dry sand inside a tub when it is gently tipped. She has two identical tubs with the same amount of sand.","ask":"Which result would support her idea?","explanation":["Noor wants to compare spilling with and without a lid.","The tubs, sand amounts and tipping are kept alike.","Less spilling from the lidded tub supports the idea for that test."],"hints":["Which result measures the thing Noor wants to change?","Keep the amounts and tipping alike for a useful comparison."],"think":"Why would tipping only one tub be a weaker comparison?","visual":null,"id":"m06l02-q4","kind":"practice","options":["When both are tipped the same way, the lidded tub spills less sand.","The lidded tub has a sticker on its bottom.","The lid has a short name.","One empty tub can fit on a shelf."],"answer":0,"optionWhy":["This directly compares sand loss under similar tipping conditions.","The sticker does not show how much sand stays inside.","The name does not test its effect.","Shelf fit does not compare sand spilling."]},{"stem":"A reader thinks that the character Fern tries to help other characters. The story has not said this directly.","ask":"Which story event best supports the reader's interpretation?","explanation":["The interpretation concerns Fern's behaviour towards others.","Helping the lost mouse is an action relevant to that interpretation.","It supports the idea, while other events could add to or challenge it."],"hints":["Which event shows an action towards someone else?","Choose evidence about behaviour, not appearance or page number."],"think":"Find another kind of event that could add useful evidence.","visual":null,"id":"m06l02-q5","kind":"transfer","options":["Fern wears a purple coat.","Fern stops her game to help a lost mouse find its family.","Fern lives beside a tall tree.","Fern appears on page three."],"answer":1,"optionWhy":["Clothing colour does not show helpful behaviour.","This action is an example of Fern trying to help someone.","Her home's location does not establish this trait.","Page number does not describe how she treats others."]}],"activity":{"title":"Test a helpful change","instructions":"Place six small objects on a table and cover them with a cloth. Ask a partner to find a named object after uncovering them. Next, arrange the objects in labelled groups and try a new search. Discuss what you noticed. Say that practice or an easier target might also change the result; plan a fairer repeat together.","coach":"Use the activity to discuss evidence quality, not to announce that labels always work. Notice changes in targets, familiarity and grouping."},"reflection":"Which result gave you more confidence without settling every possible case?","transfer":"When describing a story character, point to an action that supports your interpretation.","parent":{"aim":"Observe whether the child links an observation to the precise claim and keeps its scope limited.","prompt":"How would that observation make the claim more believable?","pitfall":"Calling one favourable result a guarantee, or choosing an attractive detail unrelated to the claim.","success":"The child explains the supporting connection and can name something that remains untested."}},{"id":"m06l03","module":6,"lesson":3,"title":"Evidence that weakens a claim","goal":"I can find information that gives us a reason to doubt a claim.","story":"Pip has made some confident predictions about the theatre. Bella is checking them before the team acts. A new fact may show a problem, reveal another explanation or make a comparison less convincing. Your job is to choose the fact that matters most and explain how it changes confidence in the original idea.","tool":"Doubt detector","steps":["State the original claim carefully.","Look for a relevant problem or another explanation.","Say why confidence should fall, and whether the claim is actually disproved."],"worked":{"stem":"Leo says the garden route is usually quicker than the hall route. Both routes lead from the same door to the same stage.","ask":"Which new result gives the clearest reason to doubt his claim?","explanation":["The claim concerns which route usually takes less time.","Several similar walks gave the opposite result.","That weakens the claim, although it does not prove the garden route can never be quicker."],"hints":["Which fact compares the actual travel times?","Watch the word \"usually\"; one can question it without claiming \"never\"."],"think":"Why is \"The garden route is never quicker\" too strong?","visual":null,"id":"m06l03-w","kind":"worked","options":["There are flowers beside the garden route.","On several similar walks, the garden route took longer than the hall route.","The hall walls are white.","Leo likes the word garden."],"answer":1,"optionWhy":["Flowers alone do not compare walking times.","Repeated slower walks conflict with the proposed usual advantage.","Wall colour does not show which route is quicker.","His word preference does not measure route speed."]},"questions":[{"stem":"Mia thinks this box will keep paper dry when water is sprayed over its closed lid.","ask":"Which test result most strongly challenges her idea?","explanation":["The paper starts dry and the lid is closed.","The paper becomes wet during the spray test.","That result challenges the idea that this box protects paper under those conditions."],"hints":["What result is the box supposed to prevent?","Check the starting state and whether the lid was closed."],"think":"Why does knowing the paper started dry matter?","visual":null,"id":"m06l03-q1","kind":"guided","options":["The lid has a flower drawn on it.","The empty box can be lifted easily.","Dry paper placed inside becomes wet after water is sprayed over the closed lid.","Mia can spell the word paper."],"answer":2,"optionWhy":["The drawing does not test water protection.","Weight does not show whether water enters.","The stated test produces the outcome the box was meant to prevent.","Spelling does not test the box."]},{"stem":"Ari claims that one new basket can hold all six toy cars without stacking them.","ask":"Which new fact most directly weakens that claim?","explanation":["The claim needs room for six cars with no stacking.","The new fact allows only four cars under that rule.","This directly rules out the claimed fit."],"hints":["Which fact checks the exact capacity requirement?","Compare the number needed with the number that fits."],"think":"Would allowing stacking change the question?","visual":null,"id":"m06l03-q2","kind":"practice","options":["The basket has a red handle.","Ari chose the basket in the morning.","The cars all have wheels.","Only four of these cars fit in the basket without stacking."],"answer":3,"optionWhy":["Handle colour does not measure the required space.","Choosing time does not tell us its capacity.","This does not show that the basket holds six of them.","The basket lacks room for two of the six under the stated rule."]},{"stem":"Noor thinks a pale yellow crayon will make the clearest letters on white paper for her sign.","ask":"Which new information most challenges that idea?","explanation":["The goal is clear reading from a viewing spot.","Readers do better with dark letters than the pale yellow ones.","That comparison weakens the claim that pale yellow is the clearest choice here."],"hints":["Keep the claim about clear reading.","Which information compares what readers can actually see?"],"think":"Why can a favourite colour be a poor reason for this goal?","visual":null,"id":"m06l03-q3","kind":"practice","options":["From the viewing spot, readers struggle to see the pale yellow letters but read dark letters easily.","Yellow is Noor's favourite colour.","The yellow crayon is in a packet.","The paper was cut into a rectangle."],"answer":0,"optionWhy":["The reading comparison gives evidence against yellow being the clearest choice.","Preference does not measure how clearly others can read the letters.","Packaging does not compare visibility.","Paper shape does not establish which colour is clearest."]},{"stem":"Pip waves to a puppet called Rabbit. Rabbit does not reply. Pip concludes that Rabbit is angry with him.","ask":"Which new fact most weakens Pip's conclusion?","explanation":["Pip infers anger from getting no reply.","Not seeing the wave could also explain no reply.","The new fact weakens the anger inference; it does not tell us every feeling Rabbit has."],"hints":["Could there be another explanation for no reply?","Which new fact explains the missing response?"],"think":"Say what you know about seeing the wave and what you still do not know about feelings.","visual":null,"id":"m06l03-q4","kind":"practice","options":["Rabbit has a soft scarf.","Rabbit was facing away and did not see Pip wave.","Pip used his left hand.","Rabbit's name has six letters."],"answer":1,"optionWhy":["The scarf does not explain why Rabbit did not respond.","This supplies another explanation for the lack of a reply.","The hand used does not establish that Rabbit noticed or felt angry.","Name length does not explain the behaviour."]},{"stem":"In a story, Fox says, \"Those star-shaped boot marks must be Bear's. Bear has star-shaped soles.\"","ask":"Which later fact most weakens Fox's identification?","explanation":["Fox uses a matching sole pattern to identify Bear.","Otter could also leave the same pattern and was present.","The marks therefore do not uniquely identify Bear."],"hints":["Does the matching feature belong to only one possible wearer?","An alternative explanation can weaken a \"must\" claim."],"think":"What extra clue could help distinguish Bear from Otter?","visual":null,"id":"m06l03-q5","kind":"transfer","options":["Bear can say the word star.","Fox saw a bird earlier.","Otter was also there and wears boots with the same star-shaped soles.","Bear likes walking."],"answer":2,"optionWhy":["Speaking the word does not identify the tracks.","A bird sighting does not connect another wearer to these boot marks.","Another possible wearer makes the marks insufficient to identify Bear alone.","This preference does not rule out other people making the marks."]}],"activity":{"title":"Challenge a confident idea","instructions":"Put three different objects in a bag without showing your partner. Let your partner feel one object through the bag and make a guess. Ask what new observation could make that guess less likely. Reveal one extra clue, such as another surface or an outline. Discuss whether the clue proves the guess wrong or simply introduces another possibility.","coach":"Encourage careful language: \"This makes me less sure\" and \"This rules it out\" have different meanings. Do not reward stubborn defence of the first guess."},"reflection":"Did the new fact disprove the claim, or only give a reason to doubt it?","transfer":"When reading a mystery, look for a later clue that challenges an earlier explanation.","parent":{"aim":"Observe whether the child identifies a relevant challenge and describes its actual strength.","prompt":"How does this new fact change the original reason?","pitfall":"Assuming an alternative explanation proves the first explanation false, or treating an unrelated fact as a challenge.","success":"The child explains why confidence should fall and avoids claiming more than the evidence shows."}},{"id":"m06l04","module":6,"lesson":4,"title":"Not enough evidence, or definitely wrong?","goal":"I can separate an unchecked claim from a claim contradicted by evidence.","story":"The museum team has three report trays: supported by a complete check, contradicted by a finding, and not settled yet. Pip keeps dropping unfinished reports into the wrong tray. Help him notice exactly what has been checked. A hidden card might agree with a claim or break it; we must not pretend to know.","tool":"Three report trays","steps":["State exactly what the claim covers.","Check whether the evidence covers every needed case or gives an exception.","Choose known true here, known false, or not settled yet."],"worked":{"stem":"A bag contains exactly five buttons. Pip says all five are red. You inspect two buttons and both are red. The other three stay hidden.","ask":"What can you conclude about Pip's claim now?","explanation":["Two red buttons agree with the claim.","Three buttons remain unexamined.","Both a fully red bag and a bag with a different colour still fit what we know."],"hints":["How many buttons have actually been checked?","Can you imagine two different sets of hidden colours?"],"think":"Draw one hidden set that makes the claim true and one that makes it false.","visual":null,"id":"m06l04-w","kind":"worked","options":["It is proved true for all five buttons.","It is proved false.","It is not settled yet.","The three hidden buttons must be blue."],"answer":2,"optionWhy":["Only two of the five buttons have been checked.","No non-red button has been found.","The hidden buttons might all be red or might include another colour.","Nothing gives the colours of the hidden buttons."]},"questions":[{"stem":"There are exactly four actors in today's show. Mia says every actor has a badge. You check all four actors and each has a badge.","ask":"What does this complete check show?","explanation":["The claim covers exactly four actors today.","All four were checked and have the claimed badge.","The check establishes the claim for this group, without extending it to future shows."],"hints":["Is there anyone in the named group left unchecked?","Keep your conclusion inside today's group."],"think":"Why does checking this whole group differ from checking only one actor?","visual":null,"id":"m06l04-q1","kind":"guided","options":["The claim is false.","We have checked none of the actors.","Every actor in every future show will have a badge.","The claim is true for today's four actors."],"answer":3,"optionWhy":["The check found no actor without a badge.","The story says all four were checked.","The check only covers today's four actors.","Every member of the named complete group was checked."]},{"stem":"Leo says every toy boat in his set floats. One boat from that set is tested in water and sinks.","ask":"What does that result show about his all-claim?","explanation":["Leo claims that every boat in his set floats.","The tested boat is in that set and sinks.","That exception disproves the all-claim but says nothing certain about the rest."],"hints":["Does the tested boat belong to the claimed set?","Does one genuine exception break \"every\"?"],"think":"What do you know about the claim, and what remains unknown about other boats?","visual":null,"id":"m06l04-q2","kind":"practice","options":["The claim is false.","The claim is true.","Nothing can be concluded until every boat is tested.","Every other boat must sink too."],"answer":0,"optionWhy":["One boat in the named set fails to float.","The tested boat directly contradicts it.","One exception is enough to reject a claim about every boat.","The result gives no answer about the other boats."]},{"stem":"A tray has exactly three cards. Two are face up and show circles. The third is face down. Noor claims that all three cards show circles.","ask":"Which action would settle the claim for this tray?","explanation":["The two face-up cards already agree with the claim.","Only the third card remains unchecked.","Seeing that card will show whether all three are circles or an exception exists."],"hints":["Which part of the group is still unknown?","Choose an action that adds the missing information."],"think":"What would you conclude if the last card showed a square?","visual":null,"id":"m06l04-q3","kind":"practice","options":["Look again at just one face-up circle.","Turn over the third card and check its shape.","Count the table legs.","Say the claim more loudly."],"answer":1,"optionWhy":["That repeats known information and leaves the hidden card unknown.","That checks the only card still unknown.","Table legs do not reveal the last card's shape.","Volume cannot supply the missing information."]},{"stem":"Ari says all six members of a club chose the fox story. You have heard from three members, and all three chose it. Nobody has asked the other three.","ask":"Which report is accurate?","explanation":["Three known choices support part of the claim.","There is no information about the other three.","The complete all-six claim remains open until enough further information arrives."],"hints":["Separate known choices from unknown choices.","Missing evidence does not itself mean disagreement."],"think":"Give one possible result that would prove the claim false.","visual":null,"id":"m06l04-q4","kind":"practice","options":["The claim is already proved true.","The claim is already proved false.","Three choices are known; the claim about all six is not settled.","The unasked members definitely chose a different story."],"answer":2,"optionWhy":["Half of the club has not been asked.","No different choice has been reported.","The other three members could agree or disagree.","Being unasked does not determine a person's choice."]},{"stem":"A book says, \"Every traveller who entered the cave had a torch.\" One page shows a traveller entering with no torch. It is clearly the same cave.","ask":"How should a careful reader describe the claim?","explanation":["The book makes a claim about every person entering one cave.","A described traveller enters that cave without a torch.","That is a contradiction, while other travellers may still have carried torches."],"hints":["Check that the traveller and cave belong to the claim.","Decide whether this is missing information or an actual exception."],"think":"Write a less sweeping sentence that could fit both pages.","visual":null,"id":"m06l04-q5","kind":"transfer","options":["It is confirmed by that traveller.","It is untestable even with this example.","It proves no traveller ever carried a torch.","It is contradicted by that traveller."],"answer":3,"optionWhy":["The traveller lacks the very item the claim says everyone had.","The example directly checks a member of the claimed group.","One exception does not tell us what all the other travellers carried.","The story supplies an entry into the named cave without the required torch."]}],"activity":{"title":"Three trays on paper","instructions":"Draw three labelled areas: \"Known true here\", \"Known false\" and \"Not settled yet\". Make four paper cards and hide some face down. Say \"All four cards have stars.\" Check two cards, then place the claim in a report area and explain why. Reveal the remaining cards one at a time and move the report when the evidence requires it.","coach":"A non-star card immediately refutes the all-claim. All four checked with stars establishes it for these four. Before either condition is met, it remains unsettled."},"reflection":"When did you have enough evidence to move a report out of \"Not settled yet\"?","transfer":"When somebody makes an all-claim, ask what has been checked and what is still unknown.","parent":{"aim":"Observe whether the child distinguishes partial support, a complete check and a genuine contradiction.","prompt":"What has been checked so far?","pitfall":"Treating an unproved claim as false, or treating several confirming cases as a complete check.","success":"The child classifies the evidence accurately and states the remaining uncertainty."}},{"id":"m07l01","module":7,"lesson":1,"title":"After does not always mean because","goal":"I can tell an order of events from an explanation of what caused them.","story":"Pip wears new striped socks and wins a game. He is ready to call them winning socks! Bella wonders what else happened during the game. Today you will put events in order, then check whether that order is enough to explain the result. A cause needs more support than simply happening first.","tool":"Order or cause?","steps":["Name what happened first and what happened later.","Separate the observed order from the proposed explanation.","Ask what other information would help check the cause."],"worked":{"stem":"Pip wears new striped socks for a game. He wins. He says, \"The socks made me win.\" This is the only game we know about.","ask":"Which conclusion is careful?","explanation":["We know Pip wore the socks and then won.","Many details of a game could affect its outcome.","This one result does not isolate the socks as the cause."],"hints":["Which parts were observed, and which part is an explanation?","Would the same order be possible if something else helped Pip win?"],"think":"Say one sentence about the event and one question about its cause.","visual":null,"id":"m07l01-w","kind":"worked","options":["Pip won while wearing the socks, but we do not know what caused the win.","The socks are proved to cause wins.","Pip must win every later game in those socks.","Pip did not really win."],"answer":0,"optionWhy":["The order is known; the cause has not been established.","One win does not establish that the socks caused it.","No evidence guarantees future wins.","The story explicitly says he won."]},"questions":[{"stem":"Mia claps once. A toy train starts moving a moment later. She says her clap made it start. Nobody has checked its controls.","ask":"What is known from this information?","explanation":["The clap occurred first.","The train moved later, but its controls were not checked.","We can report the order without claiming the clap caused the movement."],"hints":["Put the two events in order.","What part of Mia's claim goes beyond that order?"],"think":"What could you inspect to learn more about the train?","visual":null,"id":"m07l01-q1","kind":"guided","options":["The clap definitely controls the train.","The train started after the clap; the cause is not yet known.","The train started before the clap.","All toy trains start when someone claps."],"answer":1,"optionWhy":["Timing alone does not show that the train responds to claps.","The timing is given, but the controls or other causes are unchecked.","This reverses the stated order.","Nothing supports a claim about other trains."]},{"stem":"Leo plays music beside a seed pot on Monday. A shoot appears on Tuesday. He says the music made the shoot appear.","ask":"Which response uses the evidence carefully?","explanation":["The music came before the visible shoot.","We do not know what would have happened with no music.","The observation alone does not tell us whether music caused the change."],"hints":["Do we have a comparison?","Keep \"happened after\" separate from \"was caused by\"."],"think":"What sort of comparison could help check Leo's idea?","visual":null,"id":"m07l01-q2","kind":"practice","options":["The music is proved to make every seed grow.","The shoot must have appeared before Monday.","A shoot appeared after music played, but that alone does not show the cause.","There was definitely no seed in the pot."],"answer":2,"optionWhy":["One sequence cannot support this universal cause claim.","That contradicts the stated timing.","The sequence does not compare what would happen without the music.","The story identifies a seed pot and gives no reason to deny it."]},{"stem":"Ari moves the classroom clock to another wall. Later that day the room is quieter. Ari says moving the clock made everyone quieter.","ask":"What should we say?","explanation":["Ari moved the clock first.","The room was quieter later, but no other conditions are described.","The timing alone does not establish the explanation."],"hints":["What do we know, and what are we guessing?","Think about other things that might change during a school day."],"think":"Name one useful question about what else happened.","visual":null,"id":"m07l01-q3","kind":"practice","options":["Moving clocks always makes rooms quiet.","The clock was not moved.","Quiet rooms always cause clocks to move.","The two events occurred in that order, but the reason for the quiet is still unknown."],"answer":3,"optionWhy":["This is a much wider claim than the observation supports.","The story says it was moved.","This invents a reverse cause not supported by the story.","Other changes during the day have not been checked."]},{"stem":"Noor turns on a small lamp. Soon afterwards, the clouds move and sunlight enters the room. She says the lamp moved the clouds.","ask":"Which part of the report is supported by the stated events?","explanation":["The lamp was switched on first.","Sunlight entered after the clouds moved.","That order is supported; the proposed power over clouds is not demonstrated."],"hints":["Choose a report of the events rather than a new power.","Which sentence only states the order we were told?"],"think":"How could you rewrite Noor's report without adding a cause?","visual":null,"id":"m07l01-q4","kind":"practice","options":["The lamp was turned on before sunlight entered.","The lamp is proved to control clouds.","The sunlight entered before the lamp was switched on.","Noor can now control every kind of weather."],"answer":0,"optionWhy":["This accurately states the given sequence.","The sequence does not establish that causal link.","This reverses the order.","This general ability is not supported at all."]},{"stem":"In a story, Fox says a magic word and a gate opens. The reader has not seen the gate mechanism or what other characters were doing.","ask":"What can the reader conclude so far?","explanation":["The reader knows the word came before the opening.","The reader lacks information about the gate and other characters.","Several explanations could still fit the scene."],"hints":["Use only the story information given.","Can you leave the explanation open while reporting the event?"],"think":"What later story detail might help explain the gate?","visual":null,"id":"m07l01-q5","kind":"transfer","options":["The magic word definitely opened it.","The gate opened after the word, but the story has not yet established why.","Magic can never work in this story.","The gate stayed closed."],"answer":1,"optionWhy":["That is one explanation, not yet confirmed by the information.","The sequence leaves the mechanism and other actions unknown.","The story has not given a rule excluding magic.","The stated event is that the gate opened."]}],"activity":{"title":"Make two reports","instructions":"Place a small toy on a table. Ask a partner to tap the table once, then move the toy by hand. Make an event report: \"The tap happened, then the toy moved.\" Make a cause report: \"The hand moved the toy.\" Change the first action to a wave and repeat. Discuss why the earlier action need not be the cause.","coach":"This demonstration supplies the actual moving action. Make clear that it illustrates a possible separate cause; it does not prove all earlier events are irrelevant."},"reflection":"Which words in your explanation describe order, and which describe a cause?","transfer":"In a story, notice when one event happens after another and ask whether the cause has been shown.","parent":{"aim":"Observe whether the child separates a reported sequence from a causal explanation.","prompt":"What do we know happened, and what part explains why?","pitfall":"Assuming the first event caused the second, or swinging to the unsupported claim that it could not have caused it.","success":"The child states the sequence accurately and leaves the cause open when evidence is missing."}},{"id":"m07l02","module":7,"lesson":2,"title":"Find another explanation","goal":"I can suggest another explanation that fits the same observations.","story":"The theatre team has improved several things at once, and Pip wants to know which change helped. Bella opens an explanation notebook. Each page has room for more than one possible cause. Your task is to find another explanation that fits the facts, then notice why another possibility does not automatically settle the question.","tool":"Another way it could happen","steps":["State the result and the first proposed cause.","Look for another changed condition or possible action.","Check that the alternative fits the facts and keep both possibilities open."],"worked":{"stem":"Mia puts a plant in a new pot and moves it to a sunnier window. It grows more that week. She says the new pot caused all the extra growth.","ask":"Which other explanation should she consider?","explanation":["Both the pot and the window position changed.","The result could relate to either change or to something else.","More light is an alternative to check; its existence does not prove the pot had no effect."],"hints":["How many things changed?","Find the other change besides the pot."],"think":"Why can you not yet say which change mattered most?","visual":null,"id":"m07l02-w","kind":"worked","options":["The pot was definitely unchanged.","The change in light may have helped the plant grow.","The plant did not grow.","No other condition changed."],"answer":1,"optionWhy":["The story says the pot was changed.","The window position changed too and could be relevant to the result.","The story reports more growth that week.","The light location also changed."]},"questions":[{"stem":"Leo runs a route faster in new shoes. Today's route goes downhill; the route he timed last week was flat. He credits only the shoes.","ask":"What else could explain the faster time?","explanation":["Leo changed shoes and ran a different type of route.","A change in route is another possible influence on time.","The comparison cannot isolate the shoes as the only cause."],"hints":["Compare what was different on the two days.","Which difference is separate from the shoes?"],"think":"What could Leo keep the same for a better comparison?","visual":null,"id":"m07l02-q1","kind":"guided","options":["The route must have been exactly the same.","Leo definitely ran slower today.","The different route could affect the running time.","New shoes guarantee a win in every race."],"answer":2,"optionWhy":["The story gives different slopes for the routes.","The stated result is that he ran faster.","The route changed as well as the shoes, so the comparison mixes changes.","Nothing in this comparison supports that general claim."]},{"stem":"The library adds labels to its return box and assigns a helper to collect books. Fewer books are misplaced. Pip says the labels alone caused the improvement.","ask":"Which other possible cause fits the information?","explanation":["The labels and the helper were introduced together.","Either change might help reduce misplaced books.","The helper is another explanation to consider, not proof that labels do nothing."],"hints":["Find the two changes.","Could the second change affect the same result?"],"think":"Could both changes have helped? Explain.","visual":null,"id":"m07l02-q2","kind":"practice","options":["No helper was assigned.","More books were definitely misplaced.","Labels can never help anyone.","The helper may have helped books reach the right place."],"answer":3,"optionWhy":["The story explicitly says a helper was assigned.","That is the opposite of the stated result.","The extra possibility does not rule out labels helping.","Assigning a helper was a second change that could affect returns."]},{"stem":"Ari leaves a biscuit on a plate and later finds the plate empty. A cat was nearby, so Ari thinks the cat took it. Noor was also in the room and was allowed to take that biscuit.","ask":"Which alternative fits these facts?","explanation":["An empty plate does not identify who took the biscuit.","Both the nearby cat and Noor are possible explanations in the situation.","Noor taking it fits the facts, but more information is needed to decide."],"hints":["What other person had the opportunity?","A second possible explanation is not automatically the proven one."],"think":"What question could Ari ask before making an accusation?","visual":null,"id":"m07l02-q3","kind":"practice","options":["Noor may have taken the biscuit.","The biscuit was never on the plate.","The cat is proved innocent.","The plate is still full."],"answer":0,"optionWhy":["Noor was present and permitted to take it, so this is another possible explanation.","The story says Ari left it there.","An alternative possibility does not prove the cat did not take it.","That contradicts the empty plate observation."]},{"stem":"A reading group finishes a story more quickly while using new reading lights. The children have also read the same story twice before and remember several lines.","ask":"What else could explain the quicker reading?","explanation":["The group used new lights but also knew this story better.","Remembered lines offer another explanation for quicker reading.","We cannot give all the credit to the lights from this comparison alone."],"hints":["What changed about the readers, not just the room?","Think about the lines they already remembered."],"think":"What would make a comparison of the lights more informative?","visual":null,"id":"m07l02-q4","kind":"practice","options":["The children have never seen the story.","Remembering parts of the story may have helped.","The lights are proved useless.","Every unfamiliar book will now be read equally fast."],"answer":1,"optionWhy":["The story says they have read it twice.","Familiarity changed along with the lighting and could affect speed.","A possible role for memory does not exclude an effect of lighting.","The result does not support that prediction."]},{"stem":"In a puppet story, Rabbit receives a new hat just as her friend returns from a trip. Rabbit smiles. Fox says, \"The hat must be the only reason she is happy.\"","ask":"Which alternative should the audience consider?","explanation":["The hat and the friend's return happen together.","Either event, or both, could contribute to Rabbit's happiness.","The friend's return challenges the claim that the hat must be the only reason."],"hints":["What two events happen in the scene?","Look for another reason that fits the smile."],"think":"Perform the scene in two ways, each suggesting a different reason for Rabbit's smile.","visual":null,"id":"m07l02-q5","kind":"transfer","options":["Rabbit has definitely not received a hat.","Rabbit's friend is still away.","Rabbit may be happy that her friend returned.","The smile proves the hat has no effect."],"answer":2,"optionWhy":["The story says she received one.","The story says the friend returned.","The friend's return is another event that could explain the smile.","A smile with two possible causes does not exclude either one."]}],"activity":{"title":"Two explanations, one scene","instructions":"Set a cup on its side beside a toy and a ball. Make a pretend observation: \"The cup was upright, and now it is on its side.\" Invent two possible explanations, such as a rolling ball or a hand tipping it. Act out each explanation. Check that both end with the same observation, then discuss a clue that might distinguish them.","coach":"The alternative must fit the initial and final facts. The activity demonstrates underdetermination; the fact that both stories are possible does not make either one true."},"reflection":"How did you check that your second explanation fitted the facts?","transfer":"When a story character explains another character's behaviour, suggest one other possibility.","parent":{"aim":"Observe whether the child offers a relevant alternative consistent with the stated facts.","prompt":"What else changed or could have happened?","pitfall":"Offering an alternative that contradicts the story, or assuming that inventing another cause disproves the first.","success":"The child names a plausible alternative and explains why more evidence is still needed."}},{"id":"m07l03","module":7,"lesson":3,"title":"Make a fairer comparison","goal":"I can plan a comparison that changes the thing we want to test while keeping other important conditions alike.","story":"Bella and Pip want to test their ideas instead of only guessing. But Pip keeps changing everything at once! A tall ramp, a new car and a stronger push all arrive together. Help the team design a clearer comparison. Start by naming one thing to test, then notice which other conditions should stay alike.","tool":"Change one thing to check it","steps":["Name the feature you want to test.","Keep other important conditions the same in both tries.","Compare the outcome and repeat when possible."],"worked":{"stem":"Pip wants to compare how far the same toy car travels from a high ramp and a low ramp.","ask":"Which plan is the fairest starting comparison?","explanation":["The feature under test is ramp height.","Car, floor and release method should be kept alike.","That makes any distance difference more informative about height, especially if the test is repeated."],"hints":["What single feature is being tested?","Which plan keeps the car, floor and release alike?"],"think":"Name one extra change that would make the result harder to explain.","visual":null,"id":"m07l03-w","kind":"worked","options":["Use a different car and a different floor for each ramp.","Push hard on the high ramp and softly on the low ramp.","Use the same car and floor, release it without a push, and change only the ramp height.","Try only the high ramp and declare it better."],"answer":2,"optionWhy":["Several changes could explain a difference in distance.","Push strength would change along with height.","This keeps the other listed conditions alike while testing height.","A single height gives no direct comparison."]},"questions":[{"stem":"Mia wants to compare which of two paper types soaks up more water.","ask":"Which plan gives the fairer comparison?","explanation":["The comparison is about paper type.","Piece size, water amount and time could also affect absorption.","Keeping those alike helps make the comparison useful."],"hints":["Which things might matter besides the paper type?","Look for a plan with equal conditions."],"think":"How would you record the result for each paper?","visual":null,"id":"m07l03-q1","kind":"guided","options":["Give one paper a whole cup of water and the other one drop.","Use a huge piece of one paper and a tiny piece of the other.","Check one paper after a minute and the other after a day.","Use equal-sized pieces, the same water amount and the same soaking time."],"answer":3,"optionWhy":["Different water amounts would make the results hard to compare.","Paper size changes along with type.","Different soaking times could affect the result.","These shared conditions make the paper type the main planned difference."]},{"stem":"Leo wants to know whether a sign is easier to read with large letters than with small letters.","ask":"Which pair of signs should he compare first?","explanation":["Leo wants to test letter size.","Words, colour and distance can affect reading too.","Holding those alike gives a clearer starting comparison of the two sizes."],"hints":["What feature must differ?","What reading conditions should remain alike?"],"think":"Why could changing viewing distance confuse this test?","visual":null,"id":"m07l03-q2","kind":"practice","options":["The same words and colours, viewed from the same place, with only letter size changed.","Large familiar words close by and small unfamiliar words far away.","A large red drawing and a small page of words.","Two signs with exactly the same letter size."],"answer":0,"optionWhy":["This targets letter size while keeping other reading features alike.","Word familiarity and distance also change.","These differ in content, not just letter size.","That does not compare large and small letters."]},{"stem":"Ari wants to compare which of two toy boats carries more counters before sinking.","ask":"Which plan is fairer?","explanation":["The outcome is how many equal counters a boat supports.","Using matching counters makes the load count meaningful.","The same tub and gradual loading provide a more useful comparison."],"hints":["What must one counted item mean in both tries?","Keep the load items and testing conditions alike."],"think":"Why would comparing numbers of tiny counters and large stones be misleading?","visual":null,"id":"m07l03-q3","kind":"practice","options":["Use tiny counters for one boat and large heavy stones for the other.","Use the same water tub and add the same kind of counter one at a time to each boat.","Push one boat under the water before adding counters.","Try one boat without any counters and stop."],"answer":1,"optionWhy":["Different loads make the counts difficult to compare.","This provides comparable loads and water conditions.","One boat would be given an extra cause of sinking.","This does not compare the carrying limits of both boats."]},{"stem":"Noor wants to compare how long two small lamps stay on with fresh batteries. Both lamps use the same battery type.","ask":"Which starting plan is fairer?","explanation":["The test compares lamp running time.","Different battery freshness would introduce another influence.","Starting together with comparable batteries makes the result more informative."],"hints":["What source of power must be comparable?","Which plan measures both lamps under similar starting conditions?"],"think":"What would you write down during the test?","visual":null,"id":"m07l03-q4","kind":"practice","options":["Give one lamp fresh batteries and the other nearly empty ones.","Switch one lamp off early but leave the other on.","Put equally fresh batteries of the same type in both lamps and switch them on together.","Count how many letters are in each lamp's name."],"answer":2,"optionWhy":["Battery condition could explain the time difference.","Manual switching would change the measured running time.","This keeps battery condition and start time comparable.","Name length does not test battery running time."]},{"stem":"A puppet club wants to compare whether a line is easier to hear when spoken softly or loudly.","ask":"Which first comparison is fairer?","explanation":["The club wants to compare voice volume.","Speaker, words, distance and background sound can also affect hearing.","Keeping these alike helps listeners compare the effect of volume."],"hints":["What is the one feature the club wants to change?","Which plan keeps other listening conditions alike?"],"think":"Try the comparison, then explain one limit of your small test.","visual":null,"id":"m07l03-q5","kind":"transfer","options":["Use different words, speakers and distances at the same time.","Play music only during the soft line.","Ask listeners to cover their ears only during the loud line.","Use the same speaker and words, with listeners at the same distance, and change the voice volume."],"answer":3,"optionWhy":["Too many differences could affect what listeners hear.","Background noise would change along with volume.","Hearing conditions would differ between the tries.","This keeps the other listed listening conditions alike."]}],"activity":{"title":"Ramp investigator","instructions":"Use one toy car, a stiff book and a safe clear floor. Raise one end of the book a little, release the car without pushing and mark where it stops. Repeat with the same car and floor after raising the book slightly higher. Try each height more than once. Compare the stopping places and discuss any differences between repeated tries.","coach":"Focus on the planned change and the controls. Repeated distances can vary; help the child describe the results rather than guarantee one outcome."},"reflection":"Which conditions did you keep alike, and why?","transfer":"Before comparing two ways of doing something, name one important condition to keep the same.","parent":{"aim":"Observe whether the child names a target variable and relevant conditions to hold alike.","prompt":"What else could change the result if we let it differ?","pitfall":"Changing several relevant things together or assuming one controlled try proves a rule for every situation.","success":"The child proposes a clearer comparison and describes its result with appropriate caution."}},{"id":"m07l04","module":7,"lesson":4,"title":"Choose the next useful check","goal":"I can choose a question or test that helps distinguish between explanations.","story":"The workshop has an investigation board with two possible explanations for each puzzle. Pip suggests counting ceiling tiles, but Bella wants a check that can actually help. Look at what the explanations predict. Then choose a question or small test that adds relevant information. One check may narrow the possibilities without finishing the investigation.","tool":"Next-clue chooser","steps":["Name the explanations still possible.","Ask what observation would be useful for telling them apart.","Make the check and update only as far as the result allows."],"worked":{"stem":"A torch will not light. Pip thinks its battery may be empty; Mia thinks something in the torch may be broken. They have a fresh battery known to work.","ask":"Which next check is most useful?","explanation":["An empty battery and a torch problem are both possible.","A known-working battery tests the battery explanation.","If the torch lights, that supports the battery explanation; if it does not, more torch checks may be needed."],"hints":["What can be changed while leaving the torch itself the same?","Choose a check involving a battery whose condition is already known."],"think":"What would you conclude if the torch still did not light?","visual":null,"id":"m07l04-w","kind":"worked","options":["Count the letters in the word torch.","Ask which colour Pip likes.","Put the same battery back without changing anything else and stop.","Try the known-working battery in the torch."],"answer":3,"optionWhy":["Word length does not distinguish the explanations.","Colour preference does not test the battery or torch.","That provides little new information about whether the battery is empty.","This checks whether changing the battery restores the light."]},"questions":[{"stem":"A toy car rolls less far today. It is on a rug instead of yesterday's smooth floor. Pip wonders whether the floor changed the result or the car now has a problem.","ask":"Which check helps most?","explanation":["Both the car's condition and the floor could matter.","Returning the same car to the old floor provides a useful comparison.","The result can guide the next check without changing several things at once."],"hints":["Which test restores one old condition?","Keep the car and starting method alike."],"think":"What result would make the rug explanation more plausible?","visual":null,"id":"m07l04-q1","kind":"guided","options":["Try the same car again on the old smooth floor with the same starting push.","Try a different car on a different rug.","Count the pictures on the wall.","Give the car a much stronger push on the rug and declare it fixed."],"answer":0,"optionWhy":["This checks whether the old performance returns when the floor is restored.","Both the car and surface would differ, leaving the issue unclear.","Wall pictures do not compare the car or surface.","A stronger push could hide either problem."]},{"stem":"Mia says a new microphone makes her voice easier to hear. During the new test the listeners also moved closer. Leo wants to check the microphone's effect.","ask":"Which question is most useful for planning another comparison?","explanation":["The microphone and listening distance both changed.","Closer listeners offer another explanation for easier hearing.","Keeping distance the same makes a new microphone comparison more useful."],"hints":["What changed besides the microphone?","Which question would help hold that other change steady?"],"think":"What two explanations could fit the first result?","visual":null,"id":"m07l04-q2","kind":"practice","options":["What colour are the listeners' shoes?","Can the listeners stay at the same distance for both microphone tests?","Which day is Mia's birthday?","How many letters are in microphone?"],"answer":1,"optionWhy":["Shoe colours do not address the changed listening distance.","Keeping distance alike helps separate its effect from the microphone's effect.","Her birthday does not distinguish the explanations.","Spelling does not help isolate the sound effect."]},{"stem":"A sealed display case is warmer this afternoon. A heater beside it was switched on, and sunlight also began falling on it. Ari wants to know whether the heater matters.","ask":"Which comparison would help most?","explanation":["Both heating and sunlight changed before the case warmed.","A useful comparison would change the heater while keeping light conditions alike.","That gives better evidence about the heater's role, though a real test still needs careful measurement."],"hints":["What influence does Ari want to investigate?","Which plan avoids changing the other possible influence at the same time?"],"think":"Why would switching off the heater only after sunset be hard to interpret?","visual":null,"id":"m07l04-q3","kind":"practice","options":["Change both the heater and the sunlight together again.","Count the case's corners.","Compare the case with the heater on and off while sunlight and other conditions stay alike.","Ask whether Ari likes the afternoon."],"answer":2,"optionWhy":["That would still mix the two possible influences.","The corner count does not test either heat source.","This targets the heater while reducing the sunlight difference.","Preference does not distinguish causes of warming."]},{"stem":"A club finishes a puzzle faster on its second attempt, when quiet music is playing. The first attempt had no music. Members also remember where several pieces go.","ask":"Which question identifies an important missing comparison?","explanation":["The music changed, but experience with the puzzle changed too.","A second no-music attempt would help assess the role of practice.","The missing comparison matters before giving the music all the credit."],"hints":["What can improve even if the music makes no difference?","Think about the pieces the members already remember."],"think":"What would you still need to keep similar in a new test?","visual":null,"id":"m07l04-q4","kind":"practice","options":["What shape is the music player's button?","How many windows are outside the club?","Does the word puzzle contain a z?","Would they also improve on a second attempt without music?"],"answer":3,"optionWhy":["Button shape does not compare practice and music.","That count does not test the explanations.","Spelling is unrelated to completing the puzzle faster.","This asks about improvement from practice without the proposed music effect."]},{"stem":"In a story, a garden gate opens after Fox whistles. The reader wonders whether the whistle operates a sensor or someone pushes the gate from behind.","ask":"Which next story detail would help most?","explanation":["The gate opening fits more than one explanation.","Seeing behind the gate could confirm or challenge the pushing explanation.","That is useful evidence, while other details may still be needed to understand the whole mechanism."],"hints":["Which hidden action is one explanation?","Choose a detail that could reveal that action."],"think":"If nobody is pushing, does that prove a whistle sensor is the only possible mechanism?","visual":null,"id":"m07l04-q5","kind":"transfer","options":["A view showing whether someone is pushing behind the gate as it opens.","The colour of Fox's scarf.","The number of petals on a nearby flower.","Fox's favourite song."],"answer":0,"optionWhy":["This directly checks one proposed explanation of the opening.","The scarf does not distinguish the gate explanations.","Petals do not show how the gate opened.","A song preference does not establish the mechanism."]}],"activity":{"title":"Ask a question that helps","instructions":"Ask a partner to hide one of four objects: a pencil, spoon, paper square or toy block. You may ask two yes-or-no questions before guessing. Choose questions about properties that divide the possibilities, such as whether the object can bend or has writing on it. After each answer, name the possibilities still left and choose your next question.","coach":"Choose objects whose relevant properties you both know. A useful question rules possibilities in or out; it does not need to guarantee an answer in one step."},"reflection":"How did your next check add information that a random question would not?","transfer":"When two explanations fit a story, suggest a scene or question that could help distinguish them.","parent":{"aim":"Observe whether the child chooses an observation linked to competing explanations.","prompt":"What answer to that question would change your mind?","pitfall":"Asking an interesting but irrelevant question, or treating one negative check as proof of the only remaining imagined cause.","success":"The child explains what the check can reveal and what may remain uncertain."}},{"id":"m08l01","module":8,"lesson":1,"title":"Read the right row and column","goal":"I can use headings to find the information a table gives.","story":"Pip has gathered counts, times and lists for the theatre fair, but the numbers are all mixed together. Bella puts them into small tables. Each row belongs to something, and each column tells us what kind of information it holds. Read the headings first so you know what each number means.","tool":"Heading, row, answer","steps":["Read the table title and headings.","Find the row or column named in the question.","Use the matching value and check what it measures."],"worked":{"stem":"The table records tokens collected: Blue team collected 4, Red team 7, and Gold team 5.","ask":"Which team collected the most tokens?","explanation":["The heading says the numbers count tokens.","Compare 4, 7 and 5.","Seven is greatest and belongs to Red team."],"hints":["Which column tells you the number of tokens?","Compare the numbers before matching the largest to its row."],"think":"Point to the heading that tells you what 7 means.","visual":{"type":"table","headers":["Team","Tokens collected"],"rows":[["Blue","4"],["Red","7"],["Gold","5"]],"caption":"Tokens collected at the fair"},"id":"m08l01-w","kind":"worked","options":["Blue team.","Red team.","Gold team.","All three collected the same number."],"answer":1,"optionWhy":["Blue has 4 tokens, the smallest count here.","Red has 7 tokens, more than 4 or 5.","Gold has 5 tokens, fewer than Red's 7.","The three counts are different."]},"questions":[{"stem":"The morning timetable says: painting starts at 9:00 am, puppets at 10:00 am, and puzzles at 11:00 am.","ask":"Which activity starts at 10:00 am?","explanation":["The question gives a time to find.","Locate 10:00 am in the start-time column.","The matching activity in that row is puppets."],"hints":["Find the requested time first.","Move across the same row to the activity name."],"think":"How would you find the start time if the question named the activity instead?","visual":{"type":"table","headers":["Activity","Starts"],"rows":[["Painting","9:00 am"],["Puppets","10:00 am"],["Puzzles","11:00 am"]],"caption":"Morning activity starts"},"id":"m08l01-q1","kind":"guided","options":["Painting.","Puzzles.","Puppets.","All three activities."],"answer":2,"optionWhy":["Painting starts at 9:00 am.","Puzzles start at 11:00 am.","The puppets row gives 10:00 am.","Each activity has a different start time."]},{"stem":"A shelf list shows 4 storybooks, 3 fact books, and 2 poetry books. These are all the books in the list.","ask":"How many fact books does the list show?","explanation":["The question asks for one kind of book.","Find the row labelled fact books.","Read its count of 3 without adding other kinds."],"hints":["Do you need one row or the total?","Match the words \"fact books\" to their count."],"think":"What question would the number 9 answer?","visual":{"type":"table","headers":["Kind of book","Number"],"rows":[["Storybooks","4"],["Fact books","3"],["Poetry books","2"]],"caption":"Books on one shelf"},"id":"m08l01-q2","kind":"practice","options":["4.","2.","9.","3."],"answer":3,"optionWhy":["Four is the storybook count.","Two is the poetry-book count.","Nine is the total across all three rows, not the fact-book count.","The fact-book row has a count of 3."]},{"stem":"Each child chose one favourite fair activity. The votes were: drawing 6, dancing 4, and building 2.","ask":"Which activity received the fewest votes?","explanation":["The numbers count votes, with one vote per child.","The smallest of 6, 4 and 2 is 2.","That count is in the building row."],"hints":["Does \"fewest\" mean largest or smallest?","Match the smallest count with its activity."],"think":"What does the vote count tell us, and what does it not tell us about children who did not vote?","visual":{"type":"table","headers":["Favourite activity","Votes"],"rows":[["Drawing","6"],["Dancing","4"],["Building","2"]],"caption":"One vote from each participating child"},"id":"m08l01-q3","kind":"practice","options":["Building.","Drawing.","Dancing.","They all received two votes."],"answer":0,"optionWhy":["Building received 2 votes, fewer than 4 or 6.","Drawing has the greatest count, 6.","Dancing has 4, which is more than Building's 2.","The drawing and dancing counts are different from two."]},{"stem":"A toy shelter records bowls filled at breakfast and lunch. Cats: 3 at breakfast, 2 at lunch. Dogs: 4 at breakfast, 3 at lunch.","ask":"How many dog bowls were filled at lunch?","explanation":["The question names the animal and the meal.","Find Dogs, then move to the Lunch column.","The cell where they meet contains 3."],"hints":["You need to match two headings.","Stay in the Dogs row and choose the Lunch column."],"think":"Why would reading the right row but wrong column give a different answer?","visual":{"type":"table","headers":["Animal","Breakfast bowls","Lunch bowls"],"rows":[["Cats","3","2"],["Dogs","4","3"]],"caption":"Bowls filled in the toy shelter"},"id":"m08l01-q4","kind":"practice","options":["4.","3.","2.","7."],"answer":1,"optionWhy":["Four is the dog breakfast count.","The Dogs row and Lunch column meet at 3.","Two is the cat lunch count.","Seven adds both dog meals, but the question asks only about lunch."]},{"stem":"A puppet show lists props by scene. Forest: 2 trees and 1 lantern. Castle: 0 trees and 3 lanterns. Garden: 4 trees and 2 lanterns.","ask":"Which scene needs three lanterns?","explanation":["The question concerns lanterns, not trees.","Find 3 in the Lanterns column.","The matching scene is Castle."],"hints":["Read the prop heading before searching for the number.","Which scene sits beside 3 lanterns?"],"think":"What error might happen if you ignored the column headings?","visual":{"type":"table","headers":["Scene","Trees","Lanterns"],"rows":[["Forest","2","1"],["Castle","0","3"],["Garden","4","2"]],"caption":"Props for each scene"},"id":"m08l01-q5","kind":"transfer","options":["Forest.","Garden.","Castle.","All scenes."],"answer":2,"optionWhy":["Forest uses 1 lantern.","Garden uses 2 lanterns.","The Castle row has 3 in the Lanterns column.","The scenes need different lantern counts."]}],"activity":{"title":"Make a tiny table","instructions":"Choose three kinds of small object, such as pencils, blocks and paper clips. Count each kind and make a table with headings \"Object\" and \"Number\". Ask a partner one question about a single row, one about the largest count and one about the total. Swap roles and point to the cells used for each answer.","coach":"Check that the child reads what each number represents. A total requires combining rows; a single-category question does not."},"reflection":"Which heading helped you avoid choosing the wrong number?","transfer":"Use a timetable, recipe list or score table and explain one cell in a full sentence.","parent":{"aim":"Observe whether the child uses headings and keeps row-column relationships intact.","prompt":"What does that number count or measure?","pitfall":"Selecting a familiar number without matching both headings, or adding values when only one cell is needed.","success":"The child locates the correct cell and states its meaning, including its category or unit."}},{"id":"m08l02","module":8,"lesson":2,"title":"Choose the numbers you need","goal":"I can choose quantities that answer the question and leave unrelated numbers aside.","story":"The fair notes contain numbers everywhere: prices, ages, start times and collections. Pip wants to add them all! Bella first asks what the problem is trying to find. Today you will decide which quantities belong together. Sometimes you need a total, sometimes a difference, and sometimes one number can be ignored.","tool":"Question before calculation","steps":["Say whether the question asks for a total, difference or remaining amount.","Choose the quantities that describe that relationship.","Calculate and check that the answer uses the right unit."],"worked":{"stem":"Mia collected 5 leaves and Leo collected 3. Their collecting walk began at 10 am.","ask":"Which calculation finds how many more leaves Mia collected?","explanation":["\"How many more\" asks for a difference.","The relevant counts are Mia's 5 leaves and Leo's 3.","Five minus three gives 2 more leaves; the start time is unrelated."],"hints":["Which numbers count the same kind of thing?","Do you need their combined total or the gap between them?"],"think":"What question would 5 plus 3 answer?","visual":{"type":"table","headers":["Information","Value"],"rows":[["Mia's leaves","5"],["Leo's leaves","3"],["Walk starts","10 am"]],"caption":"Notes from a collecting walk"},"id":"m08l02-w","kind":"worked","options":["5 plus 3.","10 minus 5.","5 minus 3.","10 plus 3."],"answer":2,"optionWhy":["This finds their combined total rather than how many more.","Ten is a clock time, not a leaf count for comparison.","Subtracting the two leaf counts finds their difference.","Adding a time label to leaves does not answer the question."]},"questions":[{"stem":"Pip has 10 coins and buys a ribbon for 6 coins. His bag has 2 pockets.","ask":"Which calculation finds the coins left?","explanation":["Pip begins with 10 coins.","The purchase uses 6 coins, leaving 4.","The number of pockets does not change this subtraction."],"hints":["Which number is money spent?","Keep the pocket count out of the money calculation."],"think":"Explain why the answer should be smaller than 10.","visual":null,"id":"m08l02-q1","kind":"guided","options":["10 plus 6.","6 minus 2.","10 minus 2.","10 minus 6."],"answer":3,"optionWhy":["Buying the ribbon removes coins rather than adding the price.","The pocket count is unrelated to the coins remaining.","Two pockets are not the ribbon's cost.","Subtract the price from the coins Pip had."]},{"stem":"A table needs 8 paintbrushes. There are already 5 brushes on it. Each new brush would cost 2 coins.","ask":"How many more brushes are needed?","explanation":["The target is 8 brushes and 5 are already present.","The missing number is 8 minus 5.","Three brushes are needed; the price would matter for a different question."],"hints":["Find the target and the current amount.","The question asks for brushes, not coins."],"think":"What different question would use the price of 2 coins?","visual":null,"id":"m08l02-q2","kind":"practice","options":["3 brushes.","6 brushes.","13 brushes.","2 brushes."],"answer":0,"optionWhy":["Eight needed minus five already there leaves three missing.","Six coins would buy the missing brushes, but it is not their number.","Adding the needed and existing counts does not find the gap.","Two is the price of one brush, not the number missing."]},{"stem":"Ari had 9 points before a game and 14 points afterwards. His player number is 7.","ask":"Which numbers show how many points he gained?","explanation":["A gain compares after with before.","Ari's scores changed from 9 to 14.","Subtracting 9 from 14 gives a gain of 5 points; his player number is irrelevant."],"hints":["Which numbers describe the same score at two times?","A player label is not a quantity of points."],"think":"How is a final score different from a score increase?","visual":{"type":"table","headers":["Note","Number"],"rows":[["Points before","9"],["Points after","14"],["Player number","7"]],"caption":"Ari's game notes"},"id":"m08l02-q3","kind":"practice","options":["14 and 7.","14 and 9.","9 and 7.","Only 14."],"answer":1,"optionWhy":["The player number is not the starting score.","The ending and starting scores determine the gain.","These omit the ending score needed for the gain.","The final score alone does not show how much it increased."]},{"stem":"A minibus has 12 passenger seats. Five children and three adults need one seat each. The trip starts at 9 am.","ask":"Which information is needed to find the empty passenger seats?","explanation":["Five children plus three adults use 8 seats.","There are 12 passenger seats in total.","Twelve minus eight leaves 4 empty seats; the start time is not needed."],"hints":["Who needs a passenger seat?","Use the capacity and the full number of passengers."],"think":"What would go wrong if you left out the adults?","visual":null,"id":"m08l02-q4","kind":"practice","options":["12 seats and only the 5 children.","9 am and 3 adults.","12 seats, 5 children and 3 adults.","Only the start time."],"answer":2,"optionWhy":["This would ignore seats needed by the adults.","The start time does not provide the capacity or full passenger count.","The capacity and both groups of passengers determine the empty seats.","A clock time does not count empty seats."]},{"stem":"A puppet show has 7 puppets. Each needs one stand. The theatre already has 4 stands, and the show starts at 2 pm.","ask":"How many additional stands are needed?","explanation":["One stand per puppet means 7 stands are needed.","Four stands are already available.","Three additional stands fill the gap; the start time is irrelevant."],"hints":["How many stands are needed altogether?","Subtract the stands already available, not the start hour."],"think":"Draw seven places and fill four to show the missing stands.","visual":null,"id":"m08l02-q5","kind":"transfer","options":["2 stands.","11 stands.","7 more stands.","3 stands."],"answer":3,"optionWhy":["Two is the start hour, not the missing number of stands.","Adding puppets and existing stands does not find what is missing.","This ignores the four stands already available.","Seven needed minus four available leaves three missing."]}],"activity":{"title":"Cross out a distraction","instructions":"Write a short pretend shop problem: \"I have 9 coins. A badge costs 4 coins. The shop has 3 windows. How many coins remain?\" Circle the two useful quantities and cross out the distracting number. Solve it, then write a new question that does use the window count. Ask a partner to create another example for you.","coach":"The child should identify units and the requested relationship before calculating. Avoid a rule that every problem always contains one extra number."},"reflection":"How did the question tell you which numbers belonged together?","transfer":"In a word problem, name the unit of each number before using it.","parent":{"aim":"Observe whether the child selects relevant quantities and the correct relationship.","prompt":"What does each number measure?","pitfall":"Adding all visible numbers, confusing a label with a quantity, or answering in coins when asked for objects.","success":"The child explains why each chosen quantity is needed and checks the answer's unit."}},{"id":"m08l03","module":8,"lesson":3,"title":"Plan time and a small budget","goal":"I can combine small amounts and check a plan against a limit.","story":"Bella is planning a miniature fair with a small purse and a short afternoon. Every choice uses some coins or minutes. Pip has plenty of exciting ideas, but they must fit the limits. Work out what is used, what remains and whether there is room for one more activity.","tool":"Use, compare, check","steps":["Find the available coins or minutes.","Work out the full amount the plan needs.","Compare with the limit and check what remains."],"worked":{"stem":"Bella has 8 coins. A show ticket costs 3 coins and a snack costs 2 coins. She buys one of each and nothing else.","ask":"How many coins remain?","explanation":["The ticket and snack cost 3 plus 2, which is 5 coins.","Bella begins with 8 coins.","Subtract 5 from 8 to get 3 coins remaining."],"hints":["Combine both costs first.","Now subtract the total cost from the starting money."],"think":"How can you check that spent coins plus remaining coins equal 8?","visual":{"type":"table","headers":["Item","Cost"],"rows":[["Show ticket","3 coins"],["Snack","2 coins"]],"caption":"Bella has 8 coins"},"id":"m08l03-w","kind":"worked","options":["5 coins.","6 coins.","1 coin.","3 coins."],"answer":3,"optionWhy":["Five is the amount spent, not the amount remaining.","This subtracts only the snack and ignores the ticket.","The two stated purchases do not use 7 coins.","The purchases cost 5 coins, leaving 8 minus 5, which is 3."]},"questions":[{"stem":"A puppet activity starts at 2:00 pm. The play lasts 12 minutes, followed immediately by 5 minutes of tidy-up. There is no break between them.","ask":"When are both parts finished?","explanation":["The play uses 12 minutes.","Tidy-up adds another 5 minutes, for 17 altogether.","Seventeen minutes after 2:00 pm is 2:17 pm."],"hints":["Both parts happen one after the other.","Add their lengths before moving along the clock."],"think":"Draw two joined time blocks to show the total.","visual":{"type":"table","headers":["Part","Length"],"rows":[["Play","12 minutes"],["Tidy-up","5 minutes"]],"caption":"Starts at 2:00 pm, with no gap"},"id":"m08l03-q1","kind":"guided","options":["2:17 pm.","2:12 pm.","2:05 pm.","2:07 pm."],"answer":0,"optionWhy":["Twelve plus five is seventeen minutes after 2:00 pm.","This is the end of the play, before tidy-up.","This counts only tidy-up and omits the play.","Subtracting the durations does not find their combined length."]},{"stem":"Ari has 8 coins. He must buy one string costing 3 coins and two paper sheets costing 2 coins each. He buys only these items.","ask":"Will he have enough, and how much will remain?","explanation":["Two sheets cost 2 plus 2, which is 4 coins.","Adding the string gives a total cost of 7.","Eight coins cover the cost and leave 1 coin."],"hints":["Remember there are two sheets.","Count every required item before comparing with 8 coins."],"think":"What mistake would leave 3 coins in your answer?","visual":{"type":"table","headers":["Item","Price for one","Number needed"],"rows":[["String","3 coins","1"],["Paper sheet","2 coins","2"]],"caption":"Ari has 8 coins"},"id":"m08l03-q2","kind":"practice","options":["Yes; 3 coins will remain.","Yes; 1 coin will remain.","No; he needs 1 more coin.","Yes; all 8 coins will remain."],"answer":1,"optionWhy":["This counts only one of the two paper sheets.","The cost is 3 plus 2 plus 2, which is 7 out of 8 coins.","The full cost is 7, which is less than 8.","Buying the required items uses 7 coins."]},{"stem":"The club has 10 minutes and wants to play exactly two games, with no gap between them. Drawing takes 6 minutes, guessing takes 8, and sorting takes 4.","ask":"Which pair fits in the available time?","explanation":["The plan must contain exactly two games and use at most 10 minutes.","Drawing and sorting total 6 plus 4, which is 10.","The other pairs exceed the limit, and all three also break the two-game rule."],"hints":["Check both the number of games and the total minutes.","Compare each pair with the ten-minute limit."],"think":"Explain why a plan must pass both checks.","visual":{"type":"table","headers":["Game","Length"],"rows":[["Drawing","6 minutes"],["Guessing","8 minutes"],["Sorting","4 minutes"]],"caption":"Choose exactly two games in 10 minutes"},"id":"m08l03-q3","kind":"practice","options":["Drawing and guessing.","Guessing and sorting.","Drawing and sorting.","All three games."],"answer":2,"optionWhy":["Six plus eight is fourteen, which exceeds ten.","Eight plus four is twelve, which exceeds ten.","Six plus four is ten minutes, exactly within the limit.","This is three games and takes eighteen minutes."]},{"stem":"Mia starts packing at 9:30 am. Packing takes 10 minutes. She then walks straight to the library in 5 minutes.","ask":"At what time does she reach the library?","explanation":["Packing ends at 9:40 am.","The five-minute walk begins immediately afterwards.","Mia reaches the library at 9:45 am."],"hints":["Do the activities happen at the same time or one after another?","Find the end of packing, then add the walk."],"think":"What information would change if she took a break?","visual":null,"id":"m08l03-q4","kind":"practice","options":["9:40 am.","9:35 am.","9:25 am.","9:45 am."],"answer":3,"optionWhy":["That is when packing finishes, before the walk.","This includes the walk but omits packing.","Both activities move time forwards, not backwards.","Ten minutes plus five minutes takes her fifteen minutes past 9:30."]},{"stem":"A puppet performance begins at 3:20 pm. The actors need 15 uninterrupted minutes to get ready and must finish getting ready by the start.","ask":"What is the latest time they can begin getting ready?","explanation":["The finishing deadline is 3:20 pm.","Count backwards 15 minutes from that deadline.","Starting at 3:05 pm uses all fifteen minutes and finishes on time."],"hints":["You know the finish and need the start.","Count backwards, then check by counting forwards."],"think":"How does a forward check confirm your backward calculation?","visual":null,"id":"m08l03-q5","kind":"transfer","options":["3:05 pm.","3:15 pm.","3:20 pm.","3:35 pm."],"answer":0,"optionWhy":["Fifteen minutes from 3:05 ends exactly at 3:20.","Only five minutes remain, which is not enough.","Starting then leaves no preparation time before the performance.","That is after the performance is meant to start."]}],"activity":{"title":"Plan a ten-minute fair","instructions":"Make three activity cards lasting 3, 4 and 6 minutes. Give yourself a limit of 10 minutes and choose two different activities, with no waiting time between them. Find every pair that fits. Then change the limit to 8 minutes and check again. Explain why a previously allowed pair may no longer fit.","coach":"With 10 minutes, the pairs 3+4, 3+6 and 4+6 fit. With 8 minutes, only 3+4 fits. Check both activities are different and both durations are included."},"reflection":"Did you work forwards from a start, or backwards from a deadline?","transfer":"Plan a short reading or performance session by adding its parts and checking the available time.","parent":{"aim":"Observe whether the child includes every required part and compares the total with a limit.","prompt":"Have we counted everything the plan uses?","pitfall":"Leaving out repeated items or tidy-up time, confusing spent with remaining, or moving forwards when finding a latest start.","success":"The child gives a feasible plan and checks it by recombining the parts."}},{"id":"m08l04","module":8,"lesson":4,"title":"Find what runs out first","goal":"I can find the resource that limits how many complete sets we can make.","story":"The theatre fair has enough stickers for lots of gift bags, but fewer pencils. Pip
