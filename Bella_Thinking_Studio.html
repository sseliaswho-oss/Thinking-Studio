<script id="curriculum-data" type="application/json">{"version":"1.0","modules":[{"id":1,"title":"Clue Detectives","description":"Notice what you know. Discover what the clues really say.","icon":"search","tint":"#e8f2e8","accent":"#34775b"},{"id":2,"title":"Possibility Judges","description":"Explore what must, could and cannot be true.","icon":"question","tint":"#fdf0d6","accent":"#a2762c"},{"id":3,"title":"Rule Lab","description":"Follow a rule. Find out what it does and does not tell you.","icon":"rule","tint":"#eeeafa","accent":"#7e659c"},{"id":4,"title":"Line-up & Match","description":"Put clues together to find places, pairs and possibilities.","icon":"sort","tint":"#e9eff6","accent":"#527a9b"},{"id":5,"title":"Reason Workshop","description":"Find a claim. Choose reasons that actually support it.","icon":"chat","tint":"#fbece5","accent":"#b56d51"},{"id":6,"title":"Counterexample Detectives","description":"Test big claims with small but powerful examples.","icon":"shield","tint":"#e7f1e9","accent":"#497d5c"},{"id":7,"title":"Cause Investigators","description":"Ask what else could explain what happened.","icon":"cause","tint":"#eeeafa","accent":"#7b6498"},{"id":8,"title":"Information Planners","description":"Choose useful information and make a thoughtful plan.","icon":"table","tint":"#fcf1d9","accent":"#a37b2b"},{"id":9,"title":"Shape Architects","description":"Turn, reflect and build. See things from a new angle.","icon":"shape","tint":"#e7f0f4","accent":"#4c8295"},{"id":10,"title":"Possibility Explorers","description":"Make a careful list. Look for what you might have missed.","icon":"list","tint":"#f9eae6","accent":"#b16d5b"},{"id":11,"title":"Activity Planners","description":"Choose a goal, check the rules and adapt your plan.","icon":"calendar","tint":"#e7f0e3","accent":"#6a8852"},{"id":12,"title":"Thinking Adventures","description":"Choose your tools and bring your new skills together.","icon":"compass","tint":"#f1eafa","accent":"#87649f"}],"lessons":[{"id":"m01l01","module":1,"lesson":1,"title":"What Do We Know?","goal":"I can point to information the story actually gives me.","story":"Pip the little robot is opening a detective desk in the library. His notebook has a special first page: What we know. Before he solves anything, he writes only things he can point to in the clues. Help Pip fill that page without adding details the story has not given him.","tool":"Point to the clue","steps":["Find the sentence that gives the information.","Say it in your own words without adding a detail.","Check that your answer matches that sentence."],"worked":{"stem":"On the library table are a red book and a blue cup. A note beside them says, \"Please leave these here.\" The story does not tell us who put them there.","ask":"Which statement is given by the story?","options":["The cup is blue.","The book belongs to Pip.","The cup contains juice.","Someone left in a hurry."],"answer":0,"hints":["Look for a detail you can point to in a sentence.","Check what the story says about the cup."],"explanation":["The first sentence names a red book and a blue cup.","Blue is a colour directly given for the cup.","We can record that colour without guessing an owner or a reason."],"optionWhy":["The story directly describes a blue cup.","The owner of the book is not named.","The story gives the cup's colour, not its contents.","Nothing tells us how quickly anyone left."],"think":"Point to the words that prove your answer.","visual":null,"id":"m01l01-w","kind":"worked"},"questions":[{"stem":"A picnic box holds three apples and one banana. The lid is open. Mia stands beside the box. No one has tasted the fruit yet.","ask":"What do we know for sure from these clues?","options":["It is sunny outside.","There are three apples in the box.","The apples taste sweet.","Mia packed the box."],"answer":1,"hints":["Separate a counted object from an imagined detail.","Read the first sentence again."],"explanation":["The first clue tells us exactly what the box holds.","It says three apples and one banana.","We know the apple count, but not who packed the fruit or how it tastes."],"optionWhy":["The weather is not described.","The number of apples is stated directly.","No one has tasted them, and the taste is not stated.","Standing beside a box does not tell us who packed it."],"think":"Name one other detail the story gives you.","visual":null,"id":"m01l01-q1","kind":"guided"},{"stem":"The play programme lists Mia and Leo. Beside Mia's name it says \"blue cape\". Beside Leo's name it says \"striped hat\". It does not list their characters.","ask":"Which detail can go on the What We Know page?","options":["Mia feels nervous.","Mia speaks first.","Leo is listed with a striped hat.","Leo plays a pirate."],"answer":2,"hints":["Read the words beside each name.","A costume detail is not the same as a character or a feeling."],"explanation":["The programme gives a name and a costume detail for each person.","Leo is paired with the words striped hat.","We can record that pairing, while his character and speaking order remain unknown."],"optionWhy":["The programme does not describe Mia's feelings.","No speaking order is given.","That is exactly what the programme says beside Leo's name.","A striped hat does not establish a character, and no character is listed."],"think":"What would you need to see to know who speaks first?","visual":{"type":"table","headers":["Performer","Costume note"],"rows":[["Mia","Blue cape"],["Leo","Striped hat"]],"caption":"The programme lists costume details only."},"id":"m01l01-q2","kind":"practice"},{"stem":"A small robot has two wheels and one green lamp. Its name card says \"Dot\". The robot is not moving while Bella looks at it.","ask":"Which statement repeats a given fact?","options":["Dot needs a new battery.","Dot is waiting for lunch.","Dot can climb stairs.","Dot has two wheels."],"answer":3,"hints":["Look for a number or label stated in the clues.","Being still tells us what Dot is doing, not why."],"explanation":["The description says the robot has two wheels.","The name card identifies the robot as Dot.","So Dot has two wheels; other abilities and needs are not given."],"optionWhy":["Being still does not reveal the battery's condition.","The story gives no reason why Dot is still.","No climbing ability is described.","Two wheels are explicitly described."],"think":"Say one thing we still do not know about Dot.","visual":null,"id":"m01l01-q3","kind":"practice"},{"stem":"A museum display contains a wooden box. Its card says \"Box 6\". The box has a round handle, and its lid is shut. The card gives no age or owner.","ask":"Which statement is supported directly?","options":["The box has a round handle.","The box is one hundred years old.","The box holds gold coins.","A king once owned the box."],"answer":0,"hints":["Find a description you do not have to imagine.","Check the sentence about the handle and lid."],"explanation":["The story describes the box and its handle.","It specifically says the handle is round.","We can record the shape without inventing an age, owner or contents."],"optionWhy":["The handle's shape is explicitly given.","The display gives no age.","A shut lid does not reveal the contents.","No owner is named."],"think":"How could we find out more about the box without guessing?","visual":null,"id":"m01l01-q4","kind":"practice"},{"stem":"Bella's activity card says: Tuesday, art club; Thursday, music club. It gives no information about the other days or about which club she likes most.","ask":"Which statement can we read from the card?","options":["Art club lasts two hours.","Music club is on Thursday.","Bella likes music more than art.","Bella has no activities on Friday."],"answer":1,"hints":["Use the day and activity that appear together.","Do not turn a missing entry into a statement about that day."],"explanation":["The card pairs Tuesday with art and Thursday with music.","The music entry is beside Thursday.","We know that day; preferences and other days are still unknown."],"optionWhy":["The card gives a day but no length of time.","The Thursday entry says music club.","A timetable does not give her preference.","Friday is not described."],"think":"Find another fact in a real timetable or book cover.","visual":{"type":"table","headers":["Day","Activity"],"rows":[["Tuesday","Art club"],["Thursday","Music club"]],"caption":"Only these two activities are listed."},"id":"m01l01-q5","kind":"transfer"}],"activity":{"title":"The Evidence Tray","instructions":"Place a pencil, a spoon and a toy on a tray. Ask a partner to say three things they can see. After each statement, point to the object or feature that supports it. Then make one guess about an owner or a use. Put the guess on a separate paper labelled Maybe.","coach":"A colour, count or position can be checked on the tray. An owner or purpose needs another clue unless it has been stated."},"reflection":"Which answer could you prove by pointing to one clue?","transfer":"When you read a page, name one thing the author actually tells you and one thing you still want to know.","parent":{"aim":"Notice whether Bella identifies a stated fact without adding an owner, feeling or cause.","prompt":"Which words in the story show you that?","pitfall":"Treating a plausible story detail as if it had been stated.","success":"She points to a relevant sentence and keeps her answer within what it says."}},{"id":"m01l02","module":1,"lesson":2,"title":"Seen or Guessed?","goal":"I can tell a stated observation from an explanation someone has guessed.","story":"Pip finds wet patches near the puppet theatre and announces that a dragon must have sneezed. Bella laughs, then opens the clue notebook. Wet patches are something they can see. The dragon story is an explanation to check. Today you will help the detective team keep observations and guesses on different pages.","tool":"Seen or guessed?","steps":["Name what is actually described.","Notice any extra reason, feeling or event added to it.","Keep that extra idea as a possibility until there is evidence."],"worked":{"stem":"Bella sees a wet path, a puddle and three paw-shaped marks. Pip says, \"Rain made the path wet.\" No one has seen what made the water appear.","ask":"Which statement is a guess rather than a stated observation?","options":["There is a puddle.","There are three paw-shaped marks.","Rain made the path wet.","The path is wet."],"answer":2,"hints":["An observation says what is there. An explanation adds why.","Look for a statement naming a cause."],"explanation":["The clues directly describe water and marks.","They do not describe rain or any other cause of the water.","Rain is an explanation to investigate, not a fact established by these clues."],"optionWhy":["The puddle is explicitly described.","The marks and their number are stated.","The cause of the water has not been observed or given.","Bella sees the wet path."],"think":"Think of another way a path could become wet.","visual":null,"id":"m01l02-w","kind":"worked"},"questions":[{"stem":"A classroom window is open. A paper lies on the floor below it. The paper has a blue drawing. Leo says, \"The wind blew it off the desk.\" Nobody saw it fall.","ask":"Which statement adds an unconfirmed explanation?","options":["The window is open.","A paper is on the floor.","The drawing is blue.","The wind blew the paper off the desk."],"answer":3,"hints":["Look for an event no one saw.","The position of the paper does not by itself tell us how it got there."],"explanation":["We know the window is open and the paper is on the floor.","We do not know how the paper moved there.","Wind is possible, but it remains a guess from these clues."],"optionWhy":["This is a stated observation.","Its position is stated.","The colour of the drawing is stated.","No one saw the fall, and the cause is not given."],"think":"What might you ask someone who was in the room?","visual":null,"id":"m01l02-q1","kind":"guided"},{"stem":"In the puppet show, a rabbit puppet sits with its head down. Its ears are folded and its paws are together. No words explain how the character feels.","ask":"Which statement describes what is shown without guessing a feeling?","options":["The puppet's head is down.","The rabbit is sad.","The rabbit is worried about a test.","The rabbit wants to go home."],"answer":0,"hints":["Look for a body position rather than a feeling.","Several feelings could fit the same pose."],"explanation":["The description gives the puppet's head, ear and paw positions.","It does not give a reason for the pose.","Head down is an observation; a feeling would need more context."],"optionWhy":["The position of the head is directly described.","That feeling is one interpretation, but it is not stated.","Neither a test nor that worry is mentioned.","The character's wish is not given."],"think":"Act out the same pose with two different possible feelings.","visual":null,"id":"m01l02-q2","kind":"practice"},{"stem":"An empty plate is on the table. There are crumbs beside it. Nia is sitting nearby. Sam says, \"Nia ate the biscuit.\" No one saw who ate anything.","ask":"What is the most careful judgement?","options":["Nobody ate any food.","We do not know who ate the biscuit.","Nia definitely ate it.","Sam definitely ate it."],"answer":1,"hints":["Separate the nearby person from the unseen action.","Would another person eating earlier also fit these clues?"],"explanation":["We know a plate, crumbs and a nearby person are present.","No clue connects a particular person to eating the biscuit.","The eater is unknown from this information."],"optionWhy":["The clues also do not establish that no food was eaten.","Being nearby is not enough to identify who ate it.","The clues do not establish that Nia ate it.","Nothing establishes that Sam ate it either."],"think":"Say the observation without naming a person as the eater.","visual":null,"id":"m01l02-q3","kind":"practice"},{"stem":"Dot the robot stops moving. Its amber lamp is on. Pip thinks the battery is empty, but no battery test has been done and no instruction explains the amber lamp.","ask":"Which statement belongs on the observation page?","options":["Dot is broken.","Amber always means an empty battery.","Dot's amber lamp is on.","Dot's battery is empty."],"answer":2,"hints":["A lamp colour is visible; its meaning needs a rule or a test.","Look for the statement about what Dot is doing now."],"explanation":["The lamp is observed to be amber and on.","No clue explains the lamp's meaning or the battery's state.","Record the lamp observation and investigate the explanation separately."],"optionWhy":["Stopping does not by itself prove a fault.","No meaning for the amber lamp is given.","The lamp being on is directly described.","The battery has not been tested."],"think":"What useful information could Dot's instruction card give us?","visual":null,"id":"m01l02-q4","kind":"practice"},{"stem":"A story says, \"Ava smiled when she opened the envelope.\" It does not say what was inside. Pip claims, \"The envelope held a party invitation.\"","ask":"Which part is Pip adding to the story?","options":["Ava smiled.","Ava opened an envelope.","The smile happened when she opened it.","The envelope held a party invitation."],"answer":3,"hints":["Check what is inside the quotation and what Pip adds.","A smile can fit more than one possible surprise."],"explanation":["The author tells us about opening an envelope and smiling.","The author does not tell us its contents.","The invitation is Pip's interpretation, so we should keep it as a possibility."],"optionWhy":["The story directly says she smiled.","Opening an envelope is directly stated.","The story gives that timing.","The contents are not stated."],"think":"When reading, can you label a character detail as given or inferred?","visual":null,"id":"m01l02-q5","kind":"transfer"}],"activity":{"title":"Two Captions","instructions":"Make a pose with a toy or ask a partner to freeze in a pose. Write or say one caption describing a visible position. Then offer two different possible explanations for the pose. Ask your partner which caption is an observation and which captions would need more evidence. Swap roles and use a new pose.","coach":"For a toy lying down, \"The toy is lying down\" is observable. Being sleepy or pretending to swim are possible explanations, not certain conclusions."},"reflection":"Which detail tempted you to guess a reason too quickly?","transfer":"During a story or play, ask what a character did before guessing why they did it.","parent":{"aim":"Observe whether she separates a described event from its possible cause or meaning.","prompt":"What part could we see, and what part did someone add?","pitfall":"Assuming that a familiar explanation must be the only one.","success":"She can state an observation and name at least one alternative explanation without calling either certain."}},{"id":"m01l03","module":1,"lesson":3,"title":"Which Clue Helps?","goal":"I can choose information that helps answer the exact question.","story":"The detective desk has received a mountain of notes. One tells Pip the colour of a lunchbox. Another tells him the day of a show. Both may be true, but only one will help with the question he is trying to answer. Today you will sort helpful clues from interesting distractions.","tool":"Question first","steps":["Say exactly what you are trying to find.","Ask what each clue tells you about that question.","Choose a clue that separates the remaining possibilities."],"worked":{"stem":"A lost bottle is either Mia's or Leo's. Each bottle has exactly one sticker. Mia's is a star; Leo's is a moon. Both bottles are blue and the same size.","ask":"Which detail would identify whose bottle was found?","options":["Whether it has a star or a moon sticker.","Whether it is blue.","Whether it is the same size as Leo's.","Whether today is Tuesday."],"answer":0,"hints":["Look for a difference between the two possibilities.","A clue shared by both bottles will not identify one owner."],"explanation":["There are two possible owners.","Colour and size are shared, but stickers are different.","Checking the sticker separates Mia's bottle from Leo's."],"optionWhy":["The sticker differs between the two possible owners.","Both possible bottles are blue.","Both possible bottles have the same size.","The day does not distinguish the two bottles."],"think":"Explain why a true clue can still be unhelpful.","visual":null,"id":"m01l03-w","kind":"worked"},"questions":[{"stem":"A bag belongs to either Ava or Ben. The two bags look alike. Each bag has its owner's name on a card inside. Pip wants to find the owner of the bag on the desk.","ask":"What should Pip check?","options":["Whether Pip likes the bag.","The name on the card inside the bag.","The colour of the desk.","The number of windows in the room."],"answer":1,"hints":["What information names the person we are looking for?","The useful clue is attached to the bag itself."],"explanation":["The question is about the owner.","The story says each bag contains its owner's name.","Reading that card answers the ownership question directly."],"optionWhy":["Pip's preference does not identify who owns it.","The card directly names the bag's owner.","The desk's colour does not identify the owner.","The windows have no stated link to the bag."],"think":"Name the question before naming your clue.","visual":null,"id":"m01l03-q1","kind":"guided"},{"stem":"Bella wants to know which club meets on Monday. A notice lists club days. A different poster lists the colour of each club's logo. A third poster names the school mascot.","ask":"Which source should Bella read first?","options":["The poster naming the mascot.","The weather forecast.","The notice listing club days.","The poster listing logo colours."],"answer":2,"hints":["The question contains a day.","Choose the source organised by when clubs meet."],"explanation":["Bella is asking when a club meets.","The club-days notice contains that kind of information.","The other posters could be accurate without answering her question."],"optionWhy":["The mascot does not answer the timetable question.","No rule links the weather to the club schedule.","It gives the day information needed for the question.","Logo colours do not say when clubs meet."],"think":"How would your choice change if the question were about a logo?","visual":null,"id":"m01l03-q2","kind":"practice"},{"stem":"Two library books have blue covers. One is about rockets and one is about fish. Bella wants the book about rockets. The title page of each book names its topic.","ask":"Which check will help Bella choose?","options":["Check that the cover is blue.","Count the library chairs.","Find out Pip's favourite colour.","Read the topic on the title page."],"answer":3,"hints":["Which feature differs in a way that matches Bella's goal?","Her goal is about a topic, not a colour."],"explanation":["Bella needs to distinguish two topics.","Both books share a cover colour, so colour does not help.","The title page names the topic and can identify the rocket book."],"optionWhy":["Both covers are blue.","The chair count has no stated connection to the books' topics.","Pip's colour preference does not identify the rocket book.","The topics distinguish rockets from fish."],"think":"Say why the blue-cover clue is true but insufficient.","visual":null,"id":"m01l03-q3","kind":"practice"},{"stem":"A red cupboard opens only with its matching key. One key has a red-cupboard label; another has a green-cupboard label. The labels correctly name the cupboard each key opens. Pip needs the red cupboard.","ask":"Which clue should Pip use?","options":["The cupboard name on each key's label.","How shiny each key looks.","The colour of Pip's shoes.","The time of day."],"answer":0,"hints":["Find the stated rule connecting keys to cupboards.","Only one listed feature is said to identify the correct cupboard."],"explanation":["The labels are given as reliable cupboard identifiers.","Pip needs the red cupboard.","The red-cupboard label is the relevant connection."],"optionWhy":["The story says the labels correctly identify the cupboards.","Shininess is not linked to the lock in the rules.","Pip's shoes do not identify a key.","The lock rule does not depend on the time."],"think":"What makes this label evidence rather than a guess?","visual":null,"id":"m01l03-q4","kind":"practice"},{"stem":"A snack job needs five apples. Three apples are already packed. Bella wants to work out how many more apples to add. A note also says the basket is yellow and the ribbon is long.","ask":"Which information matters for the apple calculation?","options":["Bella likes baskets.","Five are needed and three are already packed.","The basket is yellow.","The ribbon is long."],"answer":1,"hints":["Which clues are counts connected to the task?","Compare the target count with the packed count."],"explanation":["The job sets a target of five apples.","Three of those apples are already packed.","The target and current count answer the question; the decoration does not."],"optionWhy":["A preference does not determine the missing apples.","Those two counts determine how many apples are missing.","The basket colour does not affect the apple count.","Ribbon length does not affect the number of apples needed."],"think":"Use the helpful information to work out how many more apples are needed.","visual":null,"id":"m01l03-q5","kind":"transfer"}],"activity":{"title":"Clue Post Office","instructions":"Write the question \"Which toy is mine?\" on paper. Put out two toys and give each a different name label but the same colour tag. Make three clue cards: a name, the shared colour and the room's name. Ask a partner which card identifies a toy. Then change the question to \"What colour tag do both toys have?\"","coach":"The name helps identify an owner. When the question changes to colour, the shared colour clue becomes useful. Relevance depends on the question."},"reflection":"Which clue became useful only after the question changed?","transfer":"Before solving a maths problem, say which facts are needed and which details just set the scene.","parent":{"aim":"Notice whether she selects evidence for the exact task rather than its vividness.","prompt":"What does this clue tell us about the question?","pitfall":"Choosing the most interesting detail even when both possibilities share it.","success":"She explains how a clue separates possibilities or supplies the information the question needs."}},{"id":"m01l04","module":1,"lesson":4,"title":"A New Clue Changes Things","goal":"I can keep or change a judgement when new information arrives.","story":"Pip has written his first idea in pencil, leaving room for a new clue. Good detectives can change their minds, and they can also explain why an extra clue has not settled a mystery yet. Help Pip compare each new clue with the possibilities he already has, then update the notebook carefully.","tool":"Keep, cross out, or wait","steps":["List the possibilities allowed by the first clues.","Check each possibility against the new clue.","Keep only those that still fit, even if more than one remains."],"worked":{"stem":"A note is in either the library or the music room, and nowhere else. Pip first guesses the library. A new clue says the note is not in the library.","ask":"What should Pip conclude now?","options":["The note is in the garden.","Both rooms are still possible.","The note is in the music room.","The note is still in the library."],"answer":2,"hints":["Use both the original choices and the new clue.","Cross out the place the new clue excludes."],"explanation":["Only the library and music room were possible.","The new clue removes the library.","The music room is the only remaining possibility."],"optionWhy":["The original clue says it is in one of the two named rooms only.","The library is no longer possible.","That is the only allowed place left after the library is excluded.","The new clue rules out the library."],"think":"Finish: I changed my mind because ...","visual":null,"id":"m01l04-w","kind":"worked"},"questions":[{"stem":"A toy rabbit is either under the bed or under the chair. Those are the only possible places. Bella checks carefully and finds that it is not under the chair.","ask":"Where must the toy be?","options":["Under the chair.","In the cupboard.","We need a third possible place.","Under the bed."],"answer":3,"hints":["There were exactly two possible places.","Remove the one Bella has checked."],"explanation":["The toy must be under the bed or chair.","It is not under the chair.","It must therefore be under the bed."],"optionWhy":["Bella has checked and excluded the chair.","The first clue rules out every place except bed or chair.","The given clues already leave exactly one place.","The bed is the only allowed place not ruled out."],"think":"Point to the clue that removed one possibility.","visual":null,"id":"m01l04-q1","kind":"guided"},{"stem":"A gift box holds exactly one object: either a silent wooden block or a bell that rings when shaken. Pip guesses the block. Bella shakes the box and hears a ring coming from inside it. Both objects behave as described.","ask":"How should Pip update his guess?","options":["Change it to the bell.","Keep the wooden block.","Say the box holds both objects.","Say the box is empty."],"answer":0,"hints":["Which object matches the new sound?","Respect the rule that there is exactly one object."],"explanation":["The original possibilities were a silent block or a ringing bell.","The box rings when shaken.","Only the bell fits the original rule and the new clue."],"optionWhy":["The bell rings, while the block is specified to be silent.","A ringing sound conflicts with the silent-block description.","The box contains exactly one object.","The box is given to contain one of the two objects."],"think":"Which words make the new clue decisive?","visual":null,"id":"m01l04-q2","kind":"practice"},{"stem":"A mystery card is one of these: a red circle, a blue square or a green triangle. A new clue says it has four sides. These are the only three cards, and only the square has four sides.","ask":"Which card remains possible?","options":["All three cards.","The blue square.","The red circle.","The green triangle."],"answer":1,"hints":["Check each listed shape against the side clue.","Use the clue that only the square has four sides."],"explanation":["There are three allowed cards.","The new clue requires four sides, which only the square has.","The blue square is the only card left."],"optionWhy":["The new clue excludes two of the three cards.","It is the only listed card with four sides.","The circle does not have four sides.","The triangle does not have four sides."],"think":"Name the two possibilities you can cross out.","visual":{"type":"tokens","items":[{"label":"Red circle","color":"#ec6c58","shape":"circle"},{"label":"Blue square","color":"#4385bd","shape":"square"},{"label":"Green triangle","color":"#398373","shape":"triangle"}],"caption":"The complete set of possible cards."},"id":"m01l04-q3","kind":"practice"},{"stem":"The missing notebook is either Ava's thin red notebook or Ben's thin green notebook. Pip guesses Ava's. A new clue says, \"The notebook is thin.\" No other clue has been found.","ask":"What does the new clue let us conclude?","options":["It must be Ben's notebook.","Neither notebook can be the missing one.","Either notebook is still possible.","It must be Ava's notebook."],"answer":2,"hints":["Does the new feature belong to one possibility or both?","A new clue does not always remove a possibility."],"explanation":["The original choices differ in colour but are both thin.","The new clue repeats a shared feature.","Both choices remain possible, so Pip should not become certain."],"optionWhy":["Ava's notebook is also thin.","Both match the new thin-notebook clue.","Both notebooks are thin, so the clue does not separate them.","Ben's notebook is thin too."],"think":"What new clue would actually help choose between them?","visual":null,"id":"m01l04-q4","kind":"practice"},{"stem":"In a story, the next visitor is either Jo or Sam. Each carries exactly one case on these visits: Jo's case is yellow and Sam's is purple. The one new visitor arrives carrying a purple case. Jo and Sam are the only possible visitors.","ask":"Which prediction now fits all the clues?","options":["Jo is the visitor.","Both Jo and Sam arrived.","The visitor cannot be identified.","Sam is the visitor."],"answer":3,"hints":["Use the story's own rule for each visitor.","Compare the new case colour with both descriptions."],"explanation":["Jo and Sam are the only possible visitors.","The visitor has the case colour given for Sam.","Sam is the prediction consistent with all the stated clues."],"optionWhy":["Jo's case is specified to be yellow on these visits.","The story describes one next visitor.","The case colour separates the two named possibilities.","Sam matches the purple-case clue; Jo does not."],"think":"When reading your next story, notice a clue that changes your prediction.","visual":null,"id":"m01l04-q5","kind":"transfer"}],"activity":{"title":"Mystery Card Update","instructions":"Make three cards: a red circle, a blue square and a red triangle. Ask a partner to secretly choose one. Start by listing all three possibilities. Ask about colour, then about shape. After each answer, cross out only cards that do not fit. Swap roles and try a question whose answer leaves two cards possible.","coach":"If the card is red, two possibilities remain. A shape clue can separate them. Do not force a single answer before the clues justify one."},"reflection":"Did a new clue settle a question, or did it leave more than one possibility?","transfer":"Pause while reading and update a prediction when the author provides a new detail.","parent":{"aim":"Observe whether she updates a conclusion in proportion to what the new evidence changes.","prompt":"Which possibilities still fit every clue?","pitfall":"Assuming that every new clue must produce a new definite answer.","success":"She can revise a guess, or keep uncertainty, and point to the clue that justifies the change."}},{"id":"m02l01","module":2,"lesson":1,"title":"Must, Could, or Cannot?","goal":"I can tell what has to happen, what may happen, and what cannot happen.","story":"Pip has three drawers in his detective desk: Must, Could and Cannot. A clue sometimes leaves only one answer. Sometimes several answers still fit. Other answers break the clues completely. Help Pip put each judgement in the right drawer, and remember that a possible answer is not always a certain one.","tool":"Check every allowed possibility","steps":["Use the choices and rules the problem gives you.","Ask whether the statement fits every choice, some choices, or no choices.","Use must, could, or cannot to match what you found."],"worked":{"stem":"A bag contains exactly two red counters and one blue counter. There are no other counters inside. Bella will take one counter without looking.","ask":"Which statement is correct?","options":["She cannot take a yellow counter.","She must take a red counter.","She must take a blue counter.","She cannot take a blue counter."],"answer":0,"hints":["Start with the complete list of counters in the bag.","A counter that is not in the bag cannot be selected."],"explanation":["The possible colours are red and blue.","Yellow does not appear among the counters.","A yellow draw is impossible, although either listed colour could be drawn."],"optionWhy":["No yellow counter is in the complete set.","A blue counter is also available.","Red counters are also available.","One blue counter is in the bag."],"think":"Name a colour she could take and explain why it is not certain.","visual":{"type":"tokens","items":[{"label":"Red counter 1","color":"#ec6c58","shape":"circle"},{"label":"Red counter 2","color":"#ec6c58","shape":"circle"},{"label":"Blue counter","color":"#4385bd","shape":"circle"}],"caption":"Every counter in the bag is shown."},"id":"m02l01-w","kind":"worked"},"questions":[{"stem":"Three tickets are on a tray. Their numbers are 1, 2 and 3. Pip will choose exactly one ticket, and he may choose any of the three.","ask":"Which statement correctly describes his choice?","options":["He could choose ticket 4.","He could choose ticket 2.","He must choose ticket 2.","He cannot choose ticket 1."],"answer":1,"hints":["Could means an allowed choice, even if others are allowed too.","Check whether each named ticket is actually on the tray."],"explanation":["Pip may choose 1, 2 or 3.","Number 2 is included among those choices.","Choosing 2 is possible, but the clues do not make it certain."],"optionWhy":["There is no ticket 4 on the tray.","Ticket 2 is one of the permitted choices.","Tickets 1 and 3 are permitted too.","Ticket 1 is explicitly available."],"think":"How would you describe choosing ticket 4?","visual":null,"id":"m02l01-q1","kind":"guided"},{"stem":"A box contains four cards, and every card in it is green. Bella will take one of these cards. There are no cards from any other box in this game.","ask":"What must be true of the card she takes?","options":["It has a star on it.","It is the largest card.","It is green.","It is blue."],"answer":2,"hints":["Must means true for every allowed choice.","Which feature do all four cards share?"],"explanation":["The game uses only the four cards in this box.","Every one of them is green.","Any allowed choice therefore produces a green card."],"optionWhy":["No symbol is specified for the cards.","No sizes or size-based choice are given.","Every available card is green.","No available card is blue."],"think":"Can you say anything certain about its symbol? Why?","visual":null,"id":"m02l01-q2","kind":"practice"},{"stem":"In a story game, Nia will visit either the garden or the library today, but not both. Both places are open, and the story has not said which she chooses.","ask":"Which statement is correct?","options":["Nia must visit the garden.","Nia cannot visit the library.","Nia will visit both places.","Nia could visit the garden."],"answer":3,"hints":["Keep both allowed places in mind.","Check whether a statement claims more certainty than the clues give."],"explanation":["The allowed choices are garden only or library only.","Garden only fits the rule.","So visiting the garden is possible, but it is not guaranteed."],"optionWhy":["The library is also possible.","The library is explicitly permitted.","The rule says not both.","The garden is one of the two allowed choices."],"think":"Draw the two visits that are still possible.","visual":null,"id":"m02l01-q3","kind":"practice"},{"stem":"A game spinner has only a circle section and a triangle section. Either section can be selected. Pip spins it once, and the pointer stops on one section.","ask":"Which result cannot happen in this game?","options":["The pointer stops on a square section.","The pointer stops on the circle section.","The pointer stops on the triangle section.","The pointer stops on one of the two listed sections."],"answer":0,"hints":["A result must refer to a section the spinner actually has.","Compare each option with the complete two-section list."],"explanation":["Only circle and triangle sections exist on the spinner.","A square section is absent.","The pointer cannot stop on a square section in this game."],"optionWhy":["There is no square section.","The circle is an available section.","The triangle is an available section.","Stopping on one of them is required by the description."],"think":"Which two results could happen?","visual":null,"id":"m02l01-q4","kind":"practice"},{"stem":"For a reading activity, Bella must choose exactly one of two books: Forest Tales or Sea Tales. She is allowed to choose either. No preference is given.","ask":"What can we say for certain?","options":["She will choose both books.","She will choose one of those two books.","She will choose Forest Tales.","She will choose Sea Tales."],"answer":1,"hints":["Some certainty can describe the whole set rather than one item.","Use the rule exactly one of these two books."],"explanation":["The two books are the complete set of choices.","The rule requires one choice from that set.","We know the choice will be one of them, even though we cannot name which one."],"optionWhy":["The task permits exactly one, not both.","The task requires exactly one choice from the named pair.","Sea Tales is also permitted.","Forest Tales is also permitted."],"think":"In your next story, find a prediction that is possible but not certain.","visual":null,"id":"m02l01-q5","kind":"transfer"}],"activity":{"title":"Three Judgement Mats","instructions":"Write Must, Could and Cannot on three papers. Put two red counters and one blue counter in a cup. For the next draw, discuss these statements: red, blue, and yellow. Red and blue could happen; yellow cannot. Now replace the blue counter with a red one and reconsider the statement that the next counter is red.","coach":"With three red counters, red must happen. The child should explain how changing the contents changes the strength of the judgement."},"reflection":"What changed a could statement into a must statement?","transfer":"When you make a prediction in a story, choose the word could or must deliberately.","parent":{"aim":"Check whether certainty is matched to the full set of possible outcomes.","prompt":"Does that happen in every allowed case, some cases, or none?","pitfall":"Treating a likely or familiar outcome as a guaranteed one.","success":"She can show an allowed alternative when a must claim is too strong."}},{"id":"m02l02","module":2,"lesson":2,"title":"All, Some, and None","goal":"I can use all, some, and none without stretching what the clues say.","story":"The puppet theatre needs a careful sign writer. A sign saying All hats are red means something different from Some hats are red. Pip keeps mixing them up and sending the actors to the wrong baskets. Help him check every item before choosing a word that describes the group accurately.","tool":"Check the whole group","steps":["Be clear about which group you are describing.","Check each member when the whole group is shown.","Use all for every member, none for zero, and some for at least one."],"worked":{"stem":"A tray contains exactly three counters: two red counters and one blue counter. Every counter is round. These are all the counters on the tray.","ask":"Which statement is true?","options":["No counters are blue.","All counters are blue.","Some counters are red.","All counters are red."],"answer":2,"hints":["Check every counter rather than just the first one.","Some means at least one."],"explanation":["The tray has two red counters and one blue counter.","The red count is greater than zero.","Some are red, while the blue counter prevents all from being red."],"optionWhy":["One counter is blue.","Two counters are red.","At least one counter is red; in fact two are.","The blue counter is not red."],"think":"Point to the counter that disproves All counters are red.","visual":{"type":"tokens","items":[{"label":"Red counter 1","color":"#ec6c58","shape":"circle"},{"label":"Red counter 2","color":"#ec6c58","shape":"circle"},{"label":"Blue counter","color":"#4385bd","shape":"circle"}],"caption":"The complete group of three counters."},"id":"m02l02-w","kind":"worked"},"questions":[{"stem":"Five children are at the craft table. Each of the five has a star sticker. No child at this table is missing a star sticker.","ask":"Which statement describes the whole table correctly?","options":["None of the five has a star sticker.","Exactly one child has a star sticker.","A child at the table has no star sticker.","All five children have a star sticker."],"answer":3,"hints":["All refers to every member of a named group.","Check how many of the five are described as having a sticker."],"explanation":["The group contains five children.","Each of those five has a star sticker.","All five satisfy the sticker description."],"optionWhy":["That contradicts the description of each child.","All five, not just one, have stickers.","The clues explicitly say none is missing one.","Every member of the stated group has one."],"think":"Would this tell us whether every child in the whole school has a sticker?","visual":null,"id":"m02l02-q1","kind":"guided"},{"stem":"A note says, \"Some boxes in this cupboard have ribbons.\" Here some means at least one. The note gives no total number of boxes and no exact ribbon count.","ask":"What does the note guarantee?","options":["At least one box in the cupboard has a ribbon.","Exactly two boxes have ribbons.","Every box has a ribbon.","At least one box has no ribbon."],"answer":0,"hints":["Use the definition supplied in the note.","Do not add an exact count or a claim about boxes without ribbons."],"explanation":["The note defines some as at least one.","It does not say exactly how many, or that any lack ribbons.","Only the presence of at least one ribboned box is guaranteed."],"optionWhy":["That is precisely the meaning of some given in the question.","Some does not specify the number two.","The note does not tell us that all boxes have ribbons.","The note allows all boxes to have ribbons, so this is not guaranteed."],"think":"Could all the boxes have ribbons and still fit this note?","visual":null,"id":"m02l02-q2","kind":"practice"},{"stem":"Bella checks all four seats in the front row. Every one is empty. She has not checked any seat in the back row.","ask":"Which statement follows from her check?","options":["All back-row seats are empty.","None of the front-row seats is occupied.","No seat anywhere in the theatre is occupied.","Some front-row seats are occupied."],"answer":1,"hints":["Keep the group limited to the row Bella checked.","None means zero within that group."],"explanation":["Bella has checked every seat in the front row.","The occupied count in that row is zero.","None there is occupied, but the back row remains unknown."],"optionWhy":["The clues give no information about the back row.","All four checked front-row seats are empty.","The back row has not been checked.","That conflicts with every front-row seat being empty."],"think":"Which words keep the answer from making too large a claim?","visual":null,"id":"m02l02-q3","kind":"practice"},{"stem":"On a shelf are exactly four blocks: a wooden cube, a wooden cylinder, a metal cube and a metal cylinder. These are all the blocks on that shelf.","ask":"Which statement is true?","options":["None of the blocks is metal.","Every wooden block is a cube.","Some blocks on the shelf are wooden.","All cubes on the shelf are wooden."],"answer":2,"hints":["Check both the material and shape named for each block.","One example can prove some; a different example can disprove all."],"explanation":["The shelf includes a wooden cube and a wooden cylinder.","Those are examples of wooden blocks.","So some shelf blocks are wooden; the other listed objects rule out the stronger claims."],"optionWhy":["Two listed blocks are metal.","The wooden cylinder is not a cube.","Two of the four listed blocks are wooden.","The metal cube is a counterexample."],"think":"Name the block that checks the claim Every wooden block is a cube.","visual":{"type":"table","headers":["Block","Material","Shape"],"rows":[["1","Wood","Cube"],["2","Wood","Cylinder"],["3","Metal","Cube"],["4","Metal","Cylinder"]],"caption":"Every block on the shelf."},"id":"m02l02-q4","kind":"practice"},{"stem":"A story lists three visitors at a picnic: Jo brings a sandwich, Sam brings an apple, and Nia brings a sandwich. Each brings only the listed food. These are all the visitors.","ask":"Which statement matches the list?","options":["All visitors bring a sandwich.","No visitor brings an apple.","All visitors bring an apple.","Some visitors bring a sandwich."],"answer":3,"hints":["Keep track of each visitor separately.","Look for an example before saying some."],"explanation":["Jo and Nia are both listed with sandwiches.","Sam has an apple instead.","Some bring sandwiches, while not every visitor does."],"optionWhy":["Sam brings only an apple.","Sam brings an apple.","Jo and Nia bring only sandwiches.","Jo and Nia are examples of visitors with sandwiches."],"think":"Make an all statement that is true of these three visitors.","visual":null,"id":"m02l02-q5","kind":"transfer"}],"activity":{"title":"Build a True Sign","instructions":"Gather four small objects: two pencils and two spoons. Make signs saying All are pencils, Some are pencils and None are pencils. Choose which signs are true for the whole group. Then remove both spoons and check again. Finally replace both pencils with spoons and check the signs once more.","coach":"With only pencils, both All are pencils and Some are pencils are true when some means at least one. Ask the child to explain rather than force exactly one sign."},"reflection":"What did you need to check before using the word all?","transfer":"Notice the words all, some and none in a book and name the group each word refers to.","parent":{"aim":"Watch for accurate group boundaries and the at-least-one meaning of some.","prompt":"Which group are we talking about, and have we checked every member?","pitfall":"Taking some to mean exactly two or necessarily not all.","success":"She can give an example for some and a counterexample to an incorrect all claim."}},{"id":"m02l03","module":2,"lesson":3,"title":"Two Ways It Could Be","goal":"I can show two different situations that both fit the same clues.","story":"Pip wants to close every case after finding one possible answer. Bella suggests building a second scene that obeys the same rules. If both scenes work, the first answer cannot be called certain yet. Today you will use tiny lists, cards and stories to keep more than one valid possibility in view.","tool":"Build a second case","steps":["Make one arrangement that follows every clue.","Change something without breaking a clue.","If both cases work, keep both possibilities."],"worked":{"stem":"Ava and Ben will stand in a line, with one first and one second. No clue says who goes first. Both children must appear exactly once.","ask":"Which pair shows the two allowed orders?","options":["Ava, Ben and Ben, Ava.","Ava, Ben and Ava, Ava.","Ben, Ben and Ben, Ava.","Ava alone and Ben alone."],"answer":0,"hints":["Both children must appear in each complete line.","Try swapping their two positions."],"explanation":["The only rules require two positions and each child once.","Ava first works, and Ben first also works.","Both orders are valid, so the first person is not determined."],"optionWhy":["Both orders use each child once and no rule excludes either.","The second order leaves out Ben and repeats Ava.","The first order repeats Ben and leaves out Ava.","Each allowed line must include both children."],"think":"What extra clue would make only one order possible?","visual":null,"id":"m02l03-w","kind":"worked"},"questions":[{"stem":"One token is hidden in either the red box or the blue box. There are no other possible places, and no clue distinguishes the boxes.","ask":"Which pair of possibilities should Pip keep?","options":["Outside both boxes.","Red box only, or blue box only.","Both boxes at the same time.","Red box only; blue is impossible."],"answer":1,"hints":["Make one scene for each allowed location.","Do not turn one possible location into the only one."],"explanation":["The token has exactly one location among two boxes.","No clue removes either location.","Red only and blue only are two distinct valid situations."],"optionWhy":["The token is specified to be in one of them.","Either single-box location fits all the information.","There is one token with one location.","Nothing rules out the blue box."],"think":"Draw a token in each of two separate possible scenes.","visual":null,"id":"m02l03-q1","kind":"guided"},{"stem":"Leo, Mia and Pip line up once each. Leo must be before Mia. No other rule is given. Read every order from first to last.","ask":"Which pair contains two orders that both follow the rule?","options":["Pip, Mia, Leo and Mia, Pip, Leo.","Leo, Mia, Pip and Mia, Leo, Pip.","Leo, Mia, Pip and Pip, Leo, Mia.","Mia, Leo, Pip and Leo, Pip, Mia."],"answer":2,"hints":["Check the rule separately in each order.","Pip's place is not restricted by the rule."],"explanation":["The only ordering condition is Leo before Mia.","Leo, Mia, Pip satisfies it, and so does Pip, Leo, Mia.","Moving Pip can leave the required relation unchanged."],"optionWhy":["Both orders put Mia before Leo.","The second order reverses the required Leo-before-Mia relation.","Leo comes before Mia in both complete orders.","Mia comes before Leo in the first order."],"think":"Can you find one more allowed order?","visual":null,"id":"m02l03-q2","kind":"practice"},{"stem":"A mystery number is on one of two cards: 2 or 4. A new clue says the number is smaller than 5. Both cards are smaller than 5.","ask":"Which possibilities remain?","options":["Only 2.","Only 4.","Neither 2 nor 4.","Both 2 and 4."],"answer":3,"hints":["Test each candidate rather than choosing the first one that works.","Ask whether the clue removes either card."],"explanation":["The original candidates are 2 and 4.","Each passes the smaller-than-5 test.","Both remain, so that clue does not determine a single number."],"optionWhy":["The clue does not rule out 4.","The clue does not rule out 2.","Both are explicitly smaller than 5.","Each listed number satisfies the new clue."],"think":"Give a clue that would select 4 but not 2.","visual":null,"id":"m02l03-q3","kind":"practice"},{"stem":"Two picnic plates are possible for Bella. Plate A holds only two grapes and a cracker. Plate B holds only two grapes and a carrot. We learn only that Bella's plate has two grapes.","ask":"Which judgement is justified?","options":["Bella could have Plate A or Plate B.","Bella must have Plate A.","Bella must have Plate B.","Neither plate fits."],"answer":0,"hints":["Look at the feature shared by the plates.","Matching a clue does not make one matching option unique."],"explanation":["Both plates include two grapes.","The grape clue does not mention the differing item.","Either plate still fits, and we need more information to choose."],"optionWhy":["Both plates match the only new clue.","Plate B has two grapes too.","Plate A has two grapes too.","Each described plate has exactly two grapes."],"think":"What single item could you ask about to separate the plates?","visual":{"type":"table","headers":["Plate","Contents"],"rows":[["A","Two grapes and a cracker"],["B","Two grapes and a carrot"]],"caption":"The two possible plates."},"id":"m02l03-q4","kind":"practice"},{"stem":"A story character has a badge. In this story, both a garden helper and a library helper wear badges. Those are the only two jobs the character might have. Nothing else about the job is given.","ask":"Which two scenes could both fit the clues?","options":["Working in the library only; the garden is ruled out.","Working in the garden, or working in the library.","Working in the garden, or having no badge.","Working as a pilot, or working as a cook."],"answer":1,"hints":["Use the story's definitions of the two jobs.","The badge is shared by both job descriptions."],"explanation":["The character has a feature shared by both possible jobs.","No other clue distinguishes those jobs.","A garden scene and a library scene can both fit."],"optionWhy":["The garden helper also wears a badge.","Both allowed jobs include a badge.","Having no badge conflicts with the observed badge.","Neither job is among the two allowed possibilities."],"think":"Describe a new story clue that would identify the job.","visual":null,"id":"m02l03-q5","kind":"transfer"}],"activity":{"title":"Two Valid Scenes","instructions":"Write Leo, Mia and Pip on three cards. Make a line with Leo somewhere before Mia. Check that rule, then move Pip and build a different line that still follows it. Keep a drawing of both lines. Try to build a third valid line, then deliberately build one invalid line for your partner to explain.","coach":"The valid orders are Leo-Mia-Pip, Leo-Pip-Mia and Pip-Leo-Mia. A different position for Pip does not necessarily break the required order."},"reflection":"How did your second valid scene change what you could claim?","transfer":"If a story leaves a character's plan unclear, suggest two plans that both fit what has been said.","parent":{"aim":"Check whether she can construct a genuine alternative rather than merely saying maybe.","prompt":"Can you change the scene while keeping every clue true?","pitfall":"Thinking that the first working arrangement must be the only one.","success":"She demonstrates two distinct complete cases and checks each against the same conditions."}},{"id":"m02l04","module":2,"lesson":4,"title":"Do We Have Enough Clues?","goal":"I can recognise when the clues do not yet settle the question.","story":"The detective desk has a new stamp: More information needed. Pip worries that using it means he has failed. Bella shows him that it can be a careful answer. A good detective can explain exactly what is still unknown and choose a useful next question. Let us practise knowing when to stop guessing.","tool":"Name the missing link","steps":["Check what the question asks you to determine.","Try two different answers against every given clue.","If both still work, say what extra information would separate them."],"worked":{"stem":"One coin is hidden in either the yellow box or the green box. Both boxes are closed. The only clue says that the box containing the coin is small, and both boxes are small.","ask":"Can we identify the box containing the coin?","options":["Yes; it is the green box.","Yes; neither box contains it.","No; either box still fits.","Yes; it is the yellow box."],"answer":2,"hints":["A clue must separate the candidates to identify one.","Try placing the coin in each small box in turn."],"explanation":["The coin may be in one of two boxes.","Both boxes match the small-box clue.","Both placements work, so the location cannot yet be identified."],"optionWhy":["No clue singles out green.","The coin is given to be inside one of the boxes.","The size clue is shared by both possible boxes.","No clue singles out yellow."],"think":"Ask one question whose answer would settle the location.","visual":null,"id":"m02l04-w","kind":"worked"},"questions":[{"stem":"Ava is taller than Ben. Cleo is also taller than Ben. The story gives no comparison between Ava and Cleo.","ask":"Who is tallest?","options":["Ava must be tallest.","Cleo must be tallest.","Ben must be tallest.","We cannot tell; Ava, Cleo, or both could be tallest."],"answer":3,"hints":["Find the comparison that is missing.","Try Ava taller than Cleo, Cleo taller than Ava, and both at the same height."],"explanation":["Both Ava and Cleo are above Ben in height.","Their heights relative to each other are not given.","Ava could be taller, Cleo could be taller, or they could be equally tall. Ben cannot be tallest."],"optionWhy":["Nothing compares Ava's height with Cleo's.","Nothing compares Cleo's height with Ava's.","Both given comparisons place Ben below the others.","Their heights may be different or equal; either person or both together could be tallest."],"think":"Which pair of people do we need to compare?","visual":null,"id":"m02l04-q1","kind":"guided"},{"stem":"A book has a blue cover and a picture of a boat. Bella wants to know how many pages it has. No page count, page numbers or other size information is given.","ask":"What is the careful answer?","options":["The page count is not known from these clues.","It has exactly ten pages.","It has exactly twenty pages.","It has no pages."],"answer":0,"hints":["Which given fact tells you a number of pages?","Not being told a count is different from being told zero."],"explanation":["The clues describe the cover and its picture.","Neither clue supplies a page count.","We need to inspect or count the pages rather than invent a number."],"optionWhy":["Cover colour and picture do not provide a page count.","No clue gives the number ten.","No clue gives the number twenty.","Missing information about a count does not make the count zero."],"think":"What could you do to find the missing information?","visual":null,"id":"m02l04-q2","kind":"practice"},{"stem":"There are two possible mystery cards: a red circle and a blue circle. Pip knows the card is round. He wants to identify which of the two it is.","ask":"Which question would settle the mystery?","options":["Is it one of the two listed cards?","Is the card red?","Is the card round?","Is the card a circle?"],"answer":1,"hints":["Choose a feature on which the two cards differ.","A repeated clue will not reduce the possibilities."],"explanation":["The two candidates share a shape but differ in colour.","Asking about redness produces different answers for the candidates.","That question separates the two possibilities and settles which card it is."],"optionWhy":["That is already known and does not distinguish them.","Yes identifies the red card; no identifies the blue card.","Both choices are already known to be round.","Both choices are circles, so either answers yes."],"think":"Explain why asking about the shape does not help.","visual":{"type":"tokens","items":[{"label":"Red circle","color":"#ec6c58","shape":"circle"},{"label":"Blue circle","color":"#4385bd","shape":"circle"}],"caption":"The complete set of mystery cards."},"id":"m02l04-q3","kind":"practice"},{"stem":"A table says Ava has three tokens and Ben has five tokens. It gives no information about Cleo's tokens. Pip wants to know who has the most among all three children.","ask":"What can we conclude?","options":["Ava definitely has the most of all three.","Cleo definitely has the most.","We need Cleo's count before naming who has the most.","Ben definitely has the most of all three."],"answer":2,"hints":["Make sure the comparison includes every person named in the question.","Could the missing count change the winner?"],"explanation":["Ben has more tokens than Ava.","The question also includes Cleo, whose count is missing.","Different possible Cleo counts give different results, so the full comparison is unsettled."],"optionWhy":["Ben already has more than Ava.","Cleo's count is not supplied.","Cleo might have fewer than five or more than five.","Cleo could have more than five."],"think":"Try one Cleo count that makes Ben highest and one that does not.","visual":{"type":"table","headers":["Child","Tokens"],"rows":[["Ava","3"],["Ben","5"],["Cleo","Not given"]],"caption":"Not given does not mean zero."},"id":"m02l04-q4","kind":"practice"},{"stem":"In a play, either Pip or Dot is behind the curtain. Each wears exactly one hat. Pip's hat is red and Dot's is blue. Each also carries a box. Bella sees a box but cannot see the hat.","ask":"What should Bella say?","options":["It must be Pip.","It must be Dot.","Neither character could be there.","Either Pip or Dot could be behind the curtain."],"answer":3,"hints":["Find the shared feature and the distinguishing feature.","Seeing the box does not tell you the hat colour."],"explanation":["Both possible characters carry boxes.","The visible clue therefore matches both.","The hat colour would help, but the box alone leaves the character unknown."],"optionWhy":["Dot carries a box too.","Pip carries a box too.","Both character descriptions fit the box clue.","The visible box is shared by both character descriptions."],"think":"If you were directing the play, what could you reveal next to settle the question?","visual":null,"id":"m02l04-q5","kind":"transfer"}],"activity":{"title":"Ask the Missing Question","instructions":"Draw two houses with blue doors. Give one a round window and the other a square window. Secretly choose a house. Tell your partner only that its door is blue. Let them ask one yes-or-no question to identify it. Discuss why another door-colour question repeats information, then swap roles with two new drawings.","coach":"The window shape separates the houses. Ask the child to say what each possible answer would mean, rather than only naming a feature."},"reflection":"Which missing detail could change the answer?","transfer":"When a story or a maths problem leaves something unclear, name the missing fact before making a guess.","parent":{"aim":"Observe whether she recognises information gaps and asks a discriminating question.","prompt":"Could two different answers still fit? What would separate them?","pitfall":"Interpreting an unknown count as zero or choosing a plausible answer to avoid uncertainty.","success":"She gives two compatible cases or identifies one missing comparison that would resolve the question."}},{"id":"m03l01","module":3,"lesson":1,"title":"Follow the Rule Forward","goal":"I can use an if-then rule when its starting condition is met.","story":"Pip is testing the theatre's tiny rule machine. A card goes in, and the machine follows the instruction printed on its side. Before predicting the result, Bella checks whether the starting condition has actually happened. Join the team and follow each rule one careful step from its beginning to its result.","tool":"Start, then follow","steps":["Find the condition at the start of the rule.","Check whether the story says that condition is met.","If it is met, follow the rule to its stated result."],"worked":{"stem":"A machine follows this rule: If a card has a star, the machine adds a dot. Bella puts in a card with a star. The machine follows its rule correctly.","ask":"What does the rule require the machine to add?","options":["A dot.","A square.","Nothing.","A new star instead of a dot."],"answer":0,"hints":["Match the actual card to the starting condition.","The card has the feature named after if."],"explanation":["The rule starts with a card having a star.","Bella's card has a star, so that condition is met.","The machine must add the dot named in the rule."],"optionWhy":["The star condition is met, so the stated dot result follows.","No rule says that a star produces a square.","That would fail to follow the stated rule for a star card.","The rule names a dot as the addition, not a replacement star."],"think":"Say the starting condition and the result separately.","visual":null,"id":"m03l01-w","kind":"worked"},"questions":[{"stem":"Dot follows this instruction: If the red lamp is on, make one beep. The red lamp is on now, and Dot carries out the instruction correctly.","ask":"What does the instruction require Dot to do?","options":["Turn into a red robot.","Make one beep.","Make three beeps.","Stay silent."],"answer":1,"hints":["Identify what is happening now.","Read the action connected to that condition."],"explanation":["The red lamp being on is the starting condition.","The story says that condition is happening.","Dot must carry out the one-beep action."],"optionWhy":["The rule says nothing about changing Dot's colour.","The red-lamp condition requires one beep.","The instruction specifies one beep, not three.","Silence would not carry out the instruction when the lamp is on."],"think":"Which clue tells you the rule applies now?","visual":null,"id":"m03l01-q1","kind":"guided"},{"stem":"Every member of the Star Club has a round badge. Nia is a member of the Star Club. These facts are true in this story.","ask":"What follows about Nia?","options":["Nia is the only club member.","Everyone with a round badge knows Nia.","Nia has a round badge.","Nia has a square badge instead."],"answer":2,"hints":["Identify which group Nia belongs to.","Apply the feature that every member of that group has."],"explanation":["All Star Club members have round badges.","Nia is a Star Club member.","The badge rule therefore applies to Nia."],"optionWhy":["No membership count is given.","The rule does not describe who knows whom.","Nia belongs to the group for which the badge rule applies.","The rule requires a round badge for each member."],"think":"Could this tell us how many members there are?","visual":null,"id":"m03l01-q2","kind":"practice"},{"stem":"The puppet director follows this plan: If the small stage is wet, the show moves to the big stage. The small stage is wet today. The director follows the plan.","ask":"Where does the plan put today's show?","options":["On the small stage.","On both stages at once.","In the garden.","On the big stage."],"answer":3,"hints":["Look for the condition that matches today.","Follow the destination named in the plan."],"explanation":["The plan covers the case in which the small stage is wet.","That is today's case.","Following the plan places the show on the big stage."],"optionWhy":["That would not follow the given plan for a wet small stage.","The plan says the show moves to the big stage, not that it uses both.","The garden is not the destination named by the plan.","The wet-small-stage condition triggers the move to the big stage."],"think":"What is the if part of this plan?","visual":null,"id":"m03l01-q3","kind":"practice"},{"stem":"A sorting rule says, \"If a card is triangular, put it in the left tray.\" Pip has a round card. There is no other sorting rule.","ask":"What does this rule tell us to do with the round card?","options":["It does not specify where the round card goes.","It must go in the left tray.","It must go in the right tray.","It must be thrown away."],"answer":0,"hints":["Before following a rule, check its starting condition.","The card is round; the rule is about triangular cards."],"explanation":["The rule gives an instruction for triangular cards.","The actual card is round, so that condition is not met.","This rule alone leaves the round card's destination unspecified."],"optionWhy":["The rule gives a destination only when a card is triangular.","The round card does not meet the triangular starting condition.","No rule gives the right tray as a destination.","Nothing in the rule says to discard round cards."],"think":"Invent a second rule that would tell Pip where round cards go.","visual":null,"id":"m03l01-q4","kind":"practice"},{"stem":"In a story, the dragon makes a bow every time the silver bell rings. The silver bell rings at the end of the scene. The dragon follows this story rule.","ask":"What can we predict at that moment?","options":["Every character makes a bow.","The dragon makes a bow.","The dragon falls asleep.","The dragon loses its bell."],"answer":1,"hints":["Keep the prediction about the character named in the rule.","Match the bell event to the promised action."],"explanation":["The dragon bows whenever the silver bell rings.","The silver bell rings now.","The dragon's bow follows, without extending the rule to other characters."],"optionWhy":["The rule is about the dragon, not every character.","The bell event matches the rule that requires a bow.","No sleeping rule is given.","The story rule does not describe losing anything."],"think":"When reading, look for a character rule you can use to make a prediction.","visual":null,"id":"m03l01-q5","kind":"transfer"}],"activity":{"title":"Be the Rule Machine","instructions":"Make two star cards and two circle cards. Give a partner the rule: If a card has a star, place a counter beside it. Show the cards one at a time. After every action, say whether the starting condition was met. Then add a rule for circle cards and play again with the roles swapped.","coach":"Before adding a circle rule, the original instruction does not specify an action for circle cards. Do not assume the opposite action unless it is stated."},"reflection":"Did you check that the starting condition was met before using the rule?","transfer":"Use an if-then instruction in a game or a recipe, and identify the part that makes it apply.","parent":{"aim":"Observe whether she checks applicability before drawing a rule's conclusion.","prompt":"What has to happen at the start, and did it happen here?","pitfall":"Applying the stated result to every object, including those outside the condition.","success":"She identifies the condition, verifies it and gives only the result the rule supplies."}},{"id":"m03l02","module":3,"lesson":2,"title":"Can We Turn the Rule Around?","goal":"I can check whether a result really tells me which starting condition happened.","story":"Pip sees a sticker and thinks he knows exactly how its owner earned it. Bella asks him to read the rule again. A rule can promise what happens after a condition, while leaving room for the same result to happen in another way. Today you will look for those other allowed possibilities.","tool":"Try a different route","steps":["Say the direction the rule actually gives.","Notice when someone tries to go from the result back to the start.","Build another situation with the same result that does not break the rule."],"worked":{"stem":"Every child wearing a blue hat receives a sticker. Mia receives a sticker. The rule does not say that other children cannot receive stickers.","ask":"Must Mia be wearing a blue hat?","options":["No; she must be wearing a red hat.","No child with a blue hat can have a sticker.","No; her hat is not determined by the sticker.","Yes; every sticker proves a blue hat."],"answer":2,"hints":["The rule goes from blue hat to sticker.","Could someone with another hat also receive a sticker?"],"explanation":["A blue hat guarantees a sticker under this rule.","The rule does not limit stickers to blue-hat wearers.","Mia's sticker therefore does not determine her hat."],"optionWhy":["A red hat is possible but is not established.","This contradicts the stated blue-hat rule.","A child with another hat could also receive a sticker without breaking the rule.","That reverses the rule and adds a restriction not given."],"think":"Draw Mia with a non-blue hat and a sticker, while every blue-hat child also has a sticker.","visual":null,"id":"m03l02-w","kind":"worked"},"questions":[{"stem":"Every person working in the paint room wears a blue apron. Jo wears a blue apron. People outside the paint room may also wear blue aprons.","ask":"What can we conclude about Jo's location?","options":["Jo must be in the paint room.","Jo cannot be in the paint room.","Jo must be in the garden.","We cannot tell whether Jo is in the paint room."],"answer":3,"hints":["Check whether the apron is unique to one location.","Try one inside scene and one outside scene."],"explanation":["Paint-room workers must wear blue aprons.","Blue aprons are also allowed outside the room.","Jo's apron alone cannot identify a location."],"optionWhy":["The rule does not make the paint room the only place for blue aprons.","Being there would fit the apron rule.","No clue names the garden as Jo's location.","The apron is compatible with being inside or outside."],"think":"What additional clue would tell us where Jo is working?","visual":null,"id":"m03l02-q1","kind":"guided"},{"stem":"Every space book in a library display is placed in the blue box. Other kinds of books may be placed there too. Bella picks a book from the blue box without seeing its title.","ask":"What is known about its topic?","options":["The topic cannot yet be identified.","It must be about space.","It cannot be about space.","It must be about fish."],"answer":0,"hints":["A container may include more than one kind of object.","Read whether the box is restricted to space books."],"explanation":["All space books belong in the blue box.","The rule also allows other topics in that box.","Selecting from the box does not by itself identify a space book."],"optionWhy":["The box can contain space books and books on other topics.","That would require a rule excluding all other topics from the box.","Space books are explicitly placed there.","Fish is not established as the selected topic."],"think":"Explain the difference between all space books are there and all books there are space books.","visual":null,"id":"m03l02-q2","kind":"practice"},{"stem":"Every player on the Star Team has a red card. Zara has a red card. The clue gives no rule about players on other teams.","ask":"Which judgement is careful?","options":["No Star Team player has a red card.","Zara may be on the Star Team, but we cannot be sure.","Zara definitely plays on the Star Team.","Zara definitely plays on a different team."],"answer":1,"hints":["Consider whether another team could use the same card colour.","Nothing says only the Star Team uses red cards."],"explanation":["Star Team membership implies having a red card.","The clue does not restrict red cards to that team.","Zara's team remains uncertain from the card alone."],"optionWhy":["That contradicts the rule for every Star Team player.","Membership fits, but another team having red cards is not ruled out.","A red card is a result of membership, not proof that no other team uses one.","The clues do not exclude Star Team membership."],"think":"Make a second situation that fits all the clues.","visual":null,"id":"m03l02-q3","kind":"practice"},{"stem":"In a toy house, pressing the red button makes the bell ring. The bell is ringing now. The instructions do not say whether any other button can also make it ring.","ask":"Does the ringing prove the red button was pressed?","options":["No; it proves the red button was not pressed.","The bell cannot be ringing.","No; another way to ring the bell has not been ruled out.","Yes; it proves the red button was pressed."],"answer":2,"hints":["One named cause is not automatically the only allowed cause.","Check whether the instructions use a restriction such as only."],"explanation":["Pressing red would make the bell ring.","The current ringing gives the result but not a unique cause.","The red button is possible, but not proved by these instructions."],"optionWhy":["The red button could still have been the trigger.","The story states that it is ringing.","The given rule describes one trigger without saying it is the only trigger.","That assumes the red button is the only possible trigger."],"think":"What extra instruction would make the reverse inference safe?","visual":null,"id":"m03l02-q4","kind":"practice"},{"stem":"In a play, every pirate character wears a striped hat. A character steps on stage wearing a striped hat. The costume rules say nothing about the hats worn by other characters.","ask":"What can the audience conclude from the hat alone?","options":["The character must be a pirate.","The character cannot be a pirate.","The character must be the cook.","The character could be a pirate, but the role is not certain."],"answer":3,"hints":["Separate a costume requirement from a unique identity clue.","Try imagining a different character in the same kind of hat."],"explanation":["Pirates are required to wear striped hats.","Other characters are not forbidden from wearing them.","A striped hat fits a pirate but does not identify the role by itself."],"optionWhy":["The rule does not say striped hats are used only by pirates.","A pirate wearing that hat would follow the rule.","No rule links the cook uniquely to a striped hat.","Another role could also use a striped hat under these rules."],"think":"As a director, what extra clue could make the role clear?","visual":null,"id":"m03l02-q5","kind":"transfer"}],"activity":{"title":"A Rule with Two Routes","instructions":"Draw three children. Give two blue hats and the third a red hat. Follow this rule: Every blue-hat child gets a sticker. Add stickers to the two blue-hat children, then give the red-hat child a sticker too. Ask whether any part breaks the rule, and whether a sticker alone now reveals a hat colour.","coach":"The extra sticker does not break the rule. A blue hat requires a sticker, while stickers are not restricted to blue hats."},"reflection":"What second route stopped you from turning the rule around?","transfer":"In a story, check whether a costume or object is shared by more than one possible character.","parent":{"aim":"Watch for a correct direction of implication and a concrete counterexample to reversing it.","prompt":"Could the same result happen another way without breaking the rule?","pitfall":"Treating every if-then rule as an if-and-only-if rule.","success":"She constructs an allowed case where the result occurs without the named starting condition."}},{"id":"m03l03","module":3,"lesson":3,"title":"A Requirement Is a Starting Check","goal":"I can identify a requirement without assuming it guarantees everything else.","story":"The theatre has entry rules, costume rules and return-box rules. Pip thinks meeting one requirement means the whole job must already be finished. Bella checks what the rule actually promises. Today you will find who or what meets a requirement, who is ruled out, and which conclusions still need another clue.","tool":"Required does not mean guaranteed","steps":["Identify what is required for the action or place.","Rule out cases that lack that requirement.","Check whether the rule says the requirement is enough to guarantee the result."],"worked":{"stem":"Only children with a ticket may ride the toy train. Pip does not have a ticket. Everyone must follow this entry rule.","ask":"What does the rule say about Pip?","options":["Pip is not allowed to ride without a ticket.","Pip is allowed to ride without a ticket.","Pip must be on the train already.","Pip must own the train."],"answer":0,"hints":["Only creates a requirement for admission.","Check whether Pip has that required item."],"explanation":["Having a ticket is necessary to be allowed on the train.","Pip does not have one.","Pip is therefore ruled out from riding under this rule."],"optionWhy":["A ticket is required, and Pip lacks it.","That would ignore the stated requirement.","The clues say he lacks the required ticket.","The rule says nothing about ownership."],"think":"What would Pip need before he could meet the ticket requirement?","visual":null,"id":"m0
