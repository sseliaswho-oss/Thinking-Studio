return `<article class="panel question-panel" data-question="${q.id}"><div class="question-top"><span class="question-label">${esc(label)}</span><button class="listen" data-action="listen" data-id="${q.id}" aria-label="Read this question aloud">${icon('sound')}Read aloud</button></div><p class="question-stem">${esc(q.stem)}</p>${visual(q.visual)}<h2 class="question-ask">${esc(q.ask)}</h2><div class="options" role="group" aria-label="Choose an answer">${q.options.map((op,i)=>`<button class="option ${sel===i?'selected':''} ${showFeedback&&resolved&&q.answer===i?'correct':''} ${showFeedback&&!r.correct&&r.lastChecked===i?'incorrect':''}" data-action="choose" data-id="${q.id}" data-choice="${i}" aria-pressed="${sel===i}" ${resolved?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${esc(op)}</span></button>`).join('')}</div>${!resolved?`<div class="question-actions"><button class="btn primary" data-action="check" data-id="${q.id}" ${sel===undefined?'disabled':''}>Check my thinking${icon('check')}</button><button class="btn secondary" data-action="hint" data-id="${q.id}" ${(r.hints||0)>=2?'disabled':''}>${icon('bulb')}${r.hints?'Another hint':'A little hint'}</button></div>`:''}${q.hints.slice(0,r.hints||0).map((h,i)=>`<div class="hint-box"><b>Hint ${i+1}</b>${esc(h)}</div>`).join('')}${showFeedback?renderFeedback(q,r):''}${!resolved?`<div style="margin-top:15px"><button class="btn ghost small" data-action="reveal" data-id="${q.id}">Walk me through the solution</button><div class="read-only-note">Try an idea first, or learn from the steps when you need help.</div></div>`:''}${renderPad(q)}</article>`;}
function renderFeedback(q,r){if(!r.reviewed)return `<div class="feedback try-again" role="status"><h3>${icon('search')}Let's check that idea</h3><p>${esc(q.optionWhy[r.lastChecked])}</p><p class="small muted">Use a clue or try a different way. You can change your answer.</p></div>`;return `<div class="feedback" role="status"><h3>${icon(r.correct?'check':'book')}${r.correct?'That fits the clues.':'Let’s follow the steps.'}</h3><p><strong>${esc(q.options[q.answer])}</strong></p><ol>${q.explanation.map(e=>`<li>${esc(e)}</li>`).join('')}</ol><details class="why-options"><summary>Why do the other choices not fit?</summary>${q.options.map((o,i)=>`<div class="option-reason"><strong>${'ABCD'[i]}. ${esc(o)}</strong>${esc(q.optionWhy[i])}</div>`).join('')}</details><div class="think-prompt"><strong>Say it your way:</strong> ${esc(q.think)}</div></div>`;}
function renderPad(q){const g=qr(q);return `<details class="pad" data-pad="${q.id}" ${padOpen[q.id]?'open':''}><summary>${icon('pencil')}My thinking space</summary><label class="form-label" for="note-${q.id}">A clue, a list, or my reason</label><textarea id="note-${q.id}" data-note="${q.id}" maxlength="3000" placeholder="I think… because…">${esc(g.note||'')}</textarea><p>Your words are saved. Drawings stay during this visit.</p><div class="draw-wrap"><canvas data-canvas="${q.id}" width="600" height="200" aria-label="Drawing space: use a finger, mouse, or the text box above to record your thinking"></canvas></div><div class="pad-tools"><button class="btn secondary small" data-action="clear-drawing" data-id="${q.id}">Clear drawing</button></div></details>`;}
function renderLesson(){const l=byLesson[route.id],m=MODULES[l.module-1],r=lr(l.id),phase=r.phase||0;r.started=true;state.lastLesson=l.id;save();const phases=['Discover','Try together','Your turn','Reflect'];return `<a class="back-link" href="#home">${icon('back')}Back to my journey</a><div class="lesson-layout"><div class="lesson-main"><header class="lesson-heading"><div class="crumb">${esc(m.title)} · Lesson ${l.lesson} of 4</div><h1>${esc(l.title)}</h1><p>${esc(l.goal)}</p></header><nav class="stepper" aria-label="Lesson steps">${phases.map((p,i)=>`<button class="step-tab ${phase===i?'active':''}" data-action="phase" data-phase="${i}" ${phase===i?'aria-current="step"':''}><span>${i+1}</span>${p}</button>`).join('')}</nav>${phase===0?renderDiscover(l):phase===1?renderWorked(l):phase===2?renderPracticeLesson(l):renderReflect(l)}</div><aside class="lesson-rail"><div class="rail-card"><div class="rail-label">Inside this world</div>${moduleLessons(l.module).map(x=>`<a class="rail-lesson ${l.id===x.id?'active':''} ${state.lessons[x.id]?.completed?'done':''}" href="#lesson/${x.id}"><span class="lesson-bubble">${state.lessons[x.id]?.completed?'✓':x.lesson}</span><span>${esc(x.title)}</span></a>`).join('')}<div class="focus-note">Every lesson is open. You can pause and come back.</div></div><div class="rail-card rail-tip"><h3>A useful question</h3><p>${esc(l.parent.prompt)}</p></div></aside></div>`;}
function renderDiscover(l){let warm='';const idx=LESSONS.indexOf(l);if(idx>0){const old=LESSONS[Math.max(0,idx-3)];warm=`<div class="note-card"><strong>A quick look back:</strong> Think about “${esc(old.tool)}”. Where might that tool help today? <a href="#lesson/${old.id}">Revisit it</a></div>`;}return `<section class="panel story-panel"><div class="story-label">Today's little adventure</div><p class="story-text">${esc(l.story)}</p></section><section class="panel"><div class="tool-name">${icon('tools')}${esc(l.tool)}</div><ol class="thinking-steps">${l.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>${warm}<div class="learn-tip">${icon('chat')}<span>You can talk, draw, or write. A short reason is a good beginning.</span></div><div class="lesson-nav"><a class="btn ghost" href="#home">Pause for now</a><button class="btn primary" data-action="phase" data-phase="1">Try an example${icon('arrow')}</button></div>`;}
function renderWorked(l){return `<p class="small muted">Think about the example first. Hints and the solution are there when you need them.</p>${renderQuestion(l.worked,'Explore an example')}<div class="lesson-nav"><button class="btn secondary" data-action="phase" data-phase="0">${icon('back')}Discover</button><button class="btn primary" data-action="phase" data-phase="2" ${!qr(l.worked).reviewed?'disabled':''}>Your turn${icon('arrow')}</button></div>`;}
function renderPracticeLesson(l){const r=lr(l.id),i=Math.min(4,r.qi||0),q=l.questions[i];return `<div class="q-progress"><span class="progress-count">Question ${i+1} of 5</span><div class="q-dots" aria-label="Practice questions">${l.questions.map((x,j)=>`<button class="q-dot ${i===j?'active':''} ${qr(x).reviewed?'done':''}" data-action="question-index" data-index="${j}" aria-label="Go to question ${j+1}${qr(x).reviewed?', reviewed':''}" ${i===j?'aria-current="step"':''}>${qr(x).reviewed?icon('check'):j+1}</button>`).join('')}</div></div>${renderQuestion(q,{'guided':'Try with a little guidance','practice':'Your thinking, your way','transfer':'A new setting, the same thinking'}[q.kind]||'Your turn')}<div class="lesson-nav"><button class="btn secondary" data-action="previous-question">${icon('back')}${i?'Previous':'Example'}</button><button class="btn primary" data-action="next-question" ${!qr(q).reviewed?'disabled':''}>${i===4?'Reflect & finish':'Next question'}${icon('arrow')}</button></div>`;}
function renderReflect(l){const r=lr(l.id),reviewed=l.questions.filter(q=>qr(q).reviewed).length,ready=reviewed===5&&qr(l.worked).reviewed,idx=LESSONS.indexOf(l),next=LESSONS[idx+1];return `${r.completed?`<div class="completion"><div class="complete-medal">${icon('star')}</div><h2>You explored a new way to think.</h2><p>This lesson is complete. Keep the tool, and use it somewhere new.</p>${next?`<a class="btn primary" href="#lesson/${next.id}">Next adventure${icon('arrow')}</a>`:'<a class="btn primary" href="#notebook">Visit my notebook</a>'}</div>`:''}<section class="panel story-panel"><div class="story-label">Away from the screen</div><h2>${esc(l.activity.title)}</h2><p class="story-text" style="font-size:17px">${esc(l.activity.instructions)}</p><details class="why-options"><summary>A guide for your thinking partner</summary><p style="margin-top:12px">${esc(l.activity.coach)}</p></details></section><section class="panel"><h2>Keep a little thought</h2><p>${esc(l.reflection)}</p><label class="form-label" for="reflection">Tell someone, or leave a note</label><textarea id="reflection" data-reflection="${l.id}" maxlength="3000" placeholder="Today I noticed…">${esc(r.reflection||'')}</textarea><label class="form-label">How does this tool feel?</label><div class="reflection-options">${[['ready','I can explain it'],['growing','I am getting there'],['help','Let’s explore it again']].map(([v,t])=>`<button data-action="confidence" data-value="${v}" class="${r.confidence===v?'active':''}" aria-pressed="${r.confidence===v}">${t}</button>`).join('')}</div><div class="note-card"><strong>Take it into your world:</strong> ${esc(l.transfer)}</div>${!ready?`<p class="small muted">You have reviewed ${reviewed} of 5 practice questions${qr(l.worked).reviewed?'':' and still have the example to explore'}. Finish reviewing them before completing the lesson.</p>`:''}<div class="actions"><button class="btn primary" data-action="finish-lesson" ${!ready||r.completed?'disabled':''}>${icon('check')}${r.completed?'Lesson completed':'Finish this lesson'}</button><button class="btn secondary" data-action="phase" data-phase="2">Review my questions</button></div><p class="read-only-note">Talking and drawing count too. A written reflection is optional.</p></section><section class="panel"><details class="guide-observation"><summary>Grown-up observation</summary><p><strong>Look for:</strong> ${esc(l.parent.aim)}</p><p><strong>Try asking:</strong> ${esc(l.parent.prompt)}</p><p><strong>Watch for:</strong> ${esc(l.parent.pitfall)}</p><p><strong>A useful sign:</strong> ${esc(l.parent.success)}</p><div class="parent-fields"><div><label class="form-label" for="reading-support">Reading support</label><select id="reading-support" data-parent="${l.id}" data-field="parentRead">${['Not recorded','Read independently','Listened to the text','Needed vocabulary help'].map(v=>`<option ${r.parentRead===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="form-label" for="thinking-support">Thinking support</label><select id="thinking-support" data-parent="${l.id}" data-field="parentSupport">${['Not recorded','Independent','Neutral prompt','Method prompt','Worked together'].map(v=>`<option ${r.parentSupport===v?'selected':''}>${v}</option>`).join('')}</select></div></div><label class="form-label" for="parent-note">One useful observation</label><textarea id="parent-note" data-parent="${l.id}" data-field="parentNote" maxlength="3000" placeholder="What helped? What is the next small step?">${esc(r.parentNote||'')}</textarea></details></section>`;}
function reviewItems(){return LESSONS.flatMap(l=>l.questions).filter(q=>state.questions[q.id]?.needsReview);}
function renderPractice(){if(practice){if(practice.index>=practice.queue.length){const solved=practice.queue.filter(q=>practice.records[q.id]?.firstChoice===q.answer&&!practice.records[q.id]?.hints&&!practice.records[q.id]?.seenSolution).length;return `<div class="practice-main"><section class="panel celebration"><div class="complete-medal">${icon('spark')}</div><h1>Good exploring.</h1><p>You revisited ${practice.queue.length} questions and checked the reasons.</p><div class="note-card">${solved} answered correctly on the first try without a hint in this session. Every explanation is a chance to learn.</div><button class="btn primary" data-action="end-practice">Back to the practice room${icon('arrow')}</button></section></div>`;}const q=practice.queue[practice.index];return `<div class="practice-main"><button class="btn ghost small" data-action="end-practice">${icon('back')}Pause practice</button><div class="page-title"><div class="eyebrow">Practice room</div><h1>A fresh look.</h1><p class="small muted">Question ${practice.index+1} of ${practice.queue.length} · No timer. Take the time you need.</p></div>${renderQuestion(q,q.kind==='transfer'?'Try it in a new setting':'Choose your thinking tool')}<div class="lesson-nav"><span class="small muted">Hints are always welcome.</span><button class="btn primary" data-action="practice-next" ${!activeQR(q).reviewed?'disabled':''}>${practice.index===practice.queue.length-1?'Finish practice':'Next question'}${icon('arrow')}</button></div></div>`;}
const count=reviewItems().length;return `<header class="page-title"><div class="eyebrow">Try, notice, try again</div><h1>The practice room</h1><p class="page-lead">A small mix of questions helps you choose a thinking tool for yourself. There is no timer.</p></header><div class="guide-grid"><section class="panel"><div class="module-icon" style="background:#e8f2e8">${icon('spark')}</div><h2 style="margin-top:18px">Mix things up</h2><p class="muted">Explore up to 8 questions from a world you choose. Each mix includes different lesson ideas.</p><div class="practice-controls"><div><label class="form-label" for="practice-module">Choose your mix</label><select id="practice-module"><option value="started">Worlds I have started</option><option value="all">All 12 worlds</option>${MODULES.map(m=>`<option value="${m.id}">${m.id}. ${esc(m.title)}</option>`).join('')}</select></div><button class="btn primary" data-action="start-practice">Let's explore${icon('arrow')}</button></div></section><section class="panel"><div class="module-icon" style="background:#fdf1d7;color:#9a722b">${icon('refresh')}</div><h2 style="margin-top:18px">Give it another look</h2><p class="muted">Questions that needed a hint, a solution, or another try will wait here. A fresh first try without help clears an item from this list.</p><p><strong>${count}</strong> question${count===1?'':'s'} to revisit</p><button class="btn secondary" data-action="start-review" ${!count?'disabled':''}>Revisit up to 8 questions${icon('arrow')}</button></section></div><div class="wide-note"><strong>A small challenge:</strong> Before choosing an answer, ask yourself, “Which clue or tool will help me here?”</div>`;}
const TOOLS=[['search','Notice the clues','Separate what is given from what you imagine.','Ask: “Which words or details tell me that?”'],['pencil','Make it visible','Draw positions, groups or arrows. Move objects when that helps.','Three people in a line? Try three labelled cards.'],['list','Make a careful list','Keep one choice fixed while you try the others. Check for repeats.','Two hats and two scarves? List both scarves for the first hat, then the second.'],['rule','Check every rule','Test an answer against all the conditions, one at a time.','A plan can fit one rule and still break another.'],['shield','Look for another possibility','Try to find a situation that fits the clues but changes the conclusion.','One possible answer does not always mean it is the only answer.'],['question','Ask what is missing','Notice what you cannot know yet. Choose a useful next question.','“Could be” and “must be” ask for different levels of certainty.']];
function renderTools(){return `<header class="page-title"><div class="eyebrow">Little tools, big possibilities</div><h1>Your thinking toolkit</h1><p class="page-lead">You do not need every tool for every problem. Choose one, try it, and see whether it helps.</p></header><div class="tool-grid">${TOOLS.map(([ic,t,d,e],i)=>`<section class="panel tool-card"><div class="module-icon" style="background:${['#e8f2e8','#fdf1d7','#eeeafa'][i%3]}">${icon(ic)}</div><h2 style="font-size:22px">${t}</h2><p>${d}</p><details><summary class="small">See a way to use it</summary><div class="tool-example">${e}</div></details></section>`).join('')}</div><div class="wide-note"><strong>When a method gets stuck:</strong> Check the question, show the information a different way, or ask for a small hint.</div>`;}
function renderNotebook(){const entries=LESSONS.filter(l=>state.lessons[l.id]?.completed||state.lessons[l.id]?.reflection||[l.worked,...l.questions].some(q=>state.questions[q.id]?.note));return `<header class="page-title"><div class="eyebrow">A collection of little discoveries</div><h1>My thinking notebook</h1><p class="page-lead">Your reflections, reasons and tools live here. Come back and notice how your thinking grows.</p></header>${!entries.length?`<div class="empty"><div class="module-icon">${icon('book')}</div><h2>Your first discovery is waiting.</h2><p>Leave a note in a question, reflect on a lesson, or complete an adventure to begin your notebook.</p><a class="btn primary" href="#lesson/${LESSONS[0].id}">Start exploring${icon('arrow')}</a></div>`:entries.map(l=>{const r=lr(l.id),notes=[l.worked,...l.questions].filter(q=>qr(q).note);return `<article class="panel notebook-entry"><div class="module-icon" style="background:${MODULES[l.module-1].tint}">${icon(MODULES[l.module-1].icon)}</div><div><div class="entry-meta">World ${l.module} · Lesson ${l.lesson} ${r.completed?'<span class="badge">Completed</span>':''}</div><h2 style="font-size:22px">${esc(l.title)}</h2><p class="small"><strong>My tool:</strong> ${esc(l.tool)}</p>${r.reflection?`<div class="entry-note">${esc(r.reflection)}</div>`:'<p class="small muted">You can return to the lesson and add a reflection.</p>'}${notes.length?`<details class="why-options"><summary>${notes.length} saved thinking note${notes.length===1?'':'s'}</summary>${notes.map(q=>`<p class="small" style="margin-top:15px"><strong>${esc(q.ask)}</strong></p><div class="entry-note">${esc(qr(q).note)}</div>`).join('')}</details>`:''}<a class="btn ghost small" href="#lesson/${l.id}" style="margin-top:12px">Revisit this lesson${icon('arrow')}</a></div></article>`;}).join('')}`;}
function renderGuide(){const started=LESSONS.filter(l=>state.lessons[l.id]?.started);return `<header class="page-title"><div class="eyebrow">For a thinking partner</div><h1>A little help, thoughtfully given.</h1><p class="page-lead">These 48 original lessons build critical thinking and problem solving through short stories, clear models and new situations.</p></header><div class="guide-grid"><section class="panel"><h2>One lesson at a time</h2><p>Try two short sessions a week. A lesson is designed for about 20–25 minutes, including a hands-on activity and conversation. Pause when needed.</p><ol><li>Discover a thinking tool.</li><li>Try the example before revealing its steps.</li><li>Explore five questions, ending in a different setting.</li><li>Talk, draw or write a reflection.</li></ol></section><section class="panel"><h2>Let the thinking stay theirs</h2><p>Sit nearby if that helps. Give time before pointing to a clue. Model one thinking action when support is needed, then invite a new attempt.</p><p><strong>Useful prompts:</strong> “What do you know?” “What does the question ask?” “Does that fit every rule?” “Could there be another possibility?”</p></section><section class="panel"><h2>Separate reading from reasoning</h2><p>Read a question aloud without adding clues when reading is the barrier. Invite a short spoken reason or a drawing. English fluency and long written explanations are not prerequisites for every activity.</p><p>Lesson reflections include optional fields to record reading support, thinking support and one observation.</p></section><section class="panel"><h2>Notice what the record means</h2><p>A completed lesson means its example and five practice questions have been reviewed. A solution viewed with support also counts as reviewed.</p><p>First answers, hints and solutions are recorded separately. These records describe practice; they are not a standardised ability score or an OC admission prediction.</p></section><section class="panel"><h2>Keep progress with you</h2><p>Progress and notes save in this browser. They do not automatically follow you to another device or a different website address. Export a backup in Settings, then restore it where you want to continue.</p><p>Read aloud uses the voices available in your browser. Text and activities remain available when speech is unavailable. Drawings are temporary; written notes are saved.</p><button class="btn secondary" data-action="settings">${icon('settings')}Settings & backups</button></section><section class="panel"><h2>Curriculum and sources</h2><p>The foundation sequence follows the agreed 12-module curriculum. It is informed by NSW's public description of critical thinking and problem solving and the structures seen in its sample materials.</p><p>All lesson stories, questions and explanations in this app are original teaching content.</p><a href="https://education.nsw.gov.au/schooling/students/oc-and-shs/going-to-an-opportunity-class/get-ready-for-the-opportunity-class-placement-test" target="_blank" rel="noopener">NSW OC official test information</a></section></div><div class="section-heading"><div><h2>Learning observations</h2><p>Look for changes in independence and reasoning across new tasks.</p></div><button class="btn secondary small" data-action="export">${icon('download')}Export progress</button></div>${!started.length?'<div class="empty"><p>Started lessons will appear here, with a clear record of the support used.</p></div>':`<div class="panel progress-table"><table><thead><tr><th>Lesson</th><th>Reviewed</th><th>First try, no help</th><th>Reading support</th><th>Thinking support</th></tr></thead><tbody>${started.map(l=>{const r=lr(l.id),rev=l.questions.filter(q=>qr(q).reviewed).length,ind=l.questions.filter(q=>qr(q).firstChoice===q.answer&&!qr(q).firstSupported).length;return `<tr><td><a href="#lesson/${l.id}">${l.module}.${l.lesson} ${esc(l.title)}</a>${r.parentNote?`<p class="small muted" style="margin-top:9px">${esc(r.parentNote)}</p>`:''}</td><td>${rev}/5${r.completed?' · completed':''}</td><td>${ind}/5</td><td>${esc(r.parentRead||'Not recorded')}</td><td>${esc(r.parentSupport||'Not recorded')}</td></tr>`;}).join('')}</tbody></table></div>`}`;}
function render(options={}){const y=scrollY;route=parseRoute();document.documentElement.classList.toggle('no-motion',!!state.settings.reduceMotion);document.getElementById('app').innerHTML=layout(route.page==='lesson'?renderLesson():route.page==='practice'?renderPractice():route.page==='tools'?renderTools():route.page==='notebook'?renderNotebook():route.page==='guide'?renderGuide():renderHome());bindPads();if(options.top)window.scrollTo({top:0,behavior:'instant'});else window.scrollTo(0,y);document.title=route.page==='lesson'?`${byLesson[route.id].title} · Bella's Thinking Studio`:"Bella's Thinking Studio";}
function changePhase(n){if(route.page!=='lesson')return;lr(route.id).phase=n;save();render({top:true});}
function bindPads(){document.querySelectorAll('[data-pad]').forEach(d=>{d.addEventListener('toggle',()=>{padOpen[d.dataset.pad]=d.open;if(d.open)initCanvas(d.querySelector('canvas'));});if(d.open)initCanvas(d.querySelector('canvas'));});}
function initCanvas(c){if(!c||c.dataset.bound)return;c.dataset.bound='yes';const ctx=c.getContext('2d'),id=c.dataset.canvas;ctx.strokeStyle='#246e62';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false;const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};if(drawings[id]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=drawings[id];}c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e));e.preventDefault();});c.addEventListener('pointermove',e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke();e.preventDefault();});const stop=()=>{if(drawing){drawing=false;drawings[id]=c.toDataURL();}};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);}
function speak(q){if(!('speechSynthesis'in window)){toast('Read aloud is not available in this browser. You can still read every question.');return;}speechSynthesis.cancel();const words=[q.stem,q.ask,...q.options.map((x,i)=>`${'ABCD'[i]}. ${x}`)].join('. '),u=new SpeechSynthesisUtterance(words);u.lang='en-AU';u.rate=state.settings.rate||.9;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang==='en-AU')||vs.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;u.onerror=()=>toast('This voice could not play. Please read the question on screen.');speechSynthesis.speak(u);}
function showSettings(){const d=document.getElementById('settings-dialog');d.innerHTML=`<div class="dialog-heading"><h2 id="settings-title">Make yourself at home</h2><button class="icon-button" data-action="close-settings" aria-label="Close settings">${icon('close')}</button></div><section class="setting-row"><h3>Read aloud</h3><label class="form-label" for="speech-rate">Voice speed: <span id="speed-value">${state.settings.rate.toFixed(1)}</span>×</label><input id="speech-rate" type="range" min="0.6" max="1.3" step="0.1" value="${state.settings.rate}" style="width:100%;accent-color:var(--teal)"><p>Uses a voice available in your browser.</p><button class="btn secondary small" data-action="stop-speech">Stop reading</button></section><section class="setting-row"><label class="check-row"><input id="reduce-motion" type="checkbox" ${state.settings.reduceMotion?'checked':''}>Reduce decorative movement</label></section><section class="setting-row"><h3>Your progress, your copy</h3><p>Saved in this browser. Use a backup to continue on another device or website address.</p><div class="actions"><button class="btn primary" data-action="export">${icon('download')}Export backup</button><button class="btn secondary" data-action="import">${icon('upload')}Restore backup</button></div><input type="file" id="backup-input" accept="application/json,.json" class="hidden"></section><section class="setting-row"><a href="#guide" data-action="open-guide" class="btn soft full-width">${icon('user')}Open grown-up guide</a></section><section class="setting-row"><details><summary class="small">Start fresh in this browser</summary><p style="margin-top:10px">Export a backup first if you would like to keep your notes and progress.</p><button class="btn danger small" data-action="reset">Reset this browser's progress</button></details></section>`;d.showModal();}
function exportProgress(){save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bella-thinking-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Your progress backup is ready.');}
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startPractice(review=false){let qs;if(review){qs=reviewItems();}else{const value=document.getElementById('practice-module').value;const modules=value==='started'?new Set(LESSONS.filter(l=>state.lessons[l.id]?.started).map(l=>l.module)):null;qs=LESSONS.filter(l=>value==='all'||value==='started'&&modules.has(l.module)||String(l.module)===value).flatMap(l=>l.questions);}if(!qs.length){toast('Start a lesson first, or choose a world from the menu.');return;}practice={queue:shuffled(qs).slice(0,8),index:0,records:{}};pending={};render({top:true});}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action,id=el.dataset.id,q=byQuestion[id];
 if(act==='skip-main'){e.preventDefault();document.getElementById('main').focus();document.getElementById('main').scrollIntoView();}
 else if(act==='settings')showSettings();
 else if(act==='close-settings')document.getElementById('settings-dialog').close();
 else if(act==='open-guide'){document.getElementById('settings-dialog').close();}
 else if(act==='browse')document.getElementById('journey').scrollIntoView({behavior:state.settings.reduceMotion?'instant':'smooth'});
 else if(act==='phase')changePhase(Number(el.dataset.phase));
 else if(act==='choose'&&q){pending[id]=Number(el.dataset.choice);render();}
 else if(act==='check'&&q){const r=activeQR(q),choice=pending[id]??r.lastChoice;if(choice===undefined)return;r.tries=(r.tries||0)+1;if(r.firstChoice===undefined){r.firstChoice=choice;r.firstSupported=!!r.hints||!!r.seenSolution||!!qr(q).everAssisted;}r.lastChoice=choice;r.lastChecked=choice;r.correct=choice===q.answer;if(r.correct)r.reviewed=true;const g=qr(q);if(g.firstChoice===undefined){g.firstChoice=choice;g.firstSupported=!!r.firstSupported||!!g.everAssisted;}if(route.page==='practice'){g.practiceTries=(g.practiceTries||0)+1;if(r.correct&&r.tries===1&&!r.hints&&!r.seenSolution)g.needsReview=false;}if(!r.correct)g.needsReview=true;delete pending[id];save();render();}
 else if(act==='hint'&&q){const r=activeQR(q);r.hints=Math.min(2,(r.hints||0)+1);const g=qr(q);g.needsReview=true;g.everAssisted=true;if(route.page==='practice')g.practiceTries=(g.practiceTries||0);save();render();}
 else if(act==='reveal'&&q){const r=activeQR(q);r.seenSolution=true;r.reviewed=true;r.correct=false;qr(q).needsReview=true;qr(q).everAssisted=true;save();render();}
 else if(act==='listen'&&q)speak(q);
 else if(act==='stop-speech'){if('speechSynthesis'in window)speechSynthesis.cancel();}
 else if(act==='question-index'&&route.page==='lesson'){lr(route.id).qi=Number(el.dataset.index);save();render({top:true});}
 else if(act==='previous-question'&&route.page==='lesson'){const r=lr(route.id);if(r.qi>0)r.qi--;else r.phase=1;save();render({top:true});}
 else if(act==='next-question'&&route.page==='lesson'){const r=lr(route.id);if(r.qi<4)r.qi++;else r.phase=3;save();render({top:true});}
 else if(act==='confidence'&&route.page==='lesson'){lr(route.id).confidence=el.dataset.value;save();render();}
 else if(act==='finish-lesson'&&route.page==='lesson'){const l=byLesson[route.id];if(!qr(l.worked).reviewed||!l.questions.every(x=>qr(x).reviewed))return;const r=lr(l.id);r.completed=true;r.completedAt=Date.now();save();render({top:true});toast('A new thinking tool for your collection.');}
 else if(act==='clear-drawing'){delete drawings[id];const c=document.querySelector(`canvas[data-canvas="${id}"]`);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}
 else if(act==='start-practice')startPractice();
 else if(act==='start-review')startPractice(true);
 else if(act==='practice-next'){practice.index++;pending={};render({top:true});}
 else if(act==='end-practice'){practice=null;pending={};render({top:true});}
 else if(act==='export')exportProgress();
 else if(act==='import')document.getElementById('backup-input').click();
 else if(act==='reset'){if(confirm('Reset all progress and written notes in this browser? This cannot be undone without a backup.')){state=fresh();practice=null;pending={};drawings={};save();document.getElementById('settings-dialog').close();location.hash='home';render({top:true});toast('A fresh journey is ready.');}}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note){qr(byQuestion[t.dataset.note]).note=t.value;save();}else if(t.dataset.reflection){lr(t.dataset.reflection).reflection=t.value;save();}else if(t.dataset.parent){lr(t.dataset.parent)[t.dataset.field]=t.value;save();}else if(t.id==='speech-rate'){state.settings.rate=Number(t.value);document.getElementById('speed-value').textContent=Number(t.value).toFixed(1);save();}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='reduce-motion'){state.settings.reduceMotion=t.checked;save();document.documentElement.classList.toggle('no-motion',t.checked);}if(t.dataset.parent){lr(t.dataset.parent)[t.dataset.field]=t.value;save();}if(t.id==='backup-input'&&t.files?.[0]){const f=t.files[0];try{if(f.size>8000000)throw new Error('This backup is too large. Choose a Thinking Studio JSON backup.');const incoming=cleanState(JSON.parse(await f.text()));if(confirm('Restore this backup and replace the progress currently saved in this browser?')){state=incoming;practice=null;pending={};drawings={};save();document.getElementById('settings-dialog').close();render({top:true});toast('Your progress and notes have been restored.');}}catch(err){toast(err.message||'That file could not be restored. Your existing progress is unchanged.');}t.value='';}});
document.getElementById('settings-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
window.addEventListener('hashchange',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();render({top:true});});
window.addEventListener('pagehide',()=>{save();if('speechSynthesis'in window)speechSynthesis.cancel();});
render();
})();
</script>
</body>
</html>
