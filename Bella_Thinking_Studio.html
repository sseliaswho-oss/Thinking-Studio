age curtains"],"answer":1,"hints":["The team needs information about hearing the actual words.","Put the listener where the audience member will sit."],"explanation":["The goal concerns whether the last sentence reaches the back of the room.","A listener there can report the words they heard.","Repeating the sentence directly checks the stated goal in that rehearsal."],"optionWhy":["Snack preference is unrelated to hearing the sentence.","It checks the relevant listener, place and spoken words.","Buttons do not show whether the words can be heard.","Curtain colour does not answer the hearing question."],"think":"Why is this check more useful than a general question about the show?","visual":null,"id":"m11l01-q5","kind":"transfer"}],"activity":{"title":"Choose a goal first","instructions":"Make four imaginary activity cards. Give each a name, a time of 5, 10, 15 or 20 minutes, and a cost of $1, $2, $3 or $4 in any order. First choose the quickest activity. Then choose the cheapest. Finally add a time limit and choose again. Explain every choice using the current goal.","coach":"There need not be one best activity for every goal. The child should point to the relevant time or cost instead of choosing only a favourite name."},"reflection":"When did a different goal change your choice?","transfer":"Before choosing a book or a game, name one goal and find information that helps with it.","parent":{"aim":"Observe whether the child uses the stated goal to select evidence and compare choices.","prompt":"What are we trying to achieve this time?","pitfall":"Treating a favourite, biggest or cheapest option as automatically best for every goal.","success":"The child connects a choice to its goal and can explain a change when the goal changes."}},{"id":"m11l02","module":11,"lesson":2,"title":"Two rules together","goal":"I can check a plan against both requirements.","story":"The puppet club has a useful plan, but there are two rules to follow. A plan that passes just one rule will not do. Give each choice two checks. You can use your fingers, a tiny table or two tick boxes to keep both requirements in view.","tool":"Two checks","steps":["Say the two requirements separately.","Check each choice against both requirements.","Keep a choice only if it passes both."],"worked":{"stem":"The club needs an activity that is outdoors and free. Kite play is outdoors and costs $2. Drawing is indoors and free. Garden stories are outdoors and free. Puppet making is indoors and costs $3.","ask":"Which activity meets both requirements?","options":["Puppet making","Garden stories","Kite play","Drawing"],"answer":1,"hints":["One rule is about place and one is about cost.","An option must receive two yes checks."],"explanation":["Garden stories take place outdoors.","They are also free, so they pass the cost rule.","Garden stories meet both requirements together."],"optionWhy":["It meets neither the outdoor nor the free requirement.","It is outdoors and costs nothing.","It is outdoors but is not free.","It is free but takes place indoors."],"think":"Name the rule each other choice fails.","visual":{"type":"table","headers":["Activity","Place","Cost"],"rows":[["Kite play","Outdoors","$2"],["Drawing","Indoors","Free"],["Garden stories","Outdoors","Free"],["Puppet making","Indoors","$3"]],"caption":"Both rules must be met"},"id":"m11l02-w","kind":"worked"},"questions":[{"stem":"A route must take no more than 10 minutes and have no stairs. Blue takes 8 minutes and has stairs. Green takes 9 minutes with no stairs. Yellow takes 12 minutes with no stairs. Red takes 11 minutes and has stairs.","ask":"Which route is allowed?","options":["Yellow","Red","Green","Blue"],"answer":2,"hints":["Check the time limit and stairs separately.","The fastest route still has to meet the no-stairs rule."],"explanation":["Green takes nine minutes, which is within the ten-minute limit.","It has no stairs.","Green passes both rules."],"optionWhy":["It has no stairs but takes longer than ten minutes.","It is too long and has stairs.","It takes no more than ten minutes and has no stairs.","Its eight-minute time is fine, but it has stairs."],"think":"Why is the fastest route not the answer here?","visual":{"type":"table","headers":["Route","Minutes","Stairs?"],"rows":[["Blue","8","Yes"],["Green","9","No"],["Yellow","12","No"],["Red","11","Yes"]],"caption":"Limit: 10 minutes; no stairs"},"id":"m11l02-q1","kind":"guided"},{"stem":"A rehearsal can be on Tuesday or Thursday, and it must start later than 4 o'clock. The four offers are Tuesday at 4:30, Thursday at 3:30, Wednesday at 4:30, and Tuesday at exactly 4:00.","ask":"Which offer meets both rules?","options":["Thursday at 3:30","Wednesday at 4:30","Tuesday at 4:00","Tuesday at 4:30"],"answer":3,"hints":["Check the day before checking the start time.","Later than four is different from exactly four."],"explanation":["Tuesday is one of the two allowed days.","4:30 is later than 4:00.","Tuesday at 4:30 meets the day and time rules."],"optionWhy":["The day is allowed, but 3:30 is too early.","The time is late enough, but Wednesday is not allowed.","Exactly four is not later than four.","The day is allowed and the start is later than four."],"think":"Which word makes the exactly-four offer fail?","visual":{"type":"table","headers":["Offer","Start"],"rows":[["Tuesday","4:30"],["Thursday","3:30"],["Wednesday","4:30"],["Tuesday","4:00"]],"caption":"Allowed days: Tuesday or Thursday; start later than 4:00"},"id":"m11l02-q2","kind":"practice"},{"stem":"Bella needs an animal story with no more than 20 pages. Fox has 18 pages and is an animal story. Castle has 16 pages and is not an animal story. Whale has 24 pages and is an animal story. Rocket has 25 pages and is not an animal story.","ask":"Which book fits both requirements?","options":["Fox","Castle","Whale","Rocket"],"answer":0,"hints":["Use both the story type and page count.","A short book is not enough if it has the wrong story type."],"explanation":["Fox is an animal story.","Its eighteen pages fit the limit of twenty.","Fox meets both requirements."],"optionWhy":["It is an animal story and is within the page limit.","It is short enough but is not an animal story.","It is an animal story but exceeds the page limit.","It has the wrong story type and too many pages."],"think":"How would you mark two checks beside each book?","visual":{"type":"table","headers":["Book","Pages","Animal story?"],"rows":[["Fox","18","Yes"],["Castle","16","No"],["Whale","24","Yes"],["Rocket","25","No"]],"caption":"Animal story; at most 20 pages"},"id":"m11l02-q3","kind":"practice"},{"stem":"A craft box must hold at least five puppets and cost no more than $4. Small holds 4 and costs $3. Tall holds 5 and costs $5. Wide holds 6 and costs $4. Tiny holds 3 and costs $2.","ask":"Which box meets both requirements?","options":["Tiny","Wide","Small","Tall"],"answer":1,"hints":["Check capacity first, then cost.","At least five allows a box that holds more than five."],"explanation":["Wide holds six puppets, so it can hold the required five.","It costs exactly four dollars, which is allowed.","Wide is the only box that passes both checks."],"optionWhy":["It is cheap but has too little capacity.","Its capacity is enough and its price is within the limit.","It fits the budget but holds only four puppets.","It holds enough but costs more than four dollars."],"think":"Which two boundary words helped you check six puppets and exactly four dollars?","visual":{"type":"table","headers":["Box","Puppets held","Cost"],"rows":[["Small","4","$3"],["Tall","5","$5"],["Wide","6","$4"],["Tiny","3","$2"]],"caption":"At least five puppets; at most $4"},"id":"m11l02-q4","kind":"practice"},{"stem":"A show has three acts: singing, puppets and dance, each once. Singing must happen before puppets. Dance must not be the first act.","ask":"Which running order follows both rules?","options":["Puppets, singing, dance","Puppets, dance, singing","Singing, dance, puppets","Dance, singing, puppets"],"answer":2,"hints":["Check singing-before-puppets in every order.","Then check whether dance is first."],"explanation":["In singing, dance, puppets, singing is before puppets.","Dance is second rather than first.","This order follows both rules."],"optionWhy":["Dance is not first, but puppets wrongly precede singing.","Puppets also wrongly precede singing here.","Both the before rule and the not-first rule are satisfied.","Singing is before puppets, but dance is first."],"think":"Can you find another valid order that is not one of the choices?","visual":{"type":"table","headers":["Rule","Requirement"],"rows":[["Order","Singing before puppets"],["Position","Dance not first"]],"caption":"Use each act once"},"id":"m11l02-q5","kind":"transfer"}],"activity":{"title":"Two-rule planner","instructions":"Make four toy activity cards. Write whether each is indoors or outdoors and whether it is free or costs one token. Include one card for each possible pair of features. Ask for an activity that is outdoors and free. Then change the two requirements and choose again. Use two tick boxes to explain each decision.","coach":"A complete two-by-two set gives exactly one card for every combination. Watch that both requirements are checked after each change."},"reflection":"Which option tempted you because it passed only one rule?","transfer":"Choose a reading activity that meets two clear requirements, such as a topic and a page limit.","parent":{"aim":"Check both conditions explicitly, including boundary words.","prompt":"What are your two separate checks?","pitfall":"Keeping an option after checking only its strongest feature.","success":"The child rejects one-rule matches and explains why the chosen plan passes both."}},{"id":"m11l03","module":11,"lesson":3,"title":"Best among the plans that work","goal":"I can find workable plans first, then compare them using the goal.","story":"Several plans may follow the club rules, but the team still needs to choose. One plan might be cheaper; another might fit more people. First find the plans that really work. Then use the agreed goal to compare them. A very attractive plan still has to pass the rules.","tool":"Filter, then compare","steps":["Cross out choices that break a requirement.","Compare the remaining choices using the stated goal.","Explain both why the winner works and why it wins."],"worked":{"stem":"The club needs at least five seats and can spend no more than $5. Room Acorn has 4 seats for $2; Birch has 5 for $4; Cedar has 6 for $5; Elm has 7 for $6. Among rooms that work, choose the cheapest.","ask":"Which room should the club choose?","options":["Cedar","Elm","Birch","Acorn"],"answer":2,"hints":["First check seats and budget.","Only then compare the prices of the rooms still allowed."],"explanation":["Acorn has too few seats, and Elm exceeds the budget.","Birch and Cedar both work, at four and five dollars.","Birch is cheaper among the rooms that meet the requirements."],"optionWhy":["It works, but Birch costs less.","Its six-dollar price exceeds the budget.","It has enough seats, stays within budget and costs less than Cedar.","It is cheapest overall but has too few seats."],"think":"Why must a plan work before its low price matters?","visual":{"type":"table","headers":["Room","Seats","Cost"],"rows":[["Acorn","4","$2"],["Birch","5","$4"],["Cedar","6","$5"],["Elm","7","$6"]],"caption":"Need five seats; budget $5; prefer lowest cost"},"id":"m11l03-w","kind":"worked"},"questions":[{"stem":"A show can last at most 12 minutes and use at most 3 props. Among shows that fit, choose the longest. Moon lasts 10 minutes with 2 props; Star lasts 12 with 4; Leaf lasts 8 with 3; Rain lasts 14 with 1.","ask":"Which show should be chosen?","options":["Star","Leaf","Rain","Moon"],"answer":3,"hints":["Check both limits before comparing length.","Find the longest show among the ones left after both checks."],"explanation":["Star uses too many props, and Rain lasts too long.","Moon and Leaf both fit, at ten and eight minutes.","Moon is the longer of the two suitable shows."],"optionWhy":["Its duration fits, but four props exceed the prop limit.","It fits, but Moon is longer.","Fourteen minutes exceed the duration limit.","It fits both limits and is longer than the other suitable show."],"think":"Which tempting long show had to be removed first?","visual":{"type":"table","headers":["Show","Minutes","Props"],"rows":[["Moon","10","2"],["Star","12","4"],["Leaf","8","3"],["Rain","14","1"]],"caption":"At most 12 minutes and 3 props; choose the longest suitable show"},"id":"m11l03-q1","kind":"guided"},{"stem":"You need at least four sheets of paper and have six tokens. Among packs you can use and afford, choose the one with the most sheets. Pack Pine has 3 sheets for 2 tokens; Oak has 4 for 4; Willow has 5 for 6; Ash has 6 for 7.","ask":"Which pack fits the goal?","options":["Willow","Pine","Oak","Ash"],"answer":0,"hints":["Cross out packs with too few sheets or too high a price.","Compare sheet counts only for the packs that remain."],"explanation":["Pine has too few sheets, and Ash costs more than six tokens.","Oak and Willow both work, with four and five sheets.","Willow gives the most sheets among the suitable affordable packs."],"optionWhy":["It has five sheets and costs exactly the six-token budget.","Three sheets are not enough.","It works, but Willow provides more sheets within budget.","Seven tokens are more than the available six."],"think":"Why is the pack with the most sheets overall not the answer?","visual":{"type":"table","headers":["Pack","Sheets","Tokens"],"rows":[["Pine","3","2"],["Oak","4","4"],["Willow","5","6"],["Ash","6","7"]],"caption":"Need at least four sheets; budget six tokens"},"id":"m11l03-q2","kind":"practice"},{"stem":"A walk must use no bridge and take at most 10 minutes. Choose the shortest walk that meets both rules. River takes 6 minutes and uses a bridge; Garden takes 8 with no bridge; Square takes 10 with no bridge; Wood takes 12 with no bridge.","ask":"Which walk should you choose?","options":["Wood","Garden","River","Square"],"answer":1,"hints":["The six-minute route must still pass the bridge rule.","Compare the times of the allowed routes."],"explanation":["River breaks the no-bridge rule, and Wood exceeds ten minutes.","Garden and Square remain, at eight and ten minutes.","Garden is the shorter allowed walk."],"optionWhy":["It has no bridge but takes too long.","It passes both rules and is shorter than Square.","Its short time cannot undo the bridge-rule failure.","It works, but Garden is shorter."],"think":"Which is the filtering step and which is the comparing step?","visual":{"type":"table","headers":["Walk","Minutes","Bridge?"],"rows":[["River","6","Yes"],["Garden","8","No"],["Square","10","No"],["Wood","12","No"]],"caption":"No bridge; at most ten minutes; prefer shorter"},"id":"m11l03-q3","kind":"practice"},{"stem":"A rehearsal room needs at least four seats and must cost no more than $5. Among suitable rooms, the team wants the largest number of clear floor squares. Blue has 4 seats, costs $4 and has 6 floor squares. Gold has 3 seats, costs $2 and has 9. Green has 5 seats, costs $5 and has 8. Pink has 6 seats, costs $6 and has 10.","ask":"Which room best matches the team's goal?","options":["Gold","Pink","Green","Blue"],"answer":2,"hints":["Seats and price are requirements; floor space is the comparison goal.","Remove Gold and Pink if either requirement fails, then compare what remains."],"explanation":["Gold has too few seats, and Pink costs too much.","Blue and Green both satisfy the requirements.","Green has eight clear floor squares, more than Blue's six."],"optionWhy":["Its large floor does not fix the shortage of seats.","Its ten floor squares do not make the price affordable.","It satisfies both requirements and has the most floor space among suitable rooms.","It is suitable, but Green has more clear floor space."],"think":"Explain why the biggest room overall was not suitable.","visual":{"type":"table","headers":["Room","Seats","Cost","Floor squares"],"rows":[["Blue","4","$4","6"],["Gold","3","$2","9"],["Green","5","$5","8"],["Pink","6","$6","10"]],"caption":"Four seats; budget $5; prefer more clear floor squares"},"id":"m11l03-q4","kind":"practice"},{"stem":"A party needs four badges. Each badge uses one card and one ribbon. Choose the cheapest pack with enough of both. Tiny has 4 cards and 3 ribbons for $3. Ready has 4 and 4 for $5. Extra has 5 and 5 for $6. Shiny has 4 and 4 for $7.","ask":"Which pack should the party choose?","options":["Tiny","Extra","Shiny","Ready"],"answer":3,"hints":["Each of the four badges needs both materials.","Compare prices after removing any pack short of one material."],"explanation":["Tiny is short of one ribbon, so it cannot make four badges.","Ready, Extra and Shiny each have enough cards and ribbons.","Ready is the cheapest suitable pack at five dollars."],"optionWhy":["Three ribbons can make only three complete badges.","It has enough, but costs more than Ready.","It has enough, but costs more than Ready without being needed.","It makes all four badges at the lowest suitable price."],"think":"Which material stopped the cheapest-looking pack from working?","visual":{"type":"table","headers":["Pack","Cards","Ribbons","Cost"],"rows":[["Tiny","4","3","$3"],["Ready","4","4","$5"],["Extra","5","5","$6"],["Shiny","4","4","$7"]],"caption":"Four badges; each needs one card and one ribbon"},"id":"m11l03-q5","kind":"transfer"}],"activity":{"title":"Plan shortlist","instructions":"Make four imaginary room cards showing seats, token cost and space for dancing. Set two requirements: at least four seats and a cost of no more than five tokens. Cross out any unsuitable room. Among rooms left, choose the largest dance space. Change only the comparison goal to lowest cost and check whether your choice changes.","coach":"Ask for both parts of the justification: why the room is allowed and why it is preferred among allowed rooms. A tie can be kept as a tie if the cards create one."},"reflection":"Did you first check whether the plan worked, or were you drawn to its best-looking feature?","transfer":"Compare two possible games using a group-size requirement and a separate goal such as shortest setup time.","parent":{"aim":"Look for separating mandatory constraints from the preference used to compare survivors.","prompt":"Which plans survive all the rules before you compare them?","pitfall":"Selecting the overall cheapest, largest or quickest plan despite a failed requirement.","success":"The child filters unsuitable plans and then compares only suitable ones."}},{"id":"m11l04","module":11,"lesson":4,"title":"A new rule changes the plan","goal":"I can update a plan while keeping the rules that have not changed.","story":"A good planner sometimes needs to change their mind. An extra friend arrives, a room becomes unavailable, or a rehearsal gets shorter. You do not have to throw away every useful idea. Find exactly what changed, keep the other rules, and check a new plan carefully.","tool":"Change one thing, recheck all","steps":["Name the new information or changed rule.","Keep all requirements that have not changed.","Check the old and new plans against the updated requirements."],"worked":{"stem":"A club can spend at most $5 on a room. Acorn has 2 seats for $2; Birch has 3 for $4; Cedar has 4 for $5; Elm has 5 for $7. Acorn was chosen for two children. Now four children need seats, and the budget stays $5.","ask":"Which room meets the updated requirements?","options":["Acorn","Birch","Elm","Cedar"],"answer":3,"hints":["The group size changed, but the budget did not.","Check four seats and at most five dollars."],"explanation":["Acorn and Birch no longer have enough seats for four children.","Elm has enough seats but exceeds the unchanged budget.","Cedar has four seats and costs five dollars, so it works."],"optionWhy":["The original choice now has too few seats.","Three seats are not enough for four children.","Its seven-dollar cost breaks the budget rule.","It has enough seats and stays within the unchanged budget."],"think":"Which old rule did you have to keep after the new friend information?","visual":{"type":"table","headers":["Room","Seats","Cost"],"rows":[["Acorn","2","$2"],["Birch","3","$4"],["Cedar","4","$5"],["Elm","5","$7"]],"caption":"New group size: four; budget remains $5"},"id":"m11l04-w","kind":"worked"},"questions":[{"stem":"A rehearsal slot used to allow 15 minutes. It now allows only 10 minutes. A whole act must fit; acts cannot be shortened. Story takes 12 minutes, Dance takes 8, Song takes 11 and Puppets takes 15.","ask":"Which act still fits the new slot?","options":["Dance","Story","Song","Puppets"],"answer":0,"hints":["Use the new ten-minute limit.","Each whole act must finish within that limit."],"explanation":["Story, Song and Puppets take more than ten minutes.","Dance takes only eight minutes.","Dance is the act that still fits without shortening."],"optionWhy":["Eight minutes fit inside the new ten-minute slot.","Twelve minutes exceed the new limit.","Eleven minutes exceed the new limit.","Fifteen minutes fit the old slot but not the new one."],"think":"What would go wrong if you kept checking the old limit?","visual":{"type":"table","headers":["Act","Minutes"],"rows":[["Story","12"],["Dance","8"],["Song","11"],["Puppets","15"]],"caption":"Updated rehearsal limit: 10 minutes"},"id":"m11l04-q1","kind":"guided"},{"stem":"Art, Music and Story each need one day: Monday, Tuesday and Wednesday, with one activity per day. Music must be before Story. The old plan was Art, Music, Story. A new rule says Music cannot be on Tuesday.","ask":"Which new Monday-to-Wednesday plan follows all the rules?","options":["Art, Story, Music","Music, Art, Story","Art, Music, Story","Story, Art, Music"],"answer":1,"hints":["Keep Music-before-Story as well as the new rule.","Check the day used by Music in each plan."],"explanation":["Music, Art, Story puts Music on Monday, not Tuesday.","It also keeps Music before Story and uses each activity once.","This new plan satisfies the updated set of rules."],"optionWhy":["Music also comes after Story in this plan.","Music is not Tuesday and still comes before Story.","This is the old plan, which places Music on the now-forbidden Tuesday.","Music comes after Story, breaking the unchanged order rule."],"think":"Which requirement stayed the same when Tuesday became unavailable for Music?","visual":{"type":"table","headers":["Day","Old activity"],"rows":[["Monday","Art"],["Tuesday","Music"],["Wednesday","Story"]],"caption":"New rule: Music cannot be Tuesday; Music must still be before Story"},"id":"m11l04-q2","kind":"practice"},{"stem":"A badge workshop made four allowed designs: red-circle, red-star, blue-circle and blue-star. The red ink is now unavailable. The circle and star shapes are both still available, and blue ink is available.","ask":"Which list gives all the designs that can still be made?","options":["Blue-circle only","All four original designs","Blue-circle and blue-star","Red-circle and blue-circle"],"answer":2,"hints":["Only the ink choice changed.","Keep every design that uses blue and an available shape."],"explanation":["Both red designs need unavailable red ink.","Blue-circle and blue-star use the available ink and shapes.","Those two designs remain possible."],"optionWhy":["Blue-star is also possible, so this list is incomplete.","The two red designs can no longer be made.","Both designs use blue ink, and both shapes remain available.","Red-circle still needs the unavailable red ink."],"think":"Why did losing one colour not remove a shape?","visual":{"type":"table","headers":["Material","Available now?"],"rows":[["Red ink","No"],["Blue ink","Yes"],["Circle shape","Yes"],["Star shape","Yes"]],"caption":"Only red ink became unavailable"},"id":"m11l04-q3","kind":"practice"},{"stem":"All four rooms are allowed. The first goal was lowest cost, so the club chose Acorn. The goal now changes to the most seats; cost is no longer a restriction. Acorn has 2 seats for $1, Birch has 4 for $3, Cedar has 3 for $2 and Elm has 6 for $5.","ask":"Which room matches the new goal?","options":["Acorn","Birch","Cedar","Elm"],"answer":3,"hints":["The question explicitly changes what matters most.","Compare seats rather than the old price goal."],"explanation":["The new goal is to obtain the most seats, and all rooms are allowed.","Elm has six seats, more than four, three or two.","Elm is the choice that matches the updated goal."],"optionWhy":["It still has the lowest cost, but that is no longer the goal.","Four seats are fewer than Elm's six.","Three seats are fewer than Elm's six.","Its six seats are the greatest capacity."],"think":"Explain why changing your choice can be sensible when the goal changes.","visual":{"type":"table","headers":["Room","Seats","Cost"],"rows":[["Acorn","2","$1"],["Birch","4","$3"],["Cedar","3","$2"],["Elm","6","$5"]],"caption":"New goal: most seats; all rooms allowed"},"id":"m11l04-q4","kind":"practice"},{"stem":"A play needs one narrator and one bell ringer, with different children in the jobs. Bella, Leo and Mia were available. The old plan was Bella narrates and Leo rings. Leo is now unavailable. Bella must remain narrator, and Mia is still available.","ask":"Which new plan follows all the updated rules?","options":["Bella narrates; Mia rings","Bella narrates; Leo rings","Mia narrates; Bella rings","Bella narrates and rings"],"answer":0,"hints":["Find the job affected by Leo leaving.","Keep Bella as narrator and use different children for the jobs."],"explanation":["The bell-ringer job needs a replacement because Leo is unavailable.","Bella must keep the narrator job, and Mia can take the bell.","Bella narrating with Mia ringing meets every updated rule."],"optionWhy":["Mia fills the affected job while Bella keeps her required job.","Leo can no longer take a job.","This changes Bella's narrator job, which must stay the same.","One child cannot take both jobs."],"think":"Which part of the old plan could you keep?","visual":{"type":"table","headers":["Child","Updated situation"],"rows":[["Bella","Must remain narrator"],["Leo","Unavailable"],["Mia","Available"]],"caption":"Different children must take the two jobs"},"id":"m11l04-q5","kind":"transfer"}],"activity":{"title":"Change-card challenge","instructions":"Arrange three toy performers in a row. Set a rule that the rabbit performs before the bear. Find one order that works. Then draw a change card saying the cat cannot go first. Keep the rabbit-before-bear rule and find an order that now works. Make another change card and recheck every rule before accepting a plan.","coach":"Rabbit, cat, bear and rabbit, bear, cat both meet the first two rules. A new rule may leave several plans, one plan or no plan; check rather than forcing an answer."},"reflection":"What did you keep from the old plan, and what did you need to change?","transfer":"When a story character learns a new fact, explain which part of their plan should change and which still works.","parent":{"aim":"Look for using updated information without forgetting unchanged rules.","prompt":"What changed, and what is still required?","pitfall":"Clinging to the original answer or discarding every old requirement.","success":"The child names the change, checks all current rules and revises only what is needed."}},{"id":"m12l01","module":12,"lesson":1,"title":"Choose your thinking tool","goal":"I can choose a useful first step for an unfamiliar problem.","story":"Your thinking toolkit now holds several useful tools. You can organise clues, draw positions, finish one row, try a counterexample or check every case. Today nobody will announce which tool to use. Read the job carefully, choose a useful beginning, and explain how it helps.","tool":"Match the tool to the job","steps":["Name what the question is asking you to find or check.","Choose a tool that makes the important information clearer.","Try it, then check whether it helped with the actual question."],"worked":{"stem":"Mia, Leo and Zoe need a first, second and third place in a show. Mia must be before Zoe, and Leo cannot be first. You want to work out an allowed order.","ask":"Which first step most directly organises the useful information?","options":["Count how many letters are in the show title","Put the three name cards beside three labelled places and check each rule","Choose the child with your favourite name","Ignore the rules and copy yesterday's order"],"answer":1,"hints":["The information is about positions and order.","Choose something that lets you test positions against the rules."],"explanation":["The problem gives three people, three places and two order rules.","Name cards beside labelled places let you try an arrangement and check both rules.","This directly organises the information needed to find an allowed order."],"optionWhy":["The title length has no stated link to the order.","It represents the actual people, positions and constraints.","A favourite name does not check either rule.","Yesterday's order may break today's rules."],"think":"What would you check after placing the first name card?","visual":{"type":"table","headers":["People","Rules"],"rows":[["Mia, Leo, Zoe","Mia before Zoe; Leo not first"]],"caption":"Find an allowed order"},"id":"m12l01-w","kind":"worked"},"questions":[{"stem":"A sign claims, \"Every balloon in this room is red.\" You can see one blue balloon in the room, and its colour is clearly not red. You want to check the sign's claim.","ask":"Which thinking tool directly settles this claim?","options":["Count only the red balloons and ignore the blue one","Choose the balloon colour you like best","Use the blue balloon as a counterexample","Find the longest balloon string"],"answer":2,"hints":["The claim uses every.","Look for a given case that does not fit the claim."],"explanation":["The sign includes every balloon in the room.","The blue balloon is in the room and is not red.","That one counterexample is enough to show the universal claim is false."],"optionWhy":["Ignoring a counterexample prevents a fair check.","Your favourite colour does not decide the observed balloon colours.","It is an actual case covered by the claim that contradicts it.","String length does not test the colour claim."],"think":"Why do you not need to inspect every other balloon to reject this claim?","visual":null,"id":"m12l01-q1","kind":"guided"},{"stem":"A snack choice needs one of three cup colours and one of two fruits. Every cup can go with either fruit. You want to list every choice without missing any.","ask":"Which first step gives a clear organised search?","options":["Write any pair that comes to mind and stop after one","Count the letters in the fruit names","Choose only pairs in your favourite cup colour","Keep one cup colour fixed and list both fruits with it"],"answer":3,"hints":["The problem asks for all allowed pairs.","Finish one group before moving to the next cup colour."],"explanation":["Each cup colour can be paired with both fruits.","Keeping one colour fixed lets you finish its two possibilities.","Repeating this for the other colours gives an organised complete list."],"optionWhy":["One pair cannot cover all cup and fruit choices.","Letter counts do not organise the combinations.","This deliberately leaves out other allowed colours.","It starts a method that can cover every pair once."],"think":"What should happen after you finish the first cup-colour group?","visual":{"type":"table","headers":["Part","Number of choices"],"rows":[["Cup colour","3"],["Fruit","2"]],"caption":"Choose one from each group"},"id":"m12l01-q2","kind":"practice"},{"stem":"An arrow points right. You need to show one quarter turn anticlockwise. The page stays fixed. Anticlockwise follows up, left, down, right.","ask":"Which action follows the task correctly?","options":["Start at right and trace one anticlockwise step to up","Start at up because every turn begins there","Rotate the page clockwise while leaving the arrow on it","Point down because clockwise is easier to remember"],"answer":0,"hints":["Use both the stated start and turning direction.","Find what comes after right in the anticlockwise cycle."],"explanation":["The arrow starts at right, so counting must start there.","One anticlockwise step from right reaches up.","Tracing that one step follows the given task."],"optionWhy":["It uses the correct starting direction and turn.","The starting direction is right, not up.","The task says the page stays fixed.","This changes the requested turning direction."],"think":"Which two words would you check before moving your finger?","visual":{"type":"arrows","items":["right"],"caption":"Starting arrow; one anticlockwise quarter turn"},"id":"m12l01-q3","kind":"practice"},{"stem":"A bag contains two red tokens and one blue token. Take without looking and do not replace tokens. Someone says, \"Two draws guarantee a red.\" You want to check the hardest possible start.","ask":"Which start should you examine?","options":["Ignore the blue token when checking the bag","Imagine drawing the blue token first, then check what remains","Assume the first token is red because there are more reds","Try once and declare the promise true if you get red"],"answer":1,"hints":["A guarantee must survive an unlucky start.","Which first draw delays getting a red token?"],"explanation":["Drawing blue first gives no red yet, making it the harder start.","After that blue is removed, both remaining tokens are red.","Checking this start shows that a second draw must provide red."],"optionWhy":["Ignoring an allowed token misses an important case.","It checks the allowed start that delays the wanted result.","A likely first result does not cover every possible start.","One lucky trial does not test all allowed cases."],"think":"Why is checking the tricky start useful for a guarantee?","visual":{"type":"table","headers":["Colour","Count"],"rows":[["Red","2"],["Blue","1"]],"caption":"No replacement"},"id":"m12l01-q4","kind":"practice"},{"stem":"In a story, a library book is on the floor and the window is open. A character says, \"A bird definitely pushed the book down.\" The story gives no other clues about what moved the book.","ask":"Which first step best helps you check the character's judgement?","options":["Invent a bird sighting and treat it as a stated fact","Choose the funniest explanation as the certain answer","Separate what the story reports from the character's guess","Assume the confident character must be right"],"answer":2,"hints":["Two details are reported, but the cause is not.","Sort the observations and the proposed explanation."],"explanation":["The reported facts are an open window and a book on the floor.","A bird pushing the book is a proposed cause, not a supplied observation.","Separating facts from guesses reveals that the definite claim is not established."],"optionWhy":["An invented sighting cannot be used as if it were in the story.","An entertaining explanation is not automatically certain.","This keeps the evidence separate from an unsupported explanation.","Confidence alone does not add evidence."],"think":"Name one fact and one guess without adding a new clue.","visual":null,"id":"m12l01-q5","kind":"transfer"}],"activity":{"title":"Tool cards","instructions":"Make four cards labelled Draw positions, Make a list, Find a counterexample and Check every case. A partner describes a short problem: arranging three toys, pairing two hats with two scarves, checking an all-red claim when a blue object is present, or testing a guarantee from a small bag. Choose a tool and explain the first step.","coach":"More than one tool can sometimes help. Accept a sensible choice when the child can show how it addresses the specific information and goal."},"reflection":"What feature of a problem helped you choose a tool?","transfer":"Before your next unfamiliar maths or story question, name one useful first action rather than guessing an answer.","parent":{"aim":"Observe deliberate strategy selection tied to the task.","prompt":"What kind of information do you need to organise or check?","pitfall":"Using the most recently learned method without checking whether it fits.","success":"The child chooses a relevant first step and can explain its purpose."}},{"id":"m12l02","module":12,"lesson":2,"title":"The story evidence desk","goal":"I can combine clues while keeping my conclusions within the evidence.","story":"The evidence desk has several small mysteries from a library and a puppet workshop. Some clues allow a firm answer; others leave more than one possibility. Read the whole case before deciding. Your job is to explain what the clues support, not to make the most dramatic guess.","tool":"Clues first, conclusion second","steps":["Identify the exact question and the facts supplied.","Connect relevant clues without adding facts of your own.","Check whether the conclusion is certain, possible or not supported."],"worked":{"stem":"A workshop log follows this rule: every puppet that used glitter has a star beside its name. Fox has no star beside its name. Owl has a star. These are the only facts about glitter use.","ask":"Which conclusion must be true?","options":["Owl definitely did not use glitter","Both puppets used glitter","Fox did not use glitter","Owl definitely used glitter"],"answer":2,"hints":["Use the direction of the log rule carefully.","A glitter user must have a star; does the rule say every star means glitter use?"],"explanation":["Every glitter user must have a star in the log.","Fox has no star, so Fox cannot have been a glitter user.","Owl's star alone does not settle whether Owl used glitter."],"optionWhy":["Owl might have used glitter; the star does not rule it out.","Fox has no required star, so both using glitter is impossible.","Fox would need a star if Fox had used glitter, but none is present.","The rule does not say that only glitter users receive stars."],"think":"Which conclusion is certain, and which puppet's glitter use is still unknown?","visual":{"type":"table","headers":["Puppet","Star in the log?"],"rows":[["Fox","No"],["Owl","Yes"]],"caption":"Rule: glitter use requires a star in the log"},"id":"m12l02-w","kind":"worked"},"questions":[{"stem":"Last week a club held a long discussion and used its old bell. This week it shortened the discussion and used a new bell. It finished earlier this week. Pip says the new bell definitely caused the earlier finish.","ask":"What is the main gap in Pip's reasoning?","options":["The new bell must have made the meeting longer","An earlier finish is impossible","The old bell must have been blue","The shorter discussion could also explain the earlier finish"],"answer":3,"hints":["How many things changed between the weeks?","Check for another changed factor that could affect finishing time."],"explanation":["Both the discussion length and the bell changed.","Shortening a discussion could help a meeting finish earlier.","The facts do not isolate the bell as the definite cause."],"optionWhy":["The facts do not show the new bell made the meeting longer.","The story explicitly says the club finished earlier.","Bell colour is neither given nor relevant to this causal claim.","It identifies another changed factor relevant to the result."],"think":"What would you try to keep the same in a better comparison?","visual":null,"id":"m12l02-q1","kind":"guided"},{"stem":"A sign on a book box says, \"Every book in this box has an animal character.\" Bella finds one book in the box whose only characters are trains, and it has no animal characters.","ask":"What does this discovery show?","options":["The sign's claim is false","Every book in the box is about trains","No book in the box has an animal","The sign must still be true because only one book was checked"],"answer":0,"hints":["The sign makes a claim about every book.","One actual book in the box does not fit that claim."],"explanation":["The train book is included in the sign's claim because it is in the box.","It has no animal character, contradicting the claim.","The universal claim is false, but the other books' characters are still unknown."],"optionWhy":["One counterexample disproves the claim about every book.","One train book does not tell us every other book is also about trains.","Other books might still have animals.","One counterexample is enough to disprove an every claim."],"think":"Which stronger claims about the other books would go beyond the evidence?","visual":null,"id":"m12l02-q2","kind":"practice"},{"stem":"A missing stage ribbon is blue and long. Three found ribbons are being checked: Ribbon One is blue and short; Ribbon Two is green and long; Ribbon Three is blue and long. Both stated features must match.","ask":"Which found ribbon could match the description?","options":["All three ribbons","Ribbon Three only","Ribbon One only","Ribbon Two only"],"answer":1,"hints":["Check colour and length separately.","A ribbon must match both, not just one."],"explanation":["Ribbon One has the right colour but the wrong length.","Ribbon Two has the right length but the wrong colour.","Only Ribbon Three matches both given features."],"optionWhy":["Two of the ribbons fail one required feature.","It is both blue and long.","It is blue, but its short length does not match.","It is long, but its green colour does not match."],"think":"Why does matching the description still not prove its owner?","visual":{"type":"table","headers":["Ribbon","Colour","Length"],"rows":[["One","Blue","Short"],["Two","Green","Long"],["Three","Blue","Long"]],"caption":"Description: blue and long"},"id":"m12l02-q3","kind":"practice"},{"stem":"Three readers kept a score before and after practice. Mia went from 2 to 5, Leo from 4 to 6, and Zoe from 1 to 3. The question is about the biggest increase, not the highest final score.","ask":"Who had the biggest increase?","options":["Zoe","All three increased by the same amount","Mia","Leo"],"answer":2,"hints":["Compare each reader with their own starting score.","Work out after minus before for each row."],"explanation":["Mia increased by three, from two to five.","Leo and Zoe each increased by two.","Mia had the biggest increase, even though Leo had the highest final score."],"optionWhy":["Zoe also increased by only two.","The increases are three, two and two, so they are not equal.","Her score increased by three, the largest change.","Leo finished highest but increased by only two."],"think":"How did the question tell you which comparison to make?","visual":{"type":"table","headers":["Reader","Before","After"],"rows":[["Mia","2","5"],["Leo","4","6"],["Zoe","1","3"]],"caption":"Compare increases, not just final scores"},"id":"m12l02-q4","kind":"practice"},{"stem":"A library has two different books titled Ocean. One is kept on the red shelf and the other on the blue shelf. A borrowing slip says only \"Ocean\" and gives no other identifying information.","ask":"What can you conclude about the borrowed book's shelf?","options":["It definitely came from the red shelf","It definitely came from the blue shelf","It must have come from both shelves","It could have come from either shelf; the slip is not enough"],"answer":3,"hints":["Does the title identify just one book in this library?","Check whether each shelf has a book matching the slip."],"explanation":["Both shelves contain a book with the title on the slip.","The slip gives no detail that distinguishes those two books.","Either shelf remains possible, so the shelf cannot be determined."],"optionWhy":["A red-shelf book is possible, but the blue-shelf book also matches.","A blue-shelf book is possible, but the red-shelf book also matches.","One title on the slip does not mean both books were borrowed.","Both books match all the identifying information supplied."],"think":"What extra detail could help tell the two books apart?","visual":{"type":"table","headers":["Book title","Shelf"],"rows":[["Ocean","Red"],["Ocean","Blue"]],"caption":"Borrowing slip gives the title Ocean only"},"id":"m12l02-q5","kind":"transfer"}],"activity":{"title":"Evidence sorting desk","instructions":"Write this case on a card: a red cup is on a table, water is on the floor, and the door is open. Write three observations and two possible explanations on separate slips. Sort them into Given facts and Possible explanations. Add a new invented clue, clearly labelled as new information, and discuss which explanations become more or less plausible.","coach":"Do not silently turn an invented clue into an original fact. Several causes may remain possible; a clear explanation of uncertainty is a successful response."},"reflection":"Which clue allowed a firm conclusion, and which case still had more than one possibility?","transfer":"When reading a story, name the sentence that supports an inference and explain what remains unknown.","parent":{"aim":"Check whether the child combines clues without expanding their scope.","prompt":"Which exact fact supports that part of your conclusion?","pitfall":"Reversing a rule, treating one feature match as identity, or confusing a high final value with a large change.","success":"The child points to relevant facts and uses could or must accurately."}},{"id":"m12l03","module":12,"lesson":3,"title":"Plan the tiny festival","goal":"I can combine several thinking tools to make and revise a workable plan.","story":"The tiny festival needs a running order, supplies and enough places for everyone. Each small planning job has its own question. Keep the important information visible, check the limits, and explain your choices. You can use a table for one job and an arrangement of cards for another.","tool":"Plan and check each part","steps":["Break the festival plan into a clear question at a time.","Use the relevant numbers or rules to make a choice.","Check that the choice meets every current requirement."],"worked":{"stem":"The festival has a 10 o'clock slot and an 11 o'clock slot, with one act in each. Story and Dance must each happen once. Dance needs the garden, which is available only at 11. Story can happen in either slot.","ask":"Which schedule works?","options":["Dance at 10; Story at 11","Story in both slots","Dance in both slots","Story at 10; Dance at 11"],"answer":3,"hints":["Start with the act that has only one possible slot.","Once Dance is placed, find the remaining place for Story."],"explanation":["Dance must use the 11 o'clock slot because that is when the garden is available.","The other slot is 10 o'clock, which Story can use.","Story at 10 and Dance at 11 uses each act once and meets the garden rule."],"optionWhy":["The garden is unavailable for Dance at 10.","This leaves Dance out entirely.","This leaves Story out and puts Dance in an unavailable slot at 10.","Both acts appear once and Dance gets the available garden slot."],"think":"Why was Dance the useful act to place first?","visual":{"type":"table","headers":["Act","Available times"],"rows":[["Story","10 or 11"],["Dance","11 only"]],"caption":"One act at 10 and one at 11"},"id":"m12l03-w","kind":"worked"},"questions":[{"stem":"A festival snack pack needs one apple and one juice box. There are five apples and three juice boxes. No pack can be missing either item, and no item can go into two packs.","ask":"What is the greatest number of complete packs you can make?","options":["Three packs","Five packs","Eight packs","Four packs"],"answer":0,"hints":["Each pack needs both kinds of item.","Which item will run out first?"],"explanation":["Three juice boxes can supply only three packs.","There are enough apples for those three packs, with two apples left over.","The greatest possible number of complete packs is three."],"optionWhy":["Juice limits the number to three, and apples are sufficient.","There are not five juice boxes.","Adding the items does not produce eight complete two-item packs.","Four packs would need four juice boxes, but only three exist."],"think":"Which leftover item cannot make another complete pack on its own?","visual":{"type":"table","headers":["Supply","Number"],"rows":[["Apples","5"],["Juice boxes","3"]],"caption":"Each pack needs one of each"},"id":"m12l03-q1","kind":"guided"},{"stem":"Four visitors each need one entry ticket. Choose the cheapest pack with at least four tickets. Red has 3 tickets for $2, Blue has 4 for $3, Green has 5 for $5 and Gold has 4 for $4.","ask":"Which pack should the festival buy?","options":["Gold","Blue","Red","Green"],"answer":1,"hints":["First check whether each pack has enough tickets.","Compare prices among packs that can admit all four visitors."],"explanation":["Red has only three tickets, so it cannot cover all visitors.","Blue, Green and Gold have enough tickets.","Blue has the lowest suitable price, three dollars."],"optionWhy":["It also works, but costs more than Blue.","It has enough tickets and is cheapest among suitable packs.","It is cheap but leaves one visitor without a ticket.","It works, but costs more than Blue."],"think":"Name the two checks you used.","visual":{"type":"table","headers":["Pack","Tickets","Cost"],"rows":[["Red","3","$2"],["Blue","4","$3"],["Green","5","$5"],["Gold","4","$4"]],"caption":"Four visitors; choose the cheapest sufficient pack"},"id":"m12l03-q2","kind":"practice"},{"stem":"Mia, Leo and Zoe each perform once in a three-person show. Mia must be before Zoe. Leo must not be last.","ask":"Who must be last?","options":["Leo","There is not enough information to know who is last","Zoe","Mia"],"answer":2,"hints":["Try each person in the last position.","Mia needs Zoe somewhere after her; Leo has a direct restriction."],"explanation":["Mia cannot be last because Zoe must come after her.","Leo cannot be last because the rule says so.","Zoe is the only person left for the last position."],"optionWhy":["The rule directly prevents Leo from being last.","The last position is forced, although the first two positions can vary.","Both other people are ruled out of the last position.","Mia last would leave no place after her for Zoe."],"think":"Can the first two performers still change order?","visual":{"type":"table","headers":["Performer rules"],"rows":[["Mia before Zoe"],["Leo not last"]],"caption":"Use each of Mia, Leo and Zoe once"},"id":"m12l03-q3","kind":"practice"},{"stem":"A room has six seats. The plan was for four children and one adult, each needing one seat. One more child joins. The same adult still attends, and the room still has six seats.","ask":"Does the room have enough seats for the updated group?","options":["No; the updated group needs seven seats","Yes; only the children count, so five seats are needed","No; adding anyone always makes a room too small","Yes; five children and one adult need six seats"],"answer":3,"hints":["Update only the child count, then include the adult.","Compare the total people with the six available seats."],"explanation":["Four children plus one new child makes five children.","The adult also needs a seat, making six people in total.","The room has exactly enough seats for the updated group."],"optionWhy":["The updated group has six people, not seven.","The adult also needs a seat, according to the rule.","The old group used five seats, leaving room for one more person.","It counts every person once and matches the available six seats."],"think":"Which unchanged fact was important when you counted again?","visual":{"type":"table","headers":["Item","Count"],"rows":[["Children before change","4"],["Extra child","1"],["Adults","1"],["Seats","6"]],"caption":"Everyone needs one seat"},"id":"m12l03-q4","kind":"practice"},{"stem":"A festival session has two acts, one in each slot. The original plan was Music followed by Drums. A new rule says at least one act must be quiet. Music and Drums are loud; Story and Drawing are quiet. Acts cannot be repeated.","ask":"Which updated plan follows the new rule and the no-repeat rule?","options":["Music followed by Story","Music followed by Drums","Story followed by Story","Drums followed by Music"],"answer":0,"hints":["Check that a quiet act appears at least once.","Also check that the two acts are different."],"explanation":["Music followed by Story contains the quiet act Story.","The two acts are different, so it also passes the no-repeat rule.","This update meets both current requirements."],"optionWhy":["It includes a quiet act and uses two different acts.","Both acts are loud, so the new rule is not met.","It includes a quiet act but repeats that act.","Changing the order of two loud acts does not add a quiet act."],"think":"Why did simply swapping the original acts fail to solve the new problem?","visual":{"type":"table","headers":["Act","Sound"],"rows":[["Music","Loud"],["Drums","Loud"],["Story","Quiet"],["Drawing","Quiet"]],"caption":"Two different acts; at least one must be quiet"},"id":"m12l03-q5","kind":"transfer"}],"activity":{"title":"Design a mini programme","instructions":"Make four activity cards: Story takes 5 minutes and 1 token; Music takes 6 minutes and 2 tokens; Craft takes 8 minutes and 3 tokens; Game takes 4 minutes and 2 tokens. Choose exactly two different activities. Together they must take at most 12 minutes and cost at most 4 tokens. List the pairs that work, then choose the shortest programme.","coach":"Story-Music, Story-Game and Music-Game work. Their times are 11, 9 and 10 minutes. Story-Game is the shortest suitable programme. Order is not part of this particular choice."},"reflection":"Which part of planning needed a table, and which part could you organise with cards?","transfer":"Use two simple requirements and one clear goal to help plan a real reading, game or performance session.","parent":{"aim":"Look for flexible use of ordering, filtering, arithmetic and updated constraints.","prompt":"Which small question are you solving right now?","pitfall":"Mixing totals or rules from separate jobs, or forgetting one unchanged requirement.","success":"The child can explain each choice with the relevant facts and check the completed plan."}},{"id":"m12l04","module":12,"lesson":4,"title":"New places, familiar thinking","goal":"I can use a familiar thinking method in a new setting.","story":"Your final foundation adventure visits a garden, a parcel room, a robot workshop and an art club. The settings are new, but useful thinking moves travel with you. Find the question, choose your method, and check your conclusion. Take time to explain one answer you feel especially sure about.","tool":"Take your tool with you","steps":["Look past the story setting to the relationship or rule.","Choose a familiar tool and use the supplied information.","Check the result and explain how the method travelled to a new context."],"worked":{"stem":"A garden club wants to test whether giving more water changes plant growth. It can compare two pots for the same number of days. Which plan gives the fairest comparison for that question?","ask":"Choose the plan that changes water while keeping the other listed conditions the same.","options":["Use the same seed type, soil and light, but different water amounts","Use different seed types, different light and different water","Use the same water amount but change the pot colours only","Measure one pot today and the other several weeks later"],"answer":0,"hints":["The question concerns one changed factor: water.","Try to keep other possible explanations alike."],"explanation":["Different water amounts create the comparison the club wants to investigate.","Keeping seed type, soil, light and observation time alike reduces other explanations.","This gives a fairer test of water amount, though results still need observing carefully."],"optionWhy":["It changes the target factor and keeps the other listed factors alike.","Changing several factors makes it hard to tell what caused a difference.","Using the same water amount does not compare more water with less.","Unequal growing times create another explanation for a size difference."],"think":"Why would changing both seed type and water make the result harder to interpret?","visual":null,"id":"m12l04-w","kind":"worked"},"questions":[{"stem":"A parcel room uses this rule: every parcel going upstairs has a blue dot on its label. A parcel named Kite has a blue dot. No other label rule or destination information is given.","ask":"What can you conclude about Kite's destination?","options":["Every blue-dot parcel must stay downstairs","Upstairs is possible, but it is not certain","Kite must go upstairs","Kite cannot go upstairs"],"answer":1,"hints":["Check which direction the rule works in.","Could a downstairs parcel also have a blue dot without breaking the stated rule?"],"explanation":["The rule says upstairs parcels need blue dots.","It does not say that blue dots are used only on upstairs parcels.","Kite might go upstairs, but its dot alone does not determine that."],"optionWhy":["This new rule is not stated and would wrongly exclude upstairs blue dots.","The blue dot is compatible with upstairs but does not guarantee it.","This reverses a one-way rule without extra information.","The blue dot does not rule out an upstairs destination."],"think":"Describe two possible destinations that still fit the given rule.","visual":null,"id":"m12l04-q1","kind":"guided"},{"stem":"A robot map has three rows and three columns. A battery is in the bottom-left square. Make a mirror copy across a vertical line through the middle column. The map stays still and only the battery position is reflected.","ask":"Where should the copied battery go?","options":["Bottom-middle square","Top-right square","Bottom-right square","Top-left square"],"answer":2,"hints":["A vertical reflection keeps the row.","Move the battery equally far to the other side of the middle column."],"explanation":["The battery starts in the bottom row, one column left of the line.","Its reflection keeps the bottom row and moves one column right of the line.","The copied battery is in the bottom-right square."],"optionWhy":["This places the battery on the line rather than across it.","This changes the row as well as the column.","It keeps the row and mirrors the column correctly.","This changes the row and leaves the column unchanged."],"think":"Which part of the position stayed the same?","visual":{"type":"grid","rows":[["","",""],["","",""],["Battery","",""]],"caption":"Vertical mirror line through the middle column"},"id":"m12l04-q2","kind":"practice"},{"stem":"A robot name uses one letter followed by one number. The letter can be K or M. The number can be 1, 2 or 3. Every letter-number pair is allowed.","ask":"How many different robot names can be made?","options":["Five names","Three names","Two names","Six names"],"answer":3,"hints":["Keep K fixed and try each number.","Then repeat with M fixed."],"explanation":["The K names are K1, K2 and K3.","The M names are M1, M2 and M3.","There are six different allowed names."],"optionWhy":["Adding two letters and three numbers does not count their pairs.","Three counts only one fixed-letter group.","Two counts letters without their number choices.","Each of two letters has three number partners."],"think":"How is this like listing costume pairs?","visual":{"type":"table","headers":["Part","Choices"],"rows":[["Letter","K or M"],["Number","1, 2 or 3"]],"caption":"A letter must come before a number"},"id":"m12l04-q3","kind":"practice"},{"stem":"A garden sign says, \"Every flower in this garden is purple.\" A visitor finds a white flower growing in this same garden. It is clearly white, not purple.","ask":"Which conclusion follows from this one observation?","options":["The claim that every flower is purple is false","Every flower in the garden is white","There are no purple flowers in the garden","The sign is definitely true unless all flowers are checked"],"answer":0,"hints":["Check whether the observed flower belongs to the claimed group.","The sign uses every, so one exception matters."],"explanation":["The white flower is in the garden covered by the claim.","It does not have the claimed purple colour.","That exception disproves the every-flower claim without deciding the colours of all other flowers."],"optionWhy":["The observed flower is a genuine counterexample.","One white flower does not make every other flower white.","Other flowers might still be purple.","A counterexample can disprove an every claim before every case is checked."],"think":"What do you still not know about the rest of the garden?","visual":null,"id":"m12l04-q4","kind":"practice"},{"stem":"An art club must choose exactly two different tasks, taking at most 10 minutes in total. It wants the most reward stars. Sketch takes 4 minutes for 2 stars; Stamp takes 3 minutes for 1 star; Build takes 7 minutes for 4 stars. Rewards are added.","ask":"Which choice meets the rules and earns the most stars?","options":["Build only","Stamp and Build","Sketch and Stamp","Sketch and Build"],"answer":1,"hints":["List the three possible pairs and check their total times.","Compare stars only for the pairs that fit ten minutes."],"explanation":["Sketch-Stamp takes seven minutes for three stars; Sketch-Build takes eleven minutes and is too long.","Stamp-Build takes ten minutes for five stars.","Stamp-Build earns the most stars among allowed two-task choices."],"optionWhy":["One task does not satisfy exactly two different tasks.","It uses two different tasks, fits ten minutes and earns five stars.","It is allowed but earns only three stars.","It earns six stars but breaks the ten-minute limit."],"think":"Name the search, rule-checking and comparing steps you used.","visual":{"type":"table","headers":["Task","Minutes","Stars"],"rows":[["Sketch","4","2"],["Stamp","3","1"],["Build","7","4"]],"caption":"Exactly two different tasks; at most 10 minutes; maximise stars"},"id":"m12l04-q5","kind":"transfer"}],"activity":{"title":"Teach a thinking move","instructions":"Choose one tool you have learned: check every rule, list pairs, find a counterexample or reflect across a line. Make a small new problem using toys, drawings or a story. Solve it yourself, then ask a partner to try. Explain the clues and check whether another answer could also fit. Repair your question if more than one answer is possible unexpectedly.","coach":"Making a problem is useful evidence of understanding. Accept deliberate multiple-solution questions if the child labels them clearly, and help distinguish those from accidentally ambiguous questions."},"reflection":"Which tool can you now use in more than one kind of problem?","transfer":"Choose one schoolwork question this week and explain which thinking tool helped and how you checked the answer.","parent":{"aim":"Look for transfer across contexts, accurate scope and independent checking.","prompt":"Which familiar relationship can you recognise inside this new story?","pitfall":"Treating every new setting as a completely new method, or guessing from surface words.","success":"The child recognises a useful structure, applies a method and explains a meaningful check."}}]}</script>
<script>(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('curriculum-data').textContent);
const LESSONS=DATA.lessons, MODULES=DATA.modules;
const APP='bella-thinking-studio', KEY=APP+':v1';
const byLesson=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const allQuestions=LESSONS.flatMap(l=>[l.worked,...l.questions]);
const byQuestion=Object.fromEntries(allQuestions.map(q=>[q.id,q]));
let storageOK=true,toastTimer,practice=null,route={page:'home'},pending={},padOpen={},drawings={};
const fresh=()=>({app:APP,schema:1,updatedAt:Date.now(),lastLesson:null,lessons:{},questions:{},settings:{rate:.9,reduceMotion:false}});
function cleanState(raw){
 if(!raw||raw.app!==APP||raw.schema!==1||typeof raw.lessons!=='object'||typeof raw.questions!=='object')throw new Error('This is not a Thinking Studio progress backup.');
 const out=fresh(),num=(n,a,b)=>Number.isFinite(Number(n))?Math.max(a,Math.min(b,Number(n))):a;
 out.lastLesson=Object.hasOwn(byLesson,raw.lastLesson)?raw.lastLesson:null;
 out.settings={rate:num(raw.settings?.rate??.9,.6,1.3),reduceMotion:!!raw.settings?.reduceMotion};
 for(const [id,v]of Object.entries(raw.lessons||{})){if(!Object.hasOwn(byLesson,id)||!v||typeof v!=='object')continue;out.lessons[id]={started:!!v.started,completed:!!v.completed,phase:Math.trunc(num(v.phase,0,3)),qi:Math.trunc(num(v.qi,0,4)),reflection:String(v.reflection||'').slice(0,3000),confidence:['ready','growing','help'].includes(v.confidence)?v.confidence:'',parentSupport:String(v.parentSupport||'').slice(0,50),parentRead:String(v.parentRead||'').slice(0,50),parentNote:String(v.parentNote||'').slice(0,3000),completedAt:num(v.completedAt,0,9999999999999)};}
 for(const[id,v]of Object.entries(raw.questions||{})){if(!Object.hasOwn(byQuestion,id)||!v||typeof v!=='object')continue;const q=byQuestion[id];let first=Number.isInteger(v.firstChoice)&&v.firstChoice>=0&&v.firstChoice<4?v.firstChoice:undefined;let last=Number.isInteger(v.lastChoice)&&v.lastChoice>=0&&v.lastChoice<4?v.lastChoice:undefined;out.questions[id]={firstChoice:first,lastChoice:last,lastChecked:Number.isInteger(v.lastChecked)&&v.lastChecked>=0&&v.lastChecked<4?v.lastChecked:undefined,tries:num(v.tries,0,10000),hints:num(v.hints,0,2),correct:!!v.correct&&last===q.answer,reviewed:!!v.reviewed,seenSolution:!!v.seenSolution,needsReview:!!v.needsReview,practiceTries:num(v.practiceTries,0,10000),note:String(v.note||'').slice(0,3000),everAssisted:!!v.everAssisted,firstSupported:!!v.firstSupported||!!v.hints||!!v.seenSolution};}
 return out;
}
let state;
try{const s=localStorage.getItem(KEY);state=s?cleanState(JSON.parse(s)):fresh();}catch(e){state=fresh();storageOK=false;}
function save(){state.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){if(storageOK)toast('Progress could not be saved. Please export a backup before leaving.');storageOK=false;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function icon(name,cls=''){const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',book:'<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Z"/><path d="M12 5v15"/>',pencil:'<path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14Z"/>',tools:'<path d="m14 6 4 4M3 21l5-1L20 8l-4-4L4 16Z"/><path d="m4 6 3-3 3 3-3 3Zm10 11 4 4 3-3-4-4"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',flag:'<path d="M5 21V3m0 0c4-3 9 3 14 0v10c-5 3-10-3-14 0"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',question:'<circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v1"/>',rule:'<path d="M4 5h5v5H4Zm11 9h5v5h-5ZM9 7h9v7M6 14v5h5"/>',sort:'<path d="M8 5h12M8 12h9M8 19h6M3 4v16m-2-3 2 3 2-3"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-7a8 8 0 1 1 17-4Z"/><path d="M7 9h9M7 13h6"/>',shield:'<path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z"/><path d="m8 11 3 3 5-6"/>',cause:'<circle cx="5" cy="12" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="19" cy="18" r="3"/><path d="m8 11 8-4M8 13l8 4"/>',table:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18M3 15h18"/>',shape:'<path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10v10M3 7l9 5 9-5M8 4l9 5v6"/>',list:'<path d="M9 5h12M9 12h12M9 19h12m-18-1 1 1 2-3M3 5h2M3 12h2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18m-13 5 3 2 5-4"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5Z"/>',sound:'<path d="M4 9h4l5-5v16l-5-5H4Zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/>',star:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>',bulb:'<path d="M8 16c0-3-4-4-3-9a7 7 0 0 1 14 0c1 5-3 6-3 9ZM8 19h8m-6 3h4"/>',refresh:'<path d="M20 8a8 8 0 1 0 0 8M20 2v6h-6"/>',user:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/>'};return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.spark}</svg>`;}
function owl(){return '<svg class="brand-mark" viewBox="0 0 50 55" aria-hidden="true"><path d="M5 5 17 11Q25 7 33 11L45 5v25Q45 50 25 51 5 50 5 30Z" fill="#126c64"/><ellipse cx="17" cy="25" rx="9" ry="10" fill="#fff8df"/><ellipse cx="33" cy="25" rx="9" ry="10" fill="#fff8df"/><circle cx="19" cy="25" r="3" fill="#223f3a"/><circle cx="31" cy="25" r="3" fill="#223f3a"/><path d="m22 32 6 0-3 5Z" fill="#f4bd52"/><path d="m17 44 8-5 8 5" stroke="#80b5a2" stroke-width="2" fill="none"/></svg>';}
function heroArt(){return `<svg class="hero-art" viewBox="0 0 370 290" role="img" aria-label="A curious owl exploring a little world of ideas"><ellipse cx="190" cy="258" rx="128" ry="14" fill="#cfdfcb"/><path d="M50 80q115-65 250 25" fill="none" stroke="#b4cead" stroke-width="1.5" stroke-dasharray="5 8"/><circle cx="82" cy="65" r="14" fill="#f5c86a"/><path d="m77 65 4 4 6-8" stroke="#87682b" stroke-width="2" fill="none"/><g class="art-bob"><rect x="267" y="45" width="55" height="57" rx="15" fill="#fffdf4" transform="rotate(12 290 73)"/><text x="286" y="84" fill="#c18737" font-size="35" font-family="Georgia,serif">?</text><path d="m52 146 6-12 6 12 13 2-10 9 2 14-11-7-12 7 3-14-10-9Z" fill="#e1a27a"/></g><path d="M93 227h168l-7 30H101Z" fill="#cb8465"/><path d="M99 218h168v21H99Z" fill="#f2bd79"/><path d="M111 221h149v11H111Z" fill="#fff6dc"/><path d="M90 201h162v22H90Z" fill="#5d9c88"/><path d="M100 204h146v12H100Z" fill="#eff4de"/><path d="M113 104 141 122q35-12 66 0l31-18-3 72q-2 45-60 46-58-1-60-45Z" fill="#216f60"/><path d="M124 147q-35 8-35 42 20 11 39-7" fill="#4a8e77"/><path d="M229 146q33 9 30 38-18 8-34-4" fill="#4a8e77"/><ellipse cx="153" cy="155" rx="27" ry="29" fill="#fff6dc"/><ellipse cx="198" cy="155" rx="27" ry="29" fill="#fff6dc"/><circle cx="158" cy="154" r="9" fill="#25443b"/><circle cx="194" cy="154" r="9" fill="#25443b"/><circle cx="161" cy="151" r="3" fill="white"/><circle cx="197" cy="151" r="3" fill="white"/><path d="m170 176 13 0-7 10Z" fill="#efb64e"/><path d="m156 202 20-9 20 9" stroke="#8db6a0" stroke-width="3" fill="none"/><circle cx="254" cy="179" r="29" fill="#ffffff55" stroke="#b78745" stroke-width="7"/><path d="m275 200 25 28" stroke="#8b6543" stroke-width="11" stroke-linecap="round"/><rect x="49" y="222" width="30" height="33" rx="7" fill="#e1ab80"/><path d="M64 225v-43m0 28q-23 0-18-20 18 0 18 20m0-12q19 0 19-20-19 0-19 20" stroke="#79a588" stroke-width="3" fill="#a9c8a3"/><path d="m285 134 5-9 5 9 10 2-7 7 1 10-9-5-9 5 2-10-8-7Z" fill="#f4c66c"/><circle cx="325" cy="167" r="4" fill="#b3cbb1"/></svg>`;}
function lr(id){return state.lessons[id]||(state.lessons[id]={started:false,completed:false,phase:0,qi:0});}
function qr(q){return state.questions[q.id]||(state.questions[q.id]={tries:0,hints:0,reviewed:false,needsReview:false});}
function activeQR(q){return route.page==='practice'&&practice?practice.records[q.id]||(practice.records[q.id]={tries:0,hints:0,reviewed:false}):qr(q);}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800);}
function completedCount(){return LESSONS.filter(l=>state.lessons[l.id]?.completed).length;}
function questionCount(){return LESSONS.flatMap(l=>l.questions).filter(q=>state.questions[q.id]?.firstChoice!==undefined||state.questions[q.id]?.reviewed).length;}
function moduleLessons(m){return LESSONS.filter(l=>l.module===m);}
function nextLesson(){return (state.lastLesson&&byLesson[state.lastLesson]&&!state.lessons[state.lastLesson]?.completed?byLesson[state.lastLesson]:LESSONS.find(l=>!state.lessons[l.id]?.completed))||LESSONS[0];}
function navItems(){return [['home','home','My journey'],['practice','spark','Practice room'],['tools','tools','Thinking tools'],['notebook','book','My notebook'],['guide','user','Grown-up guide']];}
function parseRoute(){const parts=location.hash.slice(1).split('/');if(parts[0]==='lesson'&&Object.hasOwn(byLesson,parts[1]))return {page:'lesson',id:parts[1]};return {page:['practice','tools','notebook','guide'].includes(parts[0])?parts[0]:'home'};}
function layout(body){const active=route.page==='lesson'?'home':route.page;return `<div class="shell"><aside class="sidebar"><a class="brand" href="#home">${owl()}<span class="brand-name">Bella's<br>Thinking Studio<small>Stay curious</small></span></a><nav aria-label="Main navigation">${navItems().map(([id,ic,t])=>`<a class="nav-link ${active===id?'active':''}" href="#${id}" ${active===id?'aria-current="page"':''}>${icon(ic)}${t}</a>`).join('')}</nav><div class="sidebar-bottom"><div class="side-note"><b>A thought to keep</b>You can change your mind when you find a better reason.</div><button class="settings-link" data-action="settings">${icon('settings')}Settings & backups</button></div></aside><div class="content"><header class="topbar"><div class="mobile-brand">${owl()}Thinking Studio</div><div class="topbar-label"><b>Your curiosity belongs here.</b> Take one small step.</div><div class="topbar-right"><span class="tiny-pill">Foundations</span><span class="avatar" aria-label="Bella">B</span></div></header>${!storageOK?'<div class="storage-warning">Progress saving is unavailable in this browser. Use Settings to export a backup.</div>':''}<main id="main" tabindex="-1">${body}<footer class="footer"><span>Bella's Thinking Studio · Foundations · v1.0</span><span>Notice. Wonder. Try. Check.</span></footer></main></div></div><nav class="mobile-nav" aria-label="Mobile navigation">${[['home','home','Journey'],['practice','spark','Practice'],['tools','tools','Tools'],['notebook','book','Notebook']].map(([id,ic,t])=>`<a href="#${id}" class="${active===id?'active':''}">${icon(ic)}${t}</a>`).join('')}<button data-action="settings">${icon('settings')}Settings</button></nav>`;}
function renderHome(){const n=nextLesson(),c=completedCount();return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Welcome, curious thinker</div><h1>Big ideas start<br>with a little <em>why.</em></h1><p>Follow the clues. Explore possibilities.<br>Discover what your mind can do.</p><div class="actions"><a class="btn primary" href="#lesson/${n.id}">${state.lastLesson?'Continue adventure':'Start my adventure'}${icon('arrow')}</a><button class="btn ghost" data-action="browse">Explore the journey</button></div></div>${heroArt()}</section><section class="stat-row" aria-label="Your learning progress"><div class="stat"><div class="stat-icon">${icon('flag')}</div><div><strong>${c} <span style="display:inline;font-size:13px">/ 48</span></strong><span>lessons completed</span></div></div><div class="stat"><div class="stat-icon">${icon('pencil')}</div><div><strong>${questionCount()}</strong><span>questions explored</span></div></div><div class="stat"><div class="stat-icon">${icon('clock')}</div><div><strong>20–25 min</strong><span>a little learning adventure</span></div></div></section><div class="section-heading" id="journey"><div><h2>Your thinking journey</h2><p>12 worlds to explore. Four lessons in each.</p></div><span class="section-tag">Go at your own pace</span></div><div class="progress-bar" role="progressbar" aria-label="Completed lessons" aria-valuemin="0" aria-valuemax="48" aria-valuenow="${c}"><span style="width:${c/48*100}%"></span></div>${[0,1,2].map((g)=>`<div class="journey-subhead"><span>${['Notice & organise','Reasons & evidence','Build & explore'][g]}</span></div><div class="module-grid">${MODULES.slice(g*4,g*4+4).map(moduleCard).join('')}</div>`).join('')}<div class="learn-tip">${icon('bulb')}<span>Every world is open. Start at the beginning, or revisit a skill whenever you like.</span></div>`;}
function moduleCard(m){const ls=moduleLessons(m.id);if(!ls.length)return '';const done=ls.filter(l=>state.lessons[l.id]?.completed).length,first=ls.find(l=>!state.lessons[l.id]?.completed)||ls[0];return `<article class="module-card" style="--tint:${m.tint};--accent:${m.accent}"><div class="module-top"><div class="module-icon">${icon(m.icon)}</div><span class="module-no">WORLD ${String(m.id).padStart(2,'0')}</span></div><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div class="module-footer"><div class="mini-dots" role="img" aria-label="${done} of 4 lessons completed">${ls.map(l=>`<i class="${state.lessons[l.id]?.completed?'done':''}"></i>`).join('')}</div><a class="card-link" href="#lesson/${first.id}">${done===4?'Visit again':done?'Keep exploring':'Explore'}${icon('arrow')}</a></div></article>`;}
function visual(v){if(!v)return '';let content='';if(v.type==='table'){content=`<table><thead><tr>${v.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}else if(v.type==='grid'){content=`<table class="spatial-grid" aria-label="${esc(v.caption||'Position grid')}"><tbody>${v.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)||'·'}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}else if(v.type==='arrows'){const ar={up:'↑',right:'→',down:'↓',left:'←'};content=`<div class="arrow-list">${v.items.map(x=>`<span class="arrow-symbol" aria-label="${esc(x)}">${ar[x]||esc(x)}</span>`).join('')}</div>`;}else if(v.type==='tokens'){content=`<div class="tokens">${v.items.map(t=>{const c=/^#[0-9a-fA-F]{3,8}$/.test(t.color)?t.color:'#4c8b78';const sh={circle:'<circle cx="25" cy="25" r="20"/>',square:'<rect x="5" y="5" width="40" height="40" rx="5"/>',triangle:'<path d="m25 4 23 41H2Z"/>',star:'<path d="m25 2 7 15 16 2-12 12 3 17-14-8-14 8 3-17L2 19l16-2Z"/>'};return `<div class="token"><svg viewBox="0 0 50 50" aria-hidden="true" fill="${c}">${sh[t.shape]||sh.circle}</svg><span>${esc(t.label)}</span></div>`;}).join('')}</div>`;}else if(v.type==='blocks'){const cols=v.heights[0]?.length||2;content=`<div class="block-plan" style="grid-template-columns:repeat(${cols},1fr)">${v.heights.flat().map(h=>`<div class="block-cell ${h===0?'zero':''}">${esc(h)}<small>${h===1?'block':'blocks'}</small></div>`).join('')}</div>`;}return content?`<figure class="visual">${content}${v.caption?`<figcaption>${esc(v.caption)}</figcaption>`:''}</figure>`:'';}
function renderQuestion(q,label){const r=activeQR(q),sel=pending[q.id]??r.lastChoice,resolved=!!r.reviewed,showFeedback=r.lastChecked!==undefined&&(pending[q.id]===undefined||pending[q.id]===r.lastChecked)||r.seenSolution;
