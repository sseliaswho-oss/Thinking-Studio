 keeps counting only the biggest pile and promising too many bags. Bella checks every required item for each complete set. Today you will find the limiting resource, count leftovers and decide which extra supply would actually help.","tool":"One complete set at a time","steps":["List everything one complete set needs.","Check how many complete sets each supply can support.","Use the smallest supported number and verify all supplies."],"worked":{"stem":"Each gift bag needs exactly 1 sticker and 1 pencil. Bella has 6 stickers and 4 pencils. No other items are needed.","ask":"What is the greatest number of complete gift bags she can make?","explanation":["Stickers could supply 6 bags, while pencils could supply only 4.","Every complete bag needs both items.","Four is the maximum, leaving 2 stickers and no pencils."],"hints":["Make one pair for each bag.","Which supply stops you from making another complete pair?"],"think":"Why do the two leftover stickers not make another complete bag?","visual":{"type":"table","headers":["Supply","Available","Needed per bag"],"rows":[["Stickers","6","1"],["Pencils","4","1"]],"caption":"Complete gift bags need both items"},"id":"m08l04-w","kind":"worked","options":["4 bags.","6 bags.","10 bags.","2 bags."],"answer":0,"optionWhy":["Four pencils allow four complete sets; there are enough stickers for those four.","Six bags would need six pencils, but only four are available.","Adding supplies does not account for needing one of each per bag.","Two would be possible, but four complete bags can be made."]},"questions":[{"stem":"One paper flag needs 1 stick and 2 paper triangles. There are 5 sticks and 8 triangles.","ask":"Can the team make five complete flags?","explanation":["Five sticks could support five flags.","Eight triangles make four pairs.","The triangles limit the result to four complete flags."],"hints":["Check the recipe for one flag.","Group the triangles in twos before counting flags."],"think":"How many more triangles would make five flags possible?","visual":{"type":"table","headers":["Supply","Available","Needed per flag"],"rows":[["Sticks","5","1"],["Triangles","8","2"]],"caption":"A flag needs a stick and two triangles"},"id":"m08l04-q1","kind":"guided","options":["Yes; five sticks are enough by themselves.","No; the triangles allow only four flags.","No; there is only enough material for two flags.","Yes; eight triangles make eight flags."],"answer":1,"optionWhy":["Each flag also needs two triangles.","Five flags would need ten triangles, but only eight are available.","Eight triangles can supply four pairs, and four sticks are available.","This ignores the two-triangle requirement."]},{"stem":"Each snack pack needs 1 apple and 2 crackers. There are 3 apples and 8 crackers.","ask":"Which supply runs out first as complete packs are made?","explanation":["The apples support 3 complete packs.","The crackers support 4 pairs for 4 packs.","Apples therefore run out after 3 packs, with 2 crackers left."],"hints":["How many packs can each pile support?","Remember that a pack uses two crackers."],"think":"Name one extra item that would let you make one more pack.","visual":{"type":"table","headers":["Supply","Available","Needed per pack"],"rows":[["Apples","3","1"],["Crackers","8","2"]],"caption":"Pack both kinds of food"},"id":"m08l04-q2","kind":"practice","options":["Crackers.","Both at the same time.","Apples.","Neither supply is used."],"answer":2,"optionWhy":["The crackers can support four packs, more than the apples allow.","After three packs, two crackers remain.","Three packs use all three apples but only six of the eight crackers.","Making the packs uses the stated ingredients."]},{"stem":"Each paper puppet needs 1 body and 2 eye stickers. There are 3 bodies and 10 eye stickers. The team makes as many complete puppets as possible.","ask":"How many eye stickers remain?","explanation":["Three bodies limit the team to 3 puppets.","Those puppets need 2 plus 2 plus 2, or 6 eyes.","Ten eyes minus six used leaves 4."],"hints":["Find the maximum number of complete puppets first.","Then count two eyes for each completed puppet."],"think":"Check your answer by adding used eyes and remaining eyes.","visual":{"type":"table","headers":["Supply","Available","Needed per puppet"],"rows":[["Bodies","3","1"],["Eye stickers","10","2"]],"caption":"Make complete puppets before counting leftovers"},"id":"m08l04-q3","kind":"practice","options":["7 eye stickers.","0 eye stickers.","6 eye stickers.","4 eye stickers."],"answer":3,"optionWhy":["This subtracts one eye per puppet instead of two.","The bodies run out before all ten eyes can be used.","Six is the number used, not the number remaining.","Three puppets use six eyes, leaving ten minus six, which is four."]},{"stem":"Each sandwich needs 2 bread slices and 1 cheese slice. There are 8 bread slices and 6 cheese slices. Two extra cheese slices arrive, with no extra bread.","ask":"What is the greatest number of complete sandwiches that can now be made?","explanation":["The eight bread slices supply four sandwiches.","Cheese was already sufficient for at least four.","Extra cheese does not remove the bread limit, so the maximum remains four."],"hints":["Which resource limited the sandwiches before the delivery?","Did the delivery add that resource?"],"think":"What delivery would actually allow more sandwiches?","visual":{"type":"table","headers":["Supply","Available after delivery","Needed per sandwich"],"rows":[["Bread slices","8","2"],["Cheese slices","8","1"]],"caption":"Two extra cheese slices have arrived"},"id":"m08l04-q4","kind":"practice","options":["4 sandwiches.","6 sandwiches.","8 sandwiches.","2 sandwiches."],"answer":0,"optionWhy":["Eight bread slices still allow only four pairs, even with more cheese.","Six sandwiches would need twelve bread slices.","Eight sandwiches would need sixteen bread slices.","The bread and cheese support four, so two is not the maximum."]},{"stem":"Each actor kit needs 1 mask, 1 bell and 2 ribbons. The theatre has 5 masks, 3 bells and 8 ribbons. It wants four complete kits.","ask":"Which single delivery would make four kits possible?","explanation":["Four kits need 4 masks, 4 bells and 8 ribbons.","The stock has enough masks and ribbons but only 3 bells.","One extra bell fills the only shortage."],"hints":["Write the full requirement for four kits.","Compare each requirement with the supply; find the actual shortfall."],"think":"Why would the largest-looking delivery not necessarily help?","visual":{"type":"table","headers":["Supply","Available","Needed per kit"],"rows":[["Masks","5","1"],["Bells","3","1"],["Ribbons","8","2"]],"caption":"The target is four complete actor kits"},"id":"m08l04-q5","kind":"transfer","options":["1 extra mask.","1 extra bell.","1 extra ribbon.","2 extra ribbons."],"answer":1,"optionWhy":["The shortage of bells would remain.","Four bells would then match the four kits; masks and ribbons are already sufficient.","Extra ribbon does not supply the missing bell.","There would still be only three bells for four kits."]}],"activity":{"title":"A pretend packing station","instructions":"Use six paper squares as tickets and four counters as badges. Each pretend visitor pack needs one ticket and one badge. Make as many complete packs as possible. Record the number and leftovers. Add two more paper tickets and try again. Then add one counter. Explain which delivery changed the number of complete packs and why.","coach":"Initially four packs are possible. Extra tickets alone keep the maximum at four. One extra badge then permits five packs because there are enough tickets."},"reflection":"Which supply limited the complete sets, and how did you know?","transfer":"When planning a craft or snack, check every required item before promising how many you can make.","parent":{"aim":"Observe whether the child considers all required resources and identifies the bottleneck.","prompt":"What would stop us making the next complete set?","pitfall":"Counting only the largest pile, adding unlike supplies, or assuming every extra item increases output.","success":"The child finds the maximum, checks leftovers and selects a useful replenishment."}},{"id":"m09l01","module":9,"lesson":1,"title":"A little turn","goal":"I can follow a turn one quarter at a time.","story":"Pip the paper robot is helping to design a little theatre. Its direction arrow keeps turning as the stage moves. You can be the arrow checker. Keep the page still, follow each turn carefully, and show Pip where its arrow will point next.","tool":"Turn, pause, check","steps":["Name the direction before the turn.","Follow each quarter turn: up, right, down, left goes clockwise.","Check the number of turns and the final direction."],"worked":{"stem":"An arrow starts pointing up. The page stays still. The arrow makes one quarter turn clockwise, following the order up, right, down, left.","ask":"Which way does it point now?","options":["Down ↓","Left ←","Right →","Up ↑"],"answer":2,"hints":["Find the starting direction first.","Move just one place through the clockwise order."],"explanation":["The arrow begins at up.","One clockwise quarter turn moves from up to right.","It now points right; a quarter turn is only one step."],"optionWhy":["Down is two clockwise quarter turns after up.","Left is one quarter turn in the other direction.","Right is one clockwise step after up.","Up would mean no turn, or four quarter turns."],"think":"Trace one quarter turn with your finger.","visual":{"type":"arrows","items":["up"],"caption":"Starting direction: up"},"id":"m09l01-w","kind":"worked"},"questions":[{"stem":"A toy boat has a direction arrow pointing right. Without moving the page, turn the arrow one quarter turn clockwise. Clockwise follows up, right, down, left.","ask":"What is the new direction?","options":["Left ←","Up ↑","Right →","Down ↓"],"answer":3,"hints":["Start at right, not at up.","Take one step in the clockwise order."],"explanation":["The starting direction is right.","The next clockwise direction after right is down.","The arrow points down after one quarter turn."],"optionWhy":["Left needs two clockwise quarter turns from right.","Up is the other turning direction from right.","Right is the starting direction, before the turn.","Down follows right clockwise."],"think":"Show the starting and finishing directions.","visual":{"type":"arrows","items":["right"],"caption":"Starting direction: right"},"id":"m09l01-q1","kind":"guided"},{"stem":"An arrow starts pointing down. It makes one quarter turn anticlockwise. Anticlockwise follows up, left, down, right. Keep the page still.","ask":"Which way will the arrow point?","options":["Right →","Down ↓","Left ←","Up ↑"],"answer":0,"hints":["This turn goes anticlockwise.","In the given order, find the direction just after down."],"explanation":["The arrow starts at down.","Following the anticlockwise order, down is followed by right.","The new direction is right."],"optionWhy":["Right is one anticlockwise step from down.","Down means the arrow has not turned.","Left would be a clockwise turn from down.","Up needs two quarter turns from down."],"think":"How did the word anticlockwise change your move?","visual":{"type":"arrows","items":["down"],"caption":"Starting direction: down"},"id":"m09l01-q2","kind":"practice"},{"stem":"An arrow points left. It makes two quarter turns clockwise. Clockwise follows up, right, down, left, then up again.","ask":"Where does it finish?","options":["Left ←","Right →","Up ↑","Down ↓"],"answer":1,"hints":["Pause after the first turn.","From left, write down the next two directions."],"explanation":["The first clockwise turn takes left to up.","The second takes up to right.","Two quarter turns leave the arrow pointing right."],"optionWhy":["Left is the starting direction.","Right is the finish after left, up, right.","Up is only the first turn.","Down is three clockwise turns from left."],"think":"Say both moves, rather than only the final answer.","visual":{"type":"arrows","items":["left"],"caption":"Starting direction: left"},"id":"m09l01-q3","kind":"practice"},{"stem":"A windmill pointer starts facing up. It makes four quarter turns clockwise. The order is up, right, down, left, then up again.","ask":"What direction is it facing after all four turns?","options":["Down ↓","Left ←","Up ↑","Right →"],"answer":2,"hints":["Count each quarter turn, including the last one.","A full turn brings a pointer back to where it started."],"explanation":["The first three turns lead to right, down, then left.","The fourth turn goes from left to up.","Four quarter turns make a full turn, so the pointer faces up again."],"optionWhy":["Down is the direction after two turns.","Left is the direction after three turns.","Up is the direction after the fourth turn.","Right is the direction after just one turn."],"think":"Can you show all four turns without moving the page?","visual":{"type":"arrows","items":["up"],"caption":"Starting direction: up"},"id":"m09l01-q4","kind":"practice"},{"stem":"On a map of a play, a dragon puppet has an arrow pointing down. The director asks for three quarter turns clockwise. On this map, clockwise follows up, right, down, left.","ask":"Which way should the arrow point at the end?","options":["Left ←","Up ↑","Down ↓","Right →"],"answer":3,"hints":["The map stays still while the arrow turns.","Starting at down, count three moves around the directions."],"explanation":["The first turn takes down to left.","The second takes left to up, and the third takes up to right.","The puppet arrow finishes pointing right."],"optionWhy":["Left is reached after only the first turn.","Up is reached after only two turns.","Down is the starting direction, before any turns.","Right is reached after all three turns."],"think":"Explain how a theatre map uses the same turning tool.","visual":{"type":"arrows","items":["down"],"caption":"Puppet arrow before the turns"},"id":"m09l01-q5","kind":"transfer"}],"activity":{"title":"Make a paper pointer","instructions":"Cut or draw one large arrow on a small card. Place it pointing up on a table. Keep a second sheet fixed underneath it and label its four edges up, right, down and left. Take turns calling one or two clockwise quarter turns. Predict the finish before moving the arrow, then check by turning it.","coach":"Watch that the child turns the arrow while keeping the labelled sheet still. Count quarter turns aloud if needed."},"reflection":"What helped you keep track when there was more than one turn?","transfer":"Use a paper arrow to plan which way a character faces at two moments in a play.","parent":{"aim":"Observe whether the starting direction and turn direction are both used.","prompt":"Where does the arrow start, and how many moves are requested?","pitfall":"Starting every count at up, or mixing clockwise with anticlockwise.","success":"The child predicts, follows each quarter turn, and checks the final direction."}},{"id":"m09l02","module":9,"lesson":2,"title":"Across the mirror line","goal":"I can place a marker the same distance across a mirror line.","story":"The theatre needs two matching windows. One window is finished, and the other must be its mirror picture. A mirror keeps some positions and swaps others. Today you will move markers across a clearly described mirror line, keeping track of their rows and columns.","tool":"Same distance, other side","steps":["Find the mirror line and the marker.","Move the marker the same distance to the other side.","Check what stayed the same: row or column."],"worked":{"stem":"A three-by-three grid has a star in the top-left square. A vertical mirror line runs down the middle column. Copy only the star position across that line.","ask":"Where should the copied star go?","options":["Bottom-left square","Top-middle square","Bottom-right square","Top-right square"],"answer":3,"hints":["A vertical mirror swaps left and right.","Keep the star in the same row."],"explanation":["The star is in the top row, one column left of the mirror line.","Its copy must be one column right of the line, still in the top row.","The copied star belongs in the top-right square."],"optionWhy":["Bottom-left changes the row but does not cross the line.","Top-middle is on the line, not the same distance across it.","Bottom-right crosses the line but also changes the row.","Top-right is equally far across the vertical line."],"think":"Point to the row that stays unchanged.","visual":{"type":"grid","rows":[["Star","",""],["","",""],["","",""]],"caption":"Vertical mirror line through the middle column"},"id":"m09l02-w","kind":"worked"},"questions":[{"stem":"A three-by-three grid has a dot in the middle-left square. A vertical mirror line runs through the middle column. Reflect the dot position across the line.","ask":"Where does the dot move?","options":["Middle-right square","Top-left square","Middle-middle square","Bottom-right square"],"answer":0,"hints":["Keep the dot in its original row.","Swap the left column for the equally distant right column."],"explanation":["The dot starts in the middle row and left column.","The vertical reflection changes left to right, keeping the row.","Its new position is middle-right."],"optionWhy":["Middle-right keeps the row and crosses the line equally.","Top-left changes the row and stays on the same side.","Middle-middle lies on the line rather than across it.","Bottom-right changes the row unnecessarily."],"think":"Which part of the position changed?","visual":{"type":"grid","rows":[["","",""],["Dot","",""],["","",""]],"caption":"Reflect across the middle column"},"id":"m09l02-q1","kind":"guided"},{"stem":"A three-by-three grid has a coin in the bottom-middle square. A vertical mirror line passes through the middle column, including the coin position.","ask":"Where is the reflected coin position?","options":["Top-middle square","Bottom-middle square","Bottom-left square","Bottom-right square"],"answer":1,"hints":["Is the coin on the mirror line or away from it?","A position on the mirror line is zero distance from it."],"explanation":["The coin is on the vertical mirror line.","A point on the line stays on the line in the same place.","The reflected position is still bottom-middle."],"optionWhy":["Top-middle changes the row even though the line is vertical.","Bottom-middle stays fixed because it is on the line.","Bottom-left moves the coin away from the line.","Bottom-right also moves it away from the line."],"think":"Explain why this marker does not change squares.","visual":{"type":"grid","rows":[["","",""],["","",""],["","Coin",""]],"caption":"The mirror line passes through the middle column"},"id":"m09l02-q2","kind":"practice"},{"stem":"A three-by-three grid has a leaf in the top-middle square. This time a horizontal mirror line runs across the middle row. Reflect the leaf position.","ask":"Where will the leaf appear?","options":["Middle-middle square","Bottom-left square","Bottom-middle square","Top-right square"],"answer":2,"hints":["This mirror line is horizontal.","Keep the column and swap top with bottom."],"explanation":["The leaf is one row above the horizontal line.","Its reflection goes one row below the line in the same column.","The leaf appears in the bottom-middle square."],"optionWhy":["Middle-middle is on the line rather than equally far below it.","Bottom-left crosses the line but changes the column.","Bottom-middle is the matching position below the line.","Top-right changes the column and does not cross the line."],"think":"How did a horizontal line change your checking method?","visual":{"type":"grid","rows":[["","Leaf",""],["","",""],["","",""]],"caption":"Horizontal mirror line through the middle row"},"id":"m09l02-q3","kind":"practice"},{"stem":"A three-by-three grid has one red marker at top-left and one blue marker at bottom-left. A vertical mirror line runs down the middle column. Reflect both positions; keep each marker colour.","ask":"Which pair gives the reflected positions?","options":["Red bottom-right; blue top-right","Red top-middle; blue bottom-middle","Red top-left; blue bottom-left","Red top-right; blue bottom-right"],"answer":3,"hints":["Reflect one marker, then the other.","Each marker stays in its own row."],"explanation":["The top-left red marker reflects to top-right.","The bottom-left blue marker reflects to bottom-right.","Both move to the right column while their rows stay unchanged."],"optionWhy":["This swaps the rows of the two coloured markers.","These positions are on the line, not across it.","These are the original positions before reflection.","Both positions are correct and the colours stay in their rows."],"think":"Check the two markers separately.","visual":{"type":"grid","rows":[["Red","",""],["","",""],["Blue","",""]],"caption":"Vertical mirror line through the middle column"},"id":"m09l02-q4","kind":"practice"},{"stem":"A garden plan has two rows and three columns. A flower is at top-left and a pond is at bottom-middle. Reflect the plan across a vertical line through its middle column. Reflect positions only.","ask":"Which description matches the reflected garden?","options":["Flower top-right; pond bottom-middle","Flower top-right; pond bottom-right","Flower bottom-left; pond top-middle","Flower top-middle; pond bottom-left"],"answer":0,"hints":["One object is on the mirror line.","Reflect the flower and pond separately."],"explanation":["The flower moves from the left column to the right column, keeping its top row.","The pond is on the line, so its bottom-middle position stays the same.","The reflected garden has a top-right flower and bottom-middle pond."],"optionWhy":["The flower crosses the line and the pond stays on it.","The pond should not move away from the mirror line.","This swaps rows instead of reflecting left to right.","Neither object is the same distance across the given line."],"think":"Which object stayed in place, and why?","visual":{"type":"grid","rows":[["Flower","",""],["","Pond",""]],"caption":"Garden plan; mirror line down the middle column"},"id":"m09l02-q5","kind":"transfer"}],"activity":{"title":"Build a mirror pair","instructions":"Draw a grid with three rows and three columns. Draw a vertical line through the middle column. Place three small counters in any squares. On a second matching grid, place each counter in its reflected square. Keep the colours matched. Check one counter at a time, then repeat with a horizontal line through the middle row.","coach":"For the vertical line, left and right swap but rows stay fixed. For the horizontal line, top and bottom swap but columns stay fixed."},"reflection":"Which positions stayed fixed when they were on the mirror line?","transfer":"Design two mirrored stage windows using three coloured marks on each window.","parent":{"aim":"Look for equal distance across the stated line, not just a similar-looking arrangement.","prompt":"Which row or column should stay unchanged?","pitfall":"Turning the whole picture instead of reflecting it.","success":"The child keeps markers on the line fixed and reflects other positions correctly."}},{"id":"m09l03","module":9,"lesson":3,"title":"Pieces make a whole","goal":"I can match pieces to a whole without gaps or overlaps.","story":"The tiny theatre floor is made of square tiles. Some tiles are missing, and a few spare pieces are waiting beside the stage. Your job is to check which spaces each piece covers. Count the spaces, but also notice where they are: the pieces must fit together.","tool":"Cover, count, check","steps":["Name the whole shape or space to make.","Check which spaces are covered and which are empty.","Fit the pieces with no gaps or overlaps."],"worked":{"stem":"A two-by-two square needs four equal square tiles. Tiles already cover the top-left, top-right and bottom-left spaces. The bottom-right space is empty.","ask":"Where must one more tile go to finish the square?","options":["Bottom-right","Top-left","Top-right","Bottom-left"],"answer":0,"hints":["Find the only empty space.","A finished square has one tile in each of its four spaces."],"explanation":["Three of the four spaces already have a tile.","Only the bottom-right space is empty.","Placing a tile there finishes the square with no overlap."],"optionWhy":["Bottom-right is the one uncovered space.","Top-left already contains a tile.","Top-right already contains a tile.","Bottom-left already contains a tile."],"think":"Why would placing a tile on a filled space not finish the job?","visual":{"type":"grid","rows":[["Tile","Tile"],["Tile",""]],"caption":"Four-space floor; blank means empty"},"id":"m09l03-w","kind":"worked"},"questions":[{"stem":"A floor has two rows and three columns. All three top spaces contain tiles. Only the bottom-left space contains a tile in the bottom row. You want to cover every space with no overlap.","ask":"Which two spaces still need tiles?","options":["Top-left and bottom-right","Bottom-middle and bottom-right","Top-middle and top-right","Bottom-left and bottom-middle"],"answer":1,"hints":["Check one row at a time.","The top row is already full."],"explanation":["All top-row spaces are covered.","In the bottom row, left is covered but middle and right are empty.","The two new tiles belong in bottom-middle and bottom-right."],"optionWhy":["Top-left is covered, and bottom-middle would remain empty.","These are exactly the two empty spaces.","Both top spaces already have tiles.","Bottom-left is already covered, and bottom-right would remain empty."],"think":"Point to each empty square before choosing.","visual":{"type":"grid","rows":[["Tile","Tile","Tile"],["Tile","",""]],"caption":"Two rows, three columns"},"id":"m09l03-q1","kind":"guided"},{"stem":"A rectangle is made from six equal square tiles: three in the top row and three in the bottom row. You want two identical rectangles, using all six tiles once.","ask":"Which split will work?","options":["Split off the left column only","Use one tile in each piece and leave four aside","Split between the top and bottom rows","Take one corner tile as one piece"],"answer":2,"hints":["Each piece must use the same number of tiles.","Six tiles shared equally makes three tiles in each piece."],"explanation":["The top row has three tiles in a straight line.","The bottom row has the same three-tile shape.","Separating the rows makes two identical rectangles using every tile."],"optionWhy":["The left column has two tiles, leaving four; the pieces differ.","This does not use all six tiles.","Each resulting rectangle has one row of three tiles.","This gives pieces of one tile and five tiles, which are not identical."],"think":"Show why each chosen piece has the same shape and size.","visual":{"type":"grid","rows":[["Tile","Tile","Tile"],["Tile","Tile","Tile"]],"caption":"Six tiles making one rectangle"},"id":"m09l03-q2","kind":"practice"},{"stem":"Three tiles fill a two-by-two space at top-left, bottom-left and bottom-right. You may add one equal square tile. No tile may overlap another.","ask":"Which added tile makes a full two-by-two square?","options":["A tile below bottom-left","A tile above top-left","A tile on top of bottom-right","A tile at top-right"],"answer":3,"hints":["Look inside the square you want to finish.","Adding outside it will not fill its missing space."],"explanation":["The target square has four spaces.","The three tiles cover every target space except top-right.","A tile at top-right completes the square."],"optionWhy":["It extends the shape but leaves top-right empty.","It also extends the shape without filling top-right.","It overlaps an existing tile and leaves a gap.","It fills the missing target space."],"think":"Why is counting four tiles not enough by itself?","visual":{"type":"grid","rows":[["Tile",""],["Tile","Tile"]],"caption":"An L-shaped group of three tiles"},"id":"m09l03-q3","kind":"practice"},{"stem":"A puzzle board has two rows and three columns. The top row is full. The bottom-left space is also full. A straight two-square piece may be turned and placed in empty spaces, with no overlap.","ask":"How should the two-square piece be placed?","options":["Across bottom-middle and bottom-right","Down top-middle and bottom-middle","Across top-left and top-middle","Down top-right and bottom-right"],"answer":0,"hints":["Locate both empty spaces.","The new piece must cover two empty spaces together."],"explanation":["The only empty spaces are bottom-middle and bottom-right.","They sit next to one another in the same row.","The two-square piece fits horizontally across those two spaces."],"optionWhy":["Both squares of the piece cover empty spaces.","The top-middle part would overlap an existing tile.","Both parts would overlap existing tiles.","The top-right part would overlap an existing tile."],"think":"Explain how you checked both parts of the piece.","visual":{"type":"grid","rows":[["Full","Full","Full"],["Full","",""]],"caption":"Empty spaces for one two-square piece"},"id":"m09l03-q4","kind":"practice"},{"stem":"A puppet blanket must be a rectangle with two rows of three equal fabric squares. The first row of three squares is sewn. No second-row squares have been added yet.","ask":"What should the maker add?","options":["Two squares on top of existing squares","Three squares in a second row directly below the first","One square below the middle only","Three squares at the end of the first row"],"answer":1,"hints":["Keep the required number of rows and columns in mind.","A second complete row must be just as long as the first."],"explanation":["The blanket needs two rows, with three squares in each.","One complete row exists, so one complete row of three is missing.","Add three squares directly below the first row."],"optionWhy":["Overlapping squares does not fill the missing row.","This makes exactly two complete rows of three.","Two spaces in the second row would remain empty.","This makes one long row of six instead of two rows of three."],"think":"How does the floor-tile tool help with a fabric blanket?","visual":{"type":"grid","rows":[["Fabric","Fabric","Fabric"],["","",""]],"caption":"Blanket plan; blank spaces still need fabric"},"id":"m09l03-q5","kind":"transfer"}],"activity":{"title":"Tile designer","instructions":"Draw a rectangle of two rows and three equal squares. Cut six matching paper squares. Cover four spaces and ask a partner to name the two missing spaces before filling them. Next, use all six squares to make two identical rectangles. Check that every square is used once and that no squares overlap.","coach":"Listen for both the number and position of missing squares. Two one-by-three rectangles provide one valid equal split."},"reflection":"When did the positions of the pieces matter as much as the number of pieces?","transfer":"Draw a small quilt or stage floor and give someone precise instructions for filling its gaps.","parent":{"aim":"Check that the whole target shape is considered.","prompt":"Which spaces are still uncovered?","pitfall":"Counting enough pieces while ignoring gaps, overlaps or the target outline.","success":"The child locates gaps and checks each piece against the full target."}},{"id":"m09l04","module":9,"lesson":4,"title":"Looking from a new place","goal":"I can tell what a view shows and what it leaves hidden.","story":"The builders have made a tiny town from cubes. From above, you can see where the stacks stand. From the front, a taller stack may hide a shorter one behind it. Walk around the model in your imagination and be careful about what each view actually tells you.","tool":"Choose the viewpoint","steps":["Find out whether you are looking from above or from the front.","Use stack positions and heights to work out what is visible.","Do not claim hidden information that the view does not show."],"worked":{"stem":"A model uses a two-by-two plan. The back row has stack heights 2 and 0, from left to right. The front row has heights 1 and 3. A zero means no cubes. Look straight down from above.","ask":"How many positions have a visible top square?","options":["Two positions","Three positions","Six positions","Four positions"],"answer":1,"hints":["From above, count occupied positions, not all the cubes.","A stack has one top square even when it is several cubes tall."],"explanation":["Three positions have stacks: back-left, front-left and front-right.","Back-right has height zero, so it is empty.","The top view has three occupied positions, even though there are six cubes."],"optionWhy":["There are two rows, but three occupied positions.","There are three non-empty stack positions.","Six is the total number of cubes, not the number of occupied positions.","One of the four positions is empty."],"think":"Explain why a tall stack still has only one top position.","visual":{"type":"blocks","heights":[[2,0],[1,3]],"caption":"Back row first; front row second. Numbers are stack heights."},"id":"m09l04-w","kind":"worked"},"questions":[{"stem":"Three cube stacks stand side by side in one row. Their heights from left to right are 1, 2 and 1 cubes. No stack is behind another.","ask":"How many cubes were used altogether?","options":["Two cubes","Five cubes","Four cubes","Three cubes"],"answer":2,"hints":["This question asks for all cubes, not just occupied positions.","Add the heights of the three stacks."],"explanation":["The left and right stacks each contain one cube.","The middle stack contains two cubes.","One plus two plus one is four cubes altogether."],"optionWhy":["Two is only the tallest stack height.","The listed heights contain only four cubes.","The stack heights add to four.","Three counts the stack positions but misses the extra middle cube."],"think":"How is counting cubes different from counting stack positions?","visual":{"type":"blocks","heights":[[1,2,1]],"caption":"One row of stacks: heights 1, 2, 1"},"id":"m09l04-q1","kind":"guided"},{"stem":"Two cube stacks are in the same straight line, one behind the other. The front stack is 1 cube tall and the back stack is 3 cubes tall. Look straight from the front at the outline of both stacks together.","ask":"How many cube levels high is the outline?","options":["Four levels","One level","Two levels","Three levels"],"answer":3,"hints":["The back stack extends above the front one.","The stacks stand behind each other; they are not piled on top of each other."],"explanation":["The back stack reaches three levels high.","The one-level front stack does not add height above that stack.","The combined front outline reaches three levels."],"optionWhy":["Four adds the cube counts as if the stacks were on top of each other.","The taller back stack is visible above the front stack.","The back stack still reaches a third level.","The tallest visible outline reaches the back stack height of three."],"think":"Use cubes or your fingers to show the part visible above the front stack.","visual":{"type":"blocks","heights":[[3],[1]],"caption":"Back stack height 3; front stack height 1"},"id":"m09l04-q2","kind":"practice"},{"stem":"Model One has two side-by-side stacks with heights 1 and 1. Model Two has stacks in those same two positions, with heights 3 and 2. Look straight down and ignore the colours and heights.","ask":"What is the same in the two top views?","options":["The two occupied positions","The total number of cubes","Every stack height","The front-view outline height at each position"],"answer":0,"hints":["The question asks about occupied positions seen from above.","Different stack heights can share the same footprint."],"explanation":["Both models have a stack in the left position and in the right position.","Looking straight down shows those same two occupied positions.","Their footprints match, although their cube counts and heights differ."],"optionWhy":["Both top views occupy the same left and right positions.","One model has two cubes; the other has five.","The first heights are 1 and 1, while the second are 3 and 2.","The front outline heights differ between the models."],"think":"Describe one thing a top view alone might not tell you.","visual":{"type":"table","headers":["Model","Left height","Right height"],"rows":[["One","1","1"],["Two","3","2"]],"caption":"Two models using the same side-by-side positions"},"id":"m09l04-q3","kind":"practice"},{"stem":"A plan seen directly from above shows a cube stack in each of four spaces: top-left, top-right, bottom-left and bottom-right. It shows only which spaces are occupied. No heights are given.","ask":"Can you tell the exact height of every stack?","options":["No; the plan proves there are no cubes","No; several different heights could make this footprint","Yes; every stack must be one cube tall","Yes; every stack must be four cubes tall"],"answer":1,"hints":["Which information does this plan actually supply?","Imagine raising one stack without moving its position."],"explanation":["The plan tells us that all four positions are occupied.","A stack could become taller without changing its occupied position in the top view.","The exact heights cannot be determined from this footprint alone."],"optionWhy":["Occupied positions show that cubes are present.","The same occupied squares can come from different stack heights.","One cube per stack is possible, but taller stacks are also possible.","Four occupied positions do not mean four cubes in every stack."],"think":"Give two different possible heights for one of the stacks.","visual":{"type":"grid","rows":[["Stack","Stack"],["Stack","Stack"]],"caption":"Top view only; heights are not supplied"},"id":"m09l04-q4","kind":"practice"},{"stem":"A toy stage has two rows of cube stacks. The back row is 1 cube high on the left and 3 on the right. The front row is 2 high on the left and 1 on the right. Look straight from the front at cube level, not down from above. Each back stack is exactly lined up behind its front stack.","ask":"Which back stack is completely hidden?","options":["Both back stacks","Neither back stack","The back-left stack only","The back-right stack only"],"answer":2,"hints":["Compare front and back heights within each column.","A shorter back stack can be hidden by a taller front stack."],"explanation":["On the left, the front height of two hides the back height of one.","On the right, the back height of three sticks up above the front height of one.","Only the back-left stack is completely hidden."],"optionWhy":["The back-right stack is not completely hidden.","The front-left stack does hide the back-left stack.","The back-left stack is shorter than the stack directly in front of it.","The back-right stack rises above its front stack and remains partly visible."],"think":"Explain what you can see on each side of the stage.","visual":{"type":"blocks","heights":[[1,3],[2,1]],"caption":"Back row first; front row second. Viewer stands in front."},"id":"m09l04-q5","kind":"transfer"}],"activity":{"title":"Build and look","instructions":"Use six small blocks. Make a two-by-two plan with stack heights 2 and 0 in the back row, and 1 and 3 in the front row. Look straight down and draw occupied squares. Then look from the front. Move a block from a tall stack to another occupied stack and check whether the top footprint changes.","coach":"The initial top view has three occupied squares. Moving a block between already occupied stacks can preserve that footprint while changing heights."},"reflection":"What could you tell from above, and what did you need another view to discover?","transfer":"Look at a toy arrangement from two sides and describe one thing hidden from each side.","parent":{"aim":"Separate the number of occupied positions from total cubes and visible outline heights.","prompt":"What does this viewpoint show, and what might it hide?","pitfall":"Assuming a top square means exactly one cube underneath.","success":"The child changes viewpoints and recognises when stack heights remain unknown."}},{"id":"m10l01","module":10,"lesson":1,"title":"Every pair has a place","goal":"I can make all the choices when I need one item from each group.","story":"The puppet costume cupboard has a few hats and ribbons. A costume uses one hat and one ribbon. Choosing them in a clear order will help the costume team see every possibility. Today you will make pairs, check what makes two choices different, and keep every rule in view.","tool":"One from each group","steps":["Name the groups and how many items to choose from each.","Pair each choice in the first group with every allowed choice in the second.","Check that each pair is different and follows the rules."],"worked":{"stem":"A costume uses one hat and one ribbon. Hats come in red or blue. Ribbons come with dots or stripes. Every hat can be paired with either ribbon.","ask":"How many different hat-and-ribbon pairs can you make?","options":["Two pairs","Three pairs","Six pairs","Four pairs"],"answer":3,"hints":["Try both ribbons with the red hat first.","Then try both ribbons with the blue hat."],"explanation":["The red hat can go with dots or stripes: two pairs.","The blue hat can also go with dots or stripes: two more pairs.","There are four different pairs altogether."],"optionWhy":["Two counts only the choices in one group.","Three leaves out one of the four allowed pairs.","There are only two ribbons for each of the two hats.","The pairs are red-dots, red-stripes, blue-dots and blue-stripes."],"think":"List the pairs so someone else can check them.","visual":{"type":"table","headers":["Group","Choices"],"rows":[["Hat","Red, blue"],["Ribbon","Dots, stripes"]],"caption":"Choose one item from each group"},"id":"m10l01-w","kind":"worked"},"questions":[{"stem":"A badge has one colour and one shape. The colours are red, blue and green. The shapes are circle and square. Every colour can be used with either shape.","ask":"How many different badges are possible?","options":["Six badges","Five badges","Three badges","Nine badges"],"answer":0,"hints":["Give each colour its own little row.","Each of the three colours has two shape choices."],"explanation":["Red makes a circle badge and a square badge.","Blue and green each make two badges as well.","Two plus two plus two gives six different badges."],"optionWhy":["There are two shapes for each of three colours.","Adding three colours to two shapes does not count their pairs.","Three counts colours but ignores the two shape choices.","There are two shapes, not three, for each colour."],"think":"Name both badges for just one colour.","visual":{"type":"table","headers":["Group","Choices"],"rows":[["Colour","Red, blue, green"],["Shape","Circle, square"]],"caption":"Badge choices"},"id":"m10l01-q1","kind":"guided"},{"stem":"A dress-up rule says: choose exactly one hat and exactly one ribbon. The hats are red and blue. The ribbons are dotted and striped. You may choose any hat with any ribbon.","ask":"Which choice follows the rule?","options":["A blue hat with no ribbon","A red hat and a striped ribbon","A red hat and a blue hat","A dotted ribbon and a striped ribbon"],"answer":1,"hints":["Check how many items come from each group.","You need one hat and one ribbon, rather than any two items."],"explanation":["The red hat belongs to the hat group.","The striped ribbon belongs to the ribbon group.","Together they give exactly one item from each required group."],"optionWhy":["This is missing the required ribbon.","This has one hat and one ribbon.","This has two hats and no ribbon.","This has two ribbons and no hat."],"think":"Explain why choosing two items is not enough unless the groups are right.","visual":{"type":"table","headers":["Hats","Ribbons"],"rows":[["Red","Dotted"],["Blue","Striped"]],"caption":"The groups have different jobs"},"id":"m10l01-q2","kind":"practice"},{"stem":"A tiny robot code has two positions: first and second. Each position may contain A or B. Repeats are allowed, and AB is a different code from BA.","ask":"Which list shows every possible code exactly once?","options":["AA, AB, BA, BB, AC","AB, BA","AA, AB, BA, BB","AA, AB, BB"],"answer":2,"hints":["Keep A in the first position and try both second letters.","Then keep B first and try both second letters."],"explanation":["With A first, the codes are AA and AB.","With B first, the codes are BA and BB.","The complete list is AA, AB, BA, BB."],"optionWhy":["AC is not allowed because C is not one of the choices.","This misses AA and BB; repeats are allowed.","This includes both second-letter choices for each first letter.","This misses BA, which is allowed and different from AB."],"think":"Why do AB and BA count as different codes?","visual":{"type":"table","headers":["Position","Allowed letters"],"rows":[["First","A or B"],["Second","A or B"]],"caption":"Two-position codes; repeats are allowed"},"id":"m10l01-q3","kind":"practice"},{"stem":"A model has a left flag and a right flag. Each flag may be red or blue. Red on the left and blue on the right is one arrangement. Swapping the colours changes which flag is on each side.","ask":"How should the swapped arrangement be counted?","options":["As the same arrangement because the colours match","As impossible because both flags must be red","As impossible because colours cannot be swapped","As a different arrangement"],"answer":3,"hints":["The positions are part of the arrangement.","Compare the colour at the left position before and after the swap."],"explanation":["The first arrangement has red left and blue right.","The swapped arrangement has blue left and red right.","Their positions differ, so these are two different arrangements."],"optionWhy":["Using the same colours does not make their labelled positions identical.","The rules allow either colour in each position.","The rules allow the swapped colours too.","The colour in each labelled position changes."],"think":"Draw both arrangements and label left and right.","visual":{"type":"grid","rows":[["Red: left","Blue: right"]],"caption":"The original flag arrangement"},"id":"m10l01-q4","kind":"practice"},{"stem":"Bella, Mia and Leo can take two jobs in a play: first speaker and second speaker. Choose two different children. A child cannot take both jobs, and swapping their jobs makes a different plan.","ask":"How many different speaking plans are possible?","options":["Six plans","Three plans","Two plans","Nine plans"],"answer":0,"hints":["Choose the first speaker, then list who could speak second.","Each first speaker leaves two different children for the second job."],"explanation":["If Bella is first, Mia or Leo can be second: two plans.","Mia first gives two plans, and Leo first gives two more.","Two plus two plus two makes six plans."],"optionWhy":["Each of the three first speakers has two allowed second speakers.","Three counts the possible first speakers but misses their second-speaker choices.","Two is the number of choices after fixing just one first speaker.","Nine would include three forbidden plans where one child speaks twice."],"think":"List the two plans that start with Bella.","visual":{"type":"table","headers":["Children available","Jobs"],"rows":[["Bella, Mia, Leo","First speaker; second speaker"]],"caption":"Choose two different children"},"id":"m10l01-q5","kind":"transfer"}],"activity":{"title":"Costume pair cards","instructions":"Draw two hat cards, one red and one blue, and three ribbon cards: dots, stripes and stars. A costume needs one hat and one ribbon. Make a written or drawn list of every possible costume. For each hat, check every ribbon before moving to the next hat. Give the list to a partner to check.","coach":"There should be six pairs. Look for two organised groups of three, with no duplicates and no missing ribbon choice."},"reflection":"How did naming the groups help you decide what counts as a different choice?","transfer":"Plan every possible pairing of two familiar story characters with two different stage jobs.","parent":{"aim":"Check that one choice from each category is used and labelled roles are respected.","prompt":"What choices are still available after you choose the first item?","pitfall":"Adding the numbers of choices instead of listing the allowed pairs.","success":"The child lists every allowed pair and distinguishes different labelled positions."}},{"id":"m10l02","module":10,"lesson":2,"title":"Keep one choice still","goal":"I can keep one choice fixed while I check the other choices.","story":"The badge workshop is busy. If everyone changes colours and shapes at the same time, some badges get forgotten. Try a calmer plan: finish all the badges for one colour, then move to the next. This small organising trick can help with meals, costumes and even stage jobs.","tool":"Finish one row","steps":["Choose one item to keep fixed.","Try every allowed partner for that item.","Move to the next fixed item and repeat, checking any special rules."],"worked":{"stem":"Flags can be red or blue, with a circle, triangle or star. Pip lists all red flags before listing blue flags. Pip has written red-circle and red-triangle.","ask":"Which flag completes the red group?","options":["Red-star","Blue-circle","Blue-triangle","Blue-star"],"answer":0,"hints":["Keep the colour red while finishing this group.","Which shape has not yet been used with red?"],"explanation":["The red group must use circle, triangle and star.","Circle and triangle are already listed with red.","Red-star completes that group before Pip moves on to blue."],"optionWhy":["Star is the remaining shape for the fixed red colour.","This starts the blue group before the red group is finished.","This also changes colour too soon.","Blue-star is allowed later, but it does not complete the red group."],"think":"What stays fixed while you finish this group?","visual":{"type":"table","headers":["Colour","Shapes already listed"],"rows":[["Red","Circle, triangle"],["Blue","None yet"]],"caption":"Possible shapes: circle, triangle, star"},"id":"m10l02-w","kind":"worked"},"questions":[{"stem":"Pins can be green or purple, with a dot or star. All four colour-and-shape pairs are allowed. Mina has listed green-dot and green-star.","ask":"Which two pins should she add to finish the whole list?","options":["Purple-dot and purple-dot","Purple-dot and purple-star","Green-dot and purple-star","Green-star and green-dot"],"answer":1,"hints":["The green group is complete.","Give purple the same two allowed shape choices."],"explanation":["The green dot and green star are already listed.","The remaining fixed colour is purple.","Purple-dot and purple-star are the two missing pins."],"optionWhy":["This repeats purple-dot and leaves purple-star missing.","This adds both missing purple shapes once.","This repeats green-dot and leaves purple-dot missing.","This only repeats the completed green group."],"think":"How can you tell a group is complete?","visual":{"type":"table","headers":["Colour","Allowed shapes"],"rows":[["Green","Dot, star"],["Purple","Dot, star"]],"caption":"All pairs are allowed"},"id":"m10l02-q1","kind":"guided"},{"stem":"A sandwich can use white or brown bread. The filling can be cheese, carrot or egg. Every filling can go with either bread. Keep the bread choice fixed as brown.","ask":"How many different brown-bread sandwiches can you list?","options":["Two sandwiches","One sandwich","Three sandwiches","Six sandwiches"],"answer":2,"hints":["Only one bread type is being considered in this group.","List each filling with brown bread."],"explanation":["Brown bread can have cheese, carrot or egg.","These are three different fillings for the fixed bread choice.","There are three brown-bread sandwiches."],"optionWhy":["Two counts bread types, but the bread is already fixed.","Fixing the bread still leaves three filling choices.","Each of the three fillings gives one brown-bread sandwich.","Six counts sandwiches from both bread groups."],"think":"Name the three sandwiches without changing the bread.","visual":{"type":"table","headers":["Fixed choice","Choices still free"],"rows":[["Brown bread","Cheese, carrot, egg"]],"caption":"Finish the brown-bread group"},"id":"m10l02-q2","kind":"practice"},{"stem":"A puppet costume has a hat, scarf and shoes. Hats can be red or blue. Scarves can be plain or striped. Shoes can be black or white. All combinations are allowed. Keep the hat blue.","ask":"How many costumes are possible with that blue hat?","options":["Eight costumes","Two costumes","Six costumes","Four costumes"],"answer":3,"hints":["The hat is fixed, but two other choices remain.","Try both shoe colours with the plain scarf, then both with the striped scarf."],"explanation":["With a blue hat and plain scarf, black or white shoes give two costumes.","With a blue hat and striped scarf, the two shoe choices give two more.","There are four costumes with the hat fixed as blue."],"optionWhy":["Eight would count both hat colours; the hat is fixed here.","Two counts only one of the remaining choices.","The available scarf-and-shoe pairs total four, not six.","Two scarf choices each have two shoe choices."],"think":"Which choice did you deliberately leave unchanged?","visual":{"type":"table","headers":["Part","Choices"],"rows":[["Hat","Blue only"],["Scarf","Plain or striped"],["Shoes","Black or white"]],"caption":"Hat fixed as blue"},"id":"m10l02-q3","kind":"practice"},{"stem":"Badges can be red, blue or green, and either a circle or star. Every pair is allowed except green-star. List the red group, then blue, then green.","ask":"How many allowed badges will the complete list contain?","options":["Five badges","Six badges","Four badges","Three badges"],"answer":0,"hints":["Check the special rule when you reach the green group.","Red has two, blue has two, but how many does green have?"],"explanation":["Red-circle and red-star are allowed, as are blue-circle and blue-star.","Only green-circle is allowed in the green group.","Two plus two plus one gives five allowed badges."],"optionWhy":["This counts the two red, two blue and one green badge.","Six would wrongly include forbidden green-star.","Four leaves out the allowed green-circle.","Three would allow only one shape per colour."],"think":"Why should the rows not all have the same length this time?","visual":{"type":"table","headers":["Colour","Allowed shapes"],"rows":[["Red","Circle, star"],["Blue","Circle, star"],["Green","Circle only"]],"caption":"The green-star badge is not allowed"},"id":"m10l02-q4","kind":"practice"},{"stem":"Four children can take two stage jobs: narrator and bell ringer. They are Bella, Mia, Leo and Zoe. No child can have both jobs. Keep Bella fixed as the narrator.","ask":"Which list gives all the allowed bell ringers for this group?","options":["Bella only","Mia, Leo and Zoe","Bella, Mia, Leo and Zoe","Mia and Leo only"],"answer":1,"hints":["Bella already has one job.","Check each remaining child against the rule."],"explanation":["Bella is fixed as narrator and cannot have both jobs.","Mia, Leo and Zoe are each available for bell ringer.","Those three names complete the group with Bella as narrator."],"optionWhy":["Bella is the only child forbidden from this second job.","These are all three children who do not already have the narrator job.","Bella must be removed because one child cannot take both jobs.","Zoe is also allowed, so this list is incomplete."],"think":"How does finishing one row help with planning stage jobs?","visual":{"type":"table","headers":["Fixed narrator","Children available"],"rows":[["Bella","Bella, Mia, Leo, Zoe"]],"caption":"A child may take only one job"},"id":"m10l02-q5","kind":"transfer"}],"activity":{"title":"Finish the row game","instructions":"Write three colours on separate cards and draw two shapes on two more cards. Make a table with one row per colour. For each row, draw both possible colour-and-shape pairs. Then choose one pair to forbid and cross out only that pair. Ask a partner to count the allowed pairs without missing a row.","coach":"The unrestricted table has six pairs. Forbidding exactly one leaves five. Ask the child to explain why the affected row is shorter."},"reflection":"What made it easier to notice a missing or forbidden pair?","transfer":"When planning a snack, keep the drink fixed while you list the allowed foods, then change the drink.","parent":{"aim":"Look for systematic groups and careful handling of restrictions.","prompt":"Which choice are you keeping fixed in this row?","pitfall":"Changing several choices at once or assuming every row must contain the same number.","success":"The child completes one group, moves to the next and checks restrictions in each."}},{"id":"m10l03","module":10,"lesson":3,"title":"Missing or counted twice?","goal":"I can check a list for missing possibilities and duplicates.","story":"The ticket printer has made a list of badge designs, but it may have printed one twice and forgotten another. A long list is not always a complete list. Today you will compare entries carefully and decide whether order matters before counting anything as a new possibility.","tool":"One tick per possibility","steps":["Decide what makes two choices the same or different.","Give each allowed possibility one tick.","Look for extra ticks and possibilities with no tick."],"worked":{"stem":"Badges are red or blue and have a dot or star. All four pairs are allowed. The printed list says red-dot, red-star, blue-dot, blue-star, red-star.","ask":"How many different badge designs are on this list?","options":["Two different designs","Four different designs","Five different designs","Three different designs"],"answer":1,"hints":["Read the list for repeated words.","A repeated copy of the same design does not make a new design."],"explanation":["Red-star appears twice.","The different designs are red-dot, red-star, blue-dot and blue-star.","There are four different designs in the five printed entries."],"optionWhy":["There are two colours but four different colour-and-shape pairs.","There are four unique colour-and-shape pairs.","Five counts the extra copy of red-star as a new design.","All four allowed pairs appear on the list."],"think":"Which entry would you cross out as a duplicate?","visual":{"type":"table","headers":["Printed entry"],"rows":[["Red-dot"],["Red-star"],["Blue-dot"],["Blue-star"],["Red-star"]],"caption":"Five printed entries"},"id":"m10l03-w","kind":"worked"},"questions":[{"stem":"A lunch choice uses one fruit and one cup colour. Fruits are apple or pear; cups are red or blue. The list contains apple-red, apple-blue and pear-red.","ask":"Which allowed pair is missing?","options":["Apple-blue","Pear-red","Pear-blue","Apple-red"],"answer":2,"hints":["Check the two cup choices for each fruit.","The apple group is complete; inspect the pear group."],"explanation":["Apple has been paired with red and blue.","Pear has been paired only with red.","Pear-blue is the one missing pair."],"optionWhy":["Apple-blue already appears.","Pear-red already appears.","This is allowed but does not appear in the list.","Apple-red already appears."],"think":"Show how two small rows reveal the gap.","visual":{"type":"table","headers":["Fruit","Cup colours listed"],"rows":[["Apple","Red, blue"],["Pear","Red"]],"caption":"Each fruit can use either cup colour"},"id":"m10l03-q1","kind":"guided"},{"stem":"A snack bag holds two different fruits chosen from apple, pear and orange. Their order inside the bag does not matter. A list says apple-pear, pear-apple, apple-orange, orange-pear.","ask":"Which two entries describe the same snack bag?","options":["Apple-pear and apple-orange","Pear-apple and orange-pear","Apple-orange and orange-pear","Apple-pear and pear-apple"],"answer":3,"hints":["The rule says order inside the bag does not matter.","Compare the fruits included, not which fruit is written first."],"explanation":["Apple-pear contains one apple and one pear.","Pear-apple contains those same two fruits in the other written order.","They describe the same bag because order does not matter."],"optionWhy":["The second bag has orange instead of pear.","One bag contains apple, while the other contains orange.","One bag contains apple, while the other contains pear.","Both entries contain exactly apple and pear."],"think":"Which sentence tells you whether order matters?","visual":{"type":"table","headers":["Entry"],"rows":[["Apple-pear"],["Pear-apple"],["Apple-orange"],["Orange-pear"]],"caption":"Order inside a snack bag does not matter"},"id":"m10l03-q2","kind":"practice"},{"stem":"A play needs a leader and a helper. One plan has Mia as leader and Leo as helper. Another has Leo as leader and Mia as helper. The roles are different jobs.","ask":"How many different plans are described?","options":["Two; the children have different jobs in each plan","One; the plans use the same two children","Three; there are two children and one play","Four; each written name counts as a plan"],"answer":0,"hints":["Compare who has each labelled job.","A different leader makes a different job assignment."],"explanation":["In one plan, Mia leads and Leo helps.","In the other, Leo leads and Mia helps.","These are two different assignments, even though the same children take part."],"optionWhy":["Swapping the jobs changes the plan.","The same children can have different assignments.","Only two assignments have been described.","The names are parts of plans, not separate plans."],"think":"Why does order matter here but not inside a snack bag?","visual":{"type":"table","headers":["Plan","Leader","Helper"],"rows":[["One","Mia","Leo"],["Two","Leo","Mia"]],"caption":"Different jobs make different assignments"},"id":"m10l03-q3","kind":"practice"},{"stem":"The complete set of two-letter codes is AA, AB, BA and BB. A list currently says AA, AB, AB, BA, BA. You want every allowed code exactly once.","ask":"Which change fixes the list?","options":["Keep the list because five entries must be enough","Remove one AB and one BA, then add BB","Add another AA and change nothing else","Remove AA and add AB"],"answer":1,"hints":["Look for two repeats and one missing code.","A complete list needs each of the four codes once."],"explanation":["AB and BA each appear twice, so one copy of each is extra.","BB is the missing code.","Removing the two extra copies and adding BB leaves each allowed code once."],"optionWhy":["A list can be long yet repeat entries and miss another one.","This removes both duplicates and fills the missing possibility.","Another AA adds a duplicate and still leaves BB missing.","This removes a needed code and adds another duplicate."],"think":"Explain why list length alone cannot prove completeness.","visual":{"type":"table","headers":["Allowed codes","Current list"],"rows":[["AA, AB, BA, BB","AA, AB, AB, BA, BA"]],"caption":"Check both repeats and gaps"},"id":"m10l03-q4","kind":"practice"},{"stem":"At the library, choose one book and one bookmark. Books are Space, Garden and Ocean. Bookmarks are dotted or striped. The list shows Space-dotted, Garden-dotted, Garden-striped, Ocean-dotted and Ocean-striped.","ask":"Which pair must be added to complete the choices?","options":["Garden-striped","Space-dotted","Space-striped","Ocean-dotted"],"answer":2,"hints":["Check each book for both bookmark choices.","Which book has only one choice listed?"],"explanation":["Garden and Ocean each have both dotted and striped bookmarks listed.","Space has only a dotted bookmark listed.","Space-striped completes the set of six possible choices."],"optionWhy":["Garden-striped is already on the list.","Space-dotted is already on the list.","This is the missing bookmark choice for Space.","Ocean-dotted is already on the list."],"think":"How could you organise the list so the missing pair is easier to see?","visual":{"type":"table","headers":["Book","Bookmark choices listed"],"rows":[["Space","Dotted"],["Garden","Dotted, striped"],["Ocean","Dotted, striped"]],"caption":"Every book can use either bookmark"},"id":"m10l03-q5","kind":"transfer"}],"activity":{"title":"List repair shop","instructions":"Choose two colours and two shapes. Write the four possible pairs on four small slips. Make a new four-entry list that includes one pair twice and leaves out a different pair. Give it to a partner to repair. The repaired list must include every allowed pair exactly once. Then swap roles and make a new faulty list.","coach":"The faulty list still has four entries, but only three different pairs. Replacing the extra copy with the missing pair restores the complete list."},"reflection":"How did you decide whether two entries were genuinely the same?","transfer":"Check a short list of costume or book-and-bookmark choices for both repeats and missing pairs.","parent":{"aim":"Observe whether the child distinguishes unique possibilities from written entry count.","prompt":"What makes these two entries the same, or different?","pitfall":"Assuming a longer list must be complete, or treating role swaps like unordered pairs.","success":"The child identifies duplicates, restores missing cases and explains when order matters."}},{"id":"m10l04","module":10,"lesson":4,"title":"Could happen or must happen?","goal":"I can check every allowed case before saying something is guaranteed.","story":"A puppet wants to promise that a lucky dip will give a red token. Promises need careful checking! Something might happen quickly, yet take longer on an unlucky try. Today you will look for the trickiest allowed case and use small lists to decide what must happen.","tool":"Try the trickiest case","steps":["Read all the rules and allowed cases.","Try to find a case where the proposed guarantee fails.","Call it guaranteed only when every allowed case works."],"worked":{"stem":"A bag contains three red tokens and one blue token. Take tokens without looking, one at a time, and do not put them back.","ask":"What is the smallest number of tokens you must take to guarantee at least one red token?","options":["Three tokens","Four tokens","Two tokens","One token"],"answer":2,"hints":["Imagine the first token is the unhelpful colour.","There is only one blue token in the whole bag."],"explanation":["Taking one token might give the blue token, so one is not a guarantee.","If blue comes first, every remaining token is red.","Two tokens guarantee a red token, and two is the smallest number that works."],"optionWhy":["Three also guarantees red, but two already works.","Four works, but it is not the smallest guaranteed number.","At most one draw can be blue before a red must appear.","The first token could be blue."],"think":"Describe the most unlucky first draw.","visual":{"type":"table","headers":["Colour","Tokens in bag"],"rows":[["Red","3"],["Blue","1"]],"caption":"No looking and no replacement"},"id":"m10l04-w","kind":"worked"},"questions":[{"stem":"A bag has two yellow tokens and two green tokens. Take tokens without looking and without putting them back. You want at least two tokens of the same colour.","ask":"What is the smallest number of draws that guarantees a matching pair?","options":["Two draws","One draw","Four draws","Three draws"],"answer":3,"hints":["The first two could have different colours.","After one yellow and one green, what can the third token do?"],"explanation":["Two draws could give one yellow and one green, so no match is guaranteed yet.","The third token must be yellow or green and will match one of those first two.","Three draws guarantee a pair; two do not."],"optionWhy":["Two could be different colours.","One token cannot form a pair.","Four works, but three is the smaller guaranteed number.","A third token must match one of the two possible colours."],"think":"Show an example explaining why two draws are not enough.","visual":{"type":"table","headers":["Colour","Number"],"rows":[["Yellow","2"],["Green","2"]],"caption":"Take without looking or replacement"},"id":"m10l04-q1","kind":"guided"},{"stem":"Exactly one of three closed boxes contains a star. The other two are empty. You may open the boxes in any order, one at a time. There are no clues about which box holds the star.","ask":"How many boxes might you need to open before you are guaranteed to have opened the star box?","options":["All three boxes","Only one box","Only two boxes","No boxes"],"answer":0,"hints":["The star might be in the last box you choose.","Finding out where it is and actually opening its box are different actions."],"explanation":["The first box could be empty.","The second could also be empty, leaving the star in the third.","You might need to open all three before the star box has actually been opened."],"optionWhy":["The star can be in the final unopened box.","The first box could be one of the two empty boxes.","After two empty boxes you know where the star is, but its box is still closed.","Opening no boxes cannot open the star box."],"think":"Explain the difference between knowing the last box and opening it.","visual":{"type":"table","headers":["Boxes","Contents across all three"],"rows":[["Three closed boxes","Exactly one star; two boxes empty"]],"caption":"No clues identify the star box"},"id":"m10l04-q2","kind":"practice"},{"stem":"Three cards are labelled A, B and C. Choose two different cards. Every pair is allowed. The order of the chosen cards does not matter.","ask":"Which statement is true for every possible pair?","options":["A and B are always chosen together","At least one chosen card is A or B","A is always chosen","B is always chosen"],"answer":1,"hints":["The possible pairs are small enough to list.","There is only one card outside the group A-or-B."],"explanation":["The possible pairs are A-B, A-C and B-C.","Every one of these pairs contains A, B or both.","At least one card from the group A-or-B is guaranteed."],"optionWhy":["The pairs A-C and B-C do not include both A and B.","All three allowed pairs include at least one of these two cards.","The pair B-C does not include A.","The pair A-C does not include B."],"think":"Find a pair that shows why always choosing A is too strong.","visual":{"type":"table","headers":["Cards available","Rule"],"rows":[["A, B, C","Choose two different cards"]],"caption":"All pairs are allowed"},"id":"m10l04-q3","kind":"practice"},{"stem":"Choose two different badges from circle, square and star. The circle and star are not allowed together. There are no other restrictions.","ask":"Which badge must be in every allowed choice?","options":["Star","No badge is guaranteed","Square","Circle"],"answer":2,"hints":["List the three pairs, then cross out the forbidden one.","Compare what the remaining allowed pairs have in common."],"explanation":["The pairs are circle-square, circle-star and square-star.","Circle-star is forbidden, leaving circle-square and square-star.","Both remaining choices include square."],"optionWhy":["Circle-square is allowed without star.","Square is shared by both allowed choices.","Square occurs in each of the two allowed pairs.","Square-star is allowed without circle."],"think":"Explain how crossing out one pair creates a guarantee.","visual":{"type":"table","headers":["Available badges","Restriction"],"rows":[["Circle, square, star","Circle and star cannot be chosen together"]],"caption":"Choose exactly two different badges"},"id":"m10l04-q4","kind":"practice"},{"stem":"Bella, Mia and Leo each perform once in a three-person show. Bella must perform before Mia. Leo may perform in any position that leaves this rule true.","ask":"Which statement is guaranteed?","options":["Bella is always first","Leo is always last","Mia is always last","Mia is not first"],"answer":3,"hints":["Try an order with Leo first and another with Leo last.","What does Bella-before-Mia prevent Mia from doing?"],"explanation":["Mia needs Bella somewhere before her.","If Mia were first, there would be no earlier place for Bella.","Mia cannot be first in any allowed order."],"optionWhy":["Leo-Bella-Mia is allowed, so Bella need not be first.","Bella-Leo-Mia is allowed, so Leo need not be last.","Bella-Mia-Leo is allowed, so Mia need not be last.","The Bella-before-Mia rule always prevents Mia from being first."],"think":"Give an allowed order that challenges one of the other statements.","visual":{"type":"table","headers":["Performers","Only order rule"],"rows":[["Bella, Mia, Leo","Bella performs before Mia"]],"caption":"Each person performs exactly once"},"id":"m10l04-q5","kind":"transfer"}],"activity":{"title":"Guarantee bag","instructions":"Put three red counters and one blue counter in a bag or cup. Before drawing, decide how many draws guarantee a red counter. Draw without looking and do not replace counters. Repeat after returning all four. Then use two red and two blue counters and investigate how many draws guarantee a matching pair.","coach":"Two draws guarantee red in the first bag. Three guarantee a matching colour in the second. One lucky trial does not establish the guarantee; discuss the unluckiest possible start."},"reflection":"What example stopped you from calling a result guaranteed too soon?","transfer":"When arranging a play, list a few allowed orders and ask which statements remain true in all of them.","parent":{"aim":"Look for worst-case reasoning and precise use of guaranteed.","prompt":"Can you make an allowed case where that promise fails?","pitfall":"Using one successful try to claim every try will work.","success":"The child gives a failing case for smaller claims and checks all relevant possibilities."}},{"id":"m11l01","module":11,"lesson":1,"title":"What are we trying to do?","goal":"I can choose a clear goal before comparing plans.","story":"Bella is helping the puppet club make a plan. Everyone has an idea, but they have not agreed what the plan should achieve. A useful first step is to name the goal. Then you can compare information that actually matters and explain why one choice fits that goal.","tool":"Name the goal","steps":["Say exactly what the plan needs to achieve.","Find information that helps compare choices against that goal.","Choose using the stated goal, and explain your reason."],"worked":{"stem":"Bella needs a bag that carries at least three books. She wants the cheapest bag that does this. Pocket holds 2 books and costs $3; Leaf holds 3 and costs $5; Cloud holds 4 and costs $7; Moon holds 3 and costs $8.","ask":"Which bag should she choose for this goal?","options":["Leaf","Pocket","Cloud","Moon"],"answer":0,"hints":["First remove bags that cannot carry three books.","Compare prices only among the bags that can do the job."],"explanation":["Pocket cannot carry three books, so it does not meet the need.","Leaf, Cloud and Moon can; their prices are $5, $7 and $8.","Leaf is the cheapest bag that carries enough books."],"optionWhy":["Leaf holds three books and has the lowest price among suitable bags.","Pocket is cheaper but cannot carry the required three books.","Cloud works, but costs more than Leaf.","Moon works, but also costs more than Leaf."],"think":"Which part of the goal ruled out the cheapest-looking bag?","visual":{"type":"table","headers":["Bag","Books held","Cost"],"rows":[["Pocket","2","$3"],["Leaf","3","$5"],["Cloud","4","$7"],["Moon","3","$8"]],"caption":"Bag choices"},"id":"m11l01-w","kind":"worked"},"questions":[{"stem":"All four paths to the library are open and allowed. The goal is to arrive in the shortest walking time. Oak takes 10 minutes, Pond takes 6, Hill takes 8 and Gate takes 12.","ask":"Which path fits that goal best?","options":["Gate","Pond","Oak","Hill"],"answer":1,"hints":["The goal is about walking time.","Compare the four minute values."],"explanation":["All four paths are allowed, so compare their times directly.","Six minutes is shorter than eight, ten or twelve.","The Pond path reaches the library fastest under the given information."],"optionWhy":["Gate takes twelve minutes, the longest listed time.","Its six-minute time is the smallest.","Oak takes ten minutes, which is longer than six.","Hill takes eight minutes, which is longer than six."],"think":"Which information would matter if the goal changed to the shortest distance?","visual":{"type":"table","headers":["Path","Walking time"],"rows":[["Oak","10 minutes"],["Pond","6 minutes"],["Hill","8 minutes"],["Gate","12 minutes"]],"caption":"All paths are open and allowed"},"id":"m11l01-q1","kind":"guided"},{"stem":"Four friends want an activity they can all join at the same time. The art table has 3 places, the music group has 4, the dance mat has 2 and the reading booth has 1. Only these places are available.","ask":"Which activity meets their goal?","options":["The dance mat","The reading booth","The music group","The art table"],"answer":2,"hints":["Count how many friends need a place together.","Compare four people with the available places."],"explanation":["The goal needs four places at the same time.","Only the music group has four available places.","The four friends can all join the music group together."],"optionWhy":["Two places leave two friends without places.","One place allows only one of the four friends to join.","It has enough places for all four friends.","Three places leave one friend without a place."],"think":"Why might choosing a favourite activity fail this particular goal?","visual":{"type":"table","headers":["Activity","Places available"],"rows":[["Art","3"],["Music","4"],["Dance","2"],["Reading","1"]],"caption":"Four friends want to join together"},"id":"m11l01-q2","kind":"practice"},{"stem":"Mia wants to choose the cheapest ticket for the same puppet show. She has four ticket cards but cannot see their prices yet. She can ask the ticket seller one question.","ask":"Which question will help most with that goal?","options":["What colour is each ticket?","Which picture is on the tickets?","Who designed the ticket border?","How much does each ticket cost?"],"answer":3,"hints":["The goal uses the word cheapest.","Ask for information that lets you compare cost."],"explanation":["To find the cheapest ticket, Mia must compare prices.","Colours, pictures and borders do not supply those prices.","Asking the cost of each ticket gives the information she needs."],"optionWhy":["Colour does not tell her the price under the given information.","A picture does not provide the required cost comparison.","The designer name does not provide ticket prices.","The prices directly answer which ticket costs least."],"think":"Explain how the useful question connects to the goal.","visual":null,"id":"m11l01-q3","kind":"practice"},{"stem":"Two allowed bus rides go to the same park. Ride Slow costs $2 and takes 20 minutes. Ride Quick costs $5 and takes 10 minutes. Mia wants the lowest cost. Leo wants the shortest time.","ask":"Which choices match their different goals?","options":["Mia chooses Slow; Leo chooses Quick","Mia chooses Quick; Leo chooses Slow","Both must choose Slow","Both must choose Quick"],"answer":0,"hints":["Check each person separately.","Lowest cost and shortest time point to different values."],"explanation":["Slow costs less, so it matches Mia's lowest-cost goal.","Quick takes less time, so it matches Leo's shortest-time goal.","Mia and Leo can reasonably choose different rides because their goals differ."],"optionWhy":["Each choice matches the person's stated goal.","This reverses the cost and time choices.","Slow matches Mia's goal but not Leo's.","Quick matches Leo's goal but not Mia's."],"think":"What would you ask before choosing a ride for someone else?","visual":{"type":"table","headers":["Ride","Cost","Time"],"rows":[["Slow","$2","20 minutes"],["Quick","$5","10 minutes"]],"caption":"Both rides go to the same park"},"id":"m11l01-q4","kind":"practice"},{"stem":"A theatre team wants to check whether people at the back can hear the narrator's last sentence. They can do one short check during rehearsal.","ask":"Which check best matches the goal?","options":["Ask the narrator which snack they like","Ask a listener at the back to repeat the last sentence","Count the buttons on the narrator's costume","Check the colour of the st
