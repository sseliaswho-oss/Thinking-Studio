3l03-w","kind":"worked"},"questions":[{"stem":"Only children wearing boots may enter the muddy garden. Ben is wearing boots. No clue says whether he chooses to enter, or whether any other entry requirements exist.","ask":"What can we say for sure?","options":["Boots are the only possible entry requirement.","Ben meets the boots requirement.","Ben has definitely entered the garden.","Ben can never enter the garden."],"answer":1,"hints":["Separate having a required item from taking the action.","What fact about Ben is directly given?"],"explanation":["Boots are required by the garden rule.","Ben is wearing boots.","He meets that requirement, but his entry is not established."],"optionWhy":["The clues do not say there are no other requirements.","He has the item this rule requires.","Meeting a requirement does not tell us his action.","He does not fail the boots requirement."],"think":"Name something we still do not know about Ben's visit.","visual":null,"id":"m03l03-q1","kind":"guided"},{"stem":"A game rule says, \"Only square cards may be placed in the gold tray.\" A card is round, not square. Players must follow the rule.","ask":"May that round card be placed in the gold tray?","options":["Yes; a round card is required.","We know the card is already in the tray.","No; it does not meet the square-card requirement.","Yes; any shape is allowed."],"answer":2,"hints":["Find the shape required for that tray.","Compare the actual shape with the required shape."],"explanation":["The tray admits square cards only.","The card is round rather than square.","It is therefore not an allowed choice for that tray."],"optionWhy":["The rule requires square cards, not round ones.","The story asks about permission and does not state its position.","Only square cards are allowed, and the card is not square.","That removes the explicit square restriction."],"think":"Could a square card be left outside the tray without breaking this rule?","visual":null,"id":"m03l03-q2","kind":"practice"},{"stem":"To be considered for a puzzle prize, a player must solve at least one puzzle. Ava solved none. Ben solved one. Cleo solved two. Dot solved three. No other prize rules are given.","ask":"Who is ruled out by the stated requirement?","options":["Ben.","Cleo.","Dot.","Ava."],"answer":3,"hints":["Check who falls below the minimum.","At least one includes one, two and three, but not zero."],"explanation":["The requirement is a minimum of one solved puzzle.","Ava has zero, while each other player has at least one.","Ava is ruled out by this rule; it does not identify who actually wins."],"optionWhy":["One solved puzzle meets this particular requirement.","Two solved puzzles meet the at-least-one requirement.","Three solved puzzles meet the at-least-one requirement.","Zero solved puzzles fails the at-least-one requirement."],"think":"Does meeting this requirement tell us who wins? Explain.","visual":{"type":"table","headers":["Player","Puzzles solved"],"rows":[["Ava","0"],["Ben","1"],["Cleo","2"],["Dot","3"]],"caption":"The rule gives a minimum, not a winner."},"id":"m03l03-q3","kind":"practice"},{"stem":"Only robots with blue badges may board the model spaceship. Every robot on board has followed the rule. Dot is on board now.","ask":"What must Dot have?","options":["A blue badge.","A red badge instead of a blue badge.","No badge.","A silver hat."],"answer":0,"hints":["Start with the fact that Dot has correctly entered.","Ask what every correctly admitted robot is required to have."],"explanation":["The rule limits boarding to robots with blue badges.","Dot is on board and all boarded robots complied.","Dot must therefore have the required blue badge."],"optionWhy":["A blue badge is required for every robot correctly on board.","A red badge alone would not meet the blue-badge requirement.","That would fail the required condition.","No hat requirement is stated."],"think":"Why does knowing that the rule was followed matter here?","visual":null,"id":"m03l03-q4","kind":"practice"},{"stem":"The library rule says, \"Only books with a return label may go in this box.\" A storybook has been placed in the box correctly, following the rule.","ask":"What can we conclude about that storybook?","options":["Every labelled book is already in the box.","It has a return label.","It is the only book with a return label.","It has a red cover."],"answer":1,"hints":["What feature is required for correct placement?","Do not make a claim about every labelled book's location."],"explanation":["Only return-labelled books may be placed in the box.","This storybook was placed there correctly.","It must have a return label, while other labelled books may still be elsewhere."],"optionWhy":["The rule restricts box contents but does not require all labelled books to be inside.","Correct placement requires the label.","The rule gives no count of labelled books.","No cover colour is required."],"think":"Make up a similar requirement for a classroom collection box.","visual":null,"id":"m03l03-q5","kind":"transfer"}],"activity":{"title":"The Ticket Gate","instructions":"Give three toy visitors paper tickets: one has a star ticket, one a circle ticket and one no ticket. Set the rule: Only visitors with a star ticket may enter. Decide who is ruled out. Leave the star-ticket visitor outside for a moment and discuss whether being outside breaks the rule. Then let that visitor enter.","coach":"The rule restricts who may enter. It does not require every star-ticket holder to enter, so waiting outside is compatible with it."},"reflection":"Which requirement could you check, and what did it still leave unknown?","transfer":"When reading instructions, look for a required item and distinguish being ready from having completed the action.","parent":{"aim":"Observe whether she distinguishes a necessary requirement from guaranteed admission or action.","prompt":"What does the rule require? Does it also promise that the action happens?","pitfall":"Assuming meeting one requirement guarantees a result or forces an action.","success":"She rules out a missing requirement and limits conclusions when the requirement is met."}},{"id":"m03l04","module":3,"lesson":4,"title":"Does This Break the Rule?","goal":"I can find a case that breaks a rule and explain the exact conflict.","story":"The rule machine needs a safety check before the puppet festival. Pip has prepared examples of what it might do. Some examples follow the instruction, even when they look surprising. One example really breaks it. Help Bella inspect the starting condition and the required result together, then identify the genuine mismatch.","tool":"Find the mismatch","steps":["Identify the cases that the rule applies to.","Check whether the required result appears in each of those cases.","A case breaks the rule when its condition holds but its required result is missing."],"worked":{"stem":"The card rule is: Every red card must be a circle. Blue cards may have any shape. Four cards are shown in the options.","ask":"Which card breaks the rule?","options":["A blue triangle.","A blue circle.","A red triangle.","A red circle."],"answer":2,"hints":["First identify which colour the shape requirement applies to.","A non-red card is not a counterexample to this red-card rule."],"explanation":["The rule requires circle shapes for red cards.","The red triangle meets the red condition but is not a circle.","That card alone breaks the stated requirement."],"optionWhy":["Blue cards are allowed to have any shape.","A blue circle is permitted; the rule does not restrict blue shapes.","It is red but lacks the required circle shape.","It has the shape required for a red card."],"think":"Why does the blue triangle not break the rule?","visual":null,"id":"m03l04-w","kind":"worked"},"questions":[{"stem":"A theatre rule says: If a performer steps on stage, that performer must wear a cape. People who stay offstage may choose whether to wear one.","ask":"Which situation breaks the rule?","options":["A performer steps on stage with a cape.","A helper stays offstage with a cape.","A helper stays offstage without a cape.","A performer steps on stage without a cape."],"answer":3,"hints":["Look for someone to whom the stage rule applies.","Then check whether that person has the required costume item."],"explanation":["The rule applies when a performer steps on stage.","A performer on stage without a cape lacks the required costume item.","That combination conflicts with the requirement."],"optionWhy":["Both the stage condition and cape requirement are satisfied.","Wearing a cape offstage is explicitly allowed.","The cape requirement does not apply offstage.","The stage condition applies, but the required cape is missing."],"think":"Explain why a cape does not force someone to go on stage.","visual":null,"id":"m03l04-q1","kind":"guided"},{"stem":"A wrapping rule says: Only blue gift boxes may have ribbons. A blue box may have a ribbon or no ribbon. Red boxes must have no ribbon.","ask":"Which gift breaks the rule?","options":["A red box with a ribbon.","A blue box with a ribbon.","A blue box without a ribbon.","A red box without a ribbon."],"answer":0,"hints":["Start with the gifts that have ribbons.","For each ribbon, check whether the box is blue."],"explanation":["A ribbon requires a blue box.","The red ribboned box has a ribbon without the required blue colour.","It is the one case that violates the wrapping rule."],"optionWhy":["A ribbon is permitted only on a blue box.","This satisfies the colour requirement for a ribbon.","Blue boxes are explicitly allowed without ribbons.","This matches the requirement for a red box."],"think":"Could a blue box without a ribbon be a rule-breaking case? Why?","visual":null,"id":"m03l04-q2","kind":"practice"},{"stem":"In a music game, if the bell rings, every player must pause. If the bell does not ring, players may pause or keep moving.","ask":"Which situation breaks the game rule?","options":["The bell stays silent and players keep moving.","The bell rings and one player keeps moving.","The bell rings and all players pause.","The bell stays silent and a player pauses."],"answer":1,"hints":["The rule applies to every player when the bell rings.","A single missing required action can be enough."],"explanation":["A ringing bell triggers a pause requirement for all players.","One player moving during that ring fails the requirement.","That situation breaks the rule, even if the other players pause."],"optionWhy":["Moving during silence is explicitly allowed.","The ring requires every player to pause, so one moving player is enough to break it.","All players follow the required action.","Pausing during silence is explicitly allowed."],"think":"How does the word every affect your check?","visual":null,"id":"m03l04-q3","kind":"practice"},{"stem":"A craft rule says: If a badge has three dots, it must also have a gold star. Badges with other dot counts may have or lack a gold star.","ask":"Which badge proves the rule was not followed?","options":["Two dots and a gold star.","Two dots and no gold star.","Three dots and no gold star.","Three dots and a gold star."],"answer":2,"hints":["Check the dot count before checking the star.","Only the three-dot case has a required star."],"explanation":["The requirement applies to badges with exactly three dots.","A three-dot badge without a star fails that requirement.","The two-dot cases cannot break this particular rule."],"optionWhy":["Other dot counts are allowed to have a star.","Other dot counts are allowed to lack a star.","The three-dot condition is present but the required star is absent.","The required star is present."],"think":"Make one new badge that follows the rule.","visual":null,"id":"m03l04-q4","kind":"practice"},{"stem":"A classroom library rule says: If a book is borrowed, its card must be stamped. Cards for books not borrowed may also be stamped for another activity.","ask":"Which record shows the rule was broken?","options":["A book was borrowed and its card was stamped.","A book was not borrowed and its card was stamped.","A book was not borrowed and its card was not stamped.","A book was borrowed and its card was not stamped."],"answer":3,"hints":["Look for a borrowed book before checking the card.","A stamp on an unborrowed book is allowed by the stated rules."],"explanation":["Every borrowed book needs a stamped card.","An unstamped card for a borrowed book fails that requirement.","The other records all fit the rule as written."],"optionWhy":["This follows the borrowing rule.","Other stamping is explicitly allowed.","The borrowing condition does not apply.","Borrowing triggers the stamp requirement, which is missing."],"think":"Create a simple classroom rule and describe one real counterexample.","visual":null,"id":"m03l04-q5","kind":"transfer"}],"activity":{"title":"Rule Inspector","instructions":"Draw four cards: a red circle, a red triangle, a blue circle and a blue triangle. Set the rule: All red cards must be circles. Sort the cards into follows the rule and breaks the rule. Explain each placement. Then change the rule to Only circles may be red and check whether the sorting changes.","coach":"The two wordings impose the same restriction here: a red triangle breaks it. A blue triangle is allowed by both, because neither rule requires all cards to be circles."},"reflection":"What two features had to appear together to break today's rule?","transfer":"In a board game or classroom routine, check a rule by describing the precise condition and missing action.","parent":{"aim":"Observe whether she can identify a concrete counterexample to a conditional rule.","prompt":"Does this case meet the starting condition, and is the required result there?","pitfall":"Calling an unusual but permitted case a violation by reversing or strengthening the rule.","success":"She names both the applicable condition and the missing required result in a genuine violation."}},{"id":"m04l01","module":4,"lesson":1,"title":"Who Goes Before Whom?","goal":"I can arrange three things while checking every order clue.","story":"The puppet festival needs a running order. Pip wants to place everyone at once, but Bella starts with one clue and checks the next. A little row of cards makes the relationships easy to see. Help them arrange performers, flags and activities, remembering that before does not always mean immediately before.","tool":"Build and check the line","steps":["Make one card for each person or object.","Use one before-or-after clue to begin the line.","Check every clue against the complete order."],"worked":{"stem":"Ari, Bo and Cy will perform once each. Ari must perform before Bo. Bo must perform before Cy. Read the order from first to last.","ask":"Who performs second?","options":["Bo.","Ari.","Cy.","The clues do not determine it."],"answer":0,"hints":["Put Ari before Bo first.","Then place Cy after Bo and check all three positions."],"explanation":["Ari must come before Bo.","Bo must come before Cy, making the order Ari, Bo, Cy.","Bo occupies the middle, or second, position."],"optionWhy":["Ari must be before Bo and Cy after Bo, placing Bo between them.","Ari has to come before Bo, who must also be before Cy, so Ari is first.","Both Ari and Bo must precede Cy, so Cy is last.","The two linked order clues fix the complete order."],"think":"Read the full order and check both clues aloud.","visual":null,"id":"m04l01-w","kind":"worked"},"questions":[{"stem":"Three flags are placed in a row: red, blue and green, one of each. Red is to the left of blue. Green is to the right of blue. Read the row from left to right.","ask":"Which order follows both clues?","options":["Green, blue, red.","Red, blue, green.","Blue, red, green.","Red, green, blue."],"answer":1,"hints":["Blue has one named flag on each side.","Place red and green on the sides the clues specify."],"explanation":["Red must be on blue's left.","Green must be on blue's right.","With just three flags, the complete order is red, blue, green."],"optionWhy":["Both required left-right relationships are reversed.","Red is left of blue and green is right of blue in this order.","Red is right of blue, breaking the first clue.","Green is left of blue, breaking the second clue."],"think":"Which flag is a useful starting point because both clues mention it?","visual":null,"id":"m04l01-q1","kind":"guided"},{"stem":"Mia, Pip and Leo each have one turn. Mia has the first turn. Leo must have a later turn than Pip. There are exactly three turns.","ask":"Who has the last turn?","options":["Pip.","Either Mia or Pip.","Leo.","Mia."],"answer":2,"hints":["Fill the fixed first position.","Use the later-than clue for the two remaining turns."],"explanation":["Mia takes the first of the three turns.","The remaining order must put Pip before Leo.","Leo therefore takes the third and last turn."],"optionWhy":["Leo must come after Pip, so Pip cannot be last.","Both are excluded from last by the given clues.","After Mia is placed first, Pip must be second and Leo third.","Mia is explicitly first."],"think":"Explain why Pip cannot be last.","visual":null,"id":"m04l01-q2","kind":"practice"},{"stem":"Three books stand in a row: Fox, Moon and Tree. Moon is somewhere to the right of Fox. Tree is somewhere to the left of Fox. Each title appears once.","ask":"Which book is in the middle?","options":["Moon.","Tree.","No book can be in the middle.","Fox."],"answer":3,"hints":["Notice which title has one book on each side.","Place the left and right neighbours around that title."],"explanation":["Tree is left of Fox.","Moon is right of Fox.","The only complete order is Tree, Fox, Moon, placing Fox in the middle."],"optionWhy":["Moon must be to the right of Fox, with Tree farther left.","Tree must be to the left of Fox, with Moon farther right.","Three books in a row have a middle position, and the clues determine it.","Tree must be left of Fox and Moon right of Fox."],"think":"Point left and right as you check the clues.","visual":null,"id":"m04l01-q3","kind":"practice"},{"stem":"A robot completes three jobs once each: paint, dry and pack. It must paint before it dries the item. It must dry the item before it packs it.","ask":"Which statement must be true?","options":["The robot paints before it packs.","The robot packs before it paints.","The robot dries before it paints.","The robot may pack first."],"answer":0,"hints":["Connect the two before clues through their shared job.","Place the three job cards in one complete line."],"explanation":["Painting must be before drying.","Drying must be before packing.","Painting is therefore also before packing in every valid order."],"optionWhy":["Painting precedes drying, and drying precedes packing.","That reverses the chain of required jobs.","Painting is required to happen before drying.","Packing must come after drying, which follows painting."],"think":"Which job connects the two clues?","visual":null,"id":"m04l01-q4","kind":"practice"},{"stem":"A story recipe gives three actions, once each: wash, cut and cook. Its instructions require washing before cutting and cutting before cooking.","ask":"Which order follows the story recipe?","options":["Cook, cut, wash.","Wash, cut, cook.","Cut, wash, cook.","Wash, cook, cut."],"answer":1,"hints":["Use the recipe's stated order, without adding a new step.","Find the action that must come before both others."],"explanation":["Washing has to precede cutting.","Cutting has to precede cooking.","The complete permitted order is wash, cut, cook."],"optionWhy":["Both required relationships would be reversed.","Both before relationships are satisfied in that order.","Cutting would happen before washing, against the instruction.","Cooking would happen before cutting, against the instruction."],"think":"Find another set of three instructions you can organise with before and after.","visual":null,"id":"m04l01-q5","kind":"transfer"}],"activity":{"title":"The Three-Card Stage","instructions":"Write Ari, Bo and Cy on separate cards. Draw three spaces labelled first, second and third. Use the clues Ari before Bo and Bo before Cy to place the cards. Swap two cards on purpose, then ask a partner to point to a broken clue. Restore the order and invent a new pair of clues.","coach":"Check relations rather than memorising names. A card can be moved only if the complete arrangement continues to satisfy every clue."},"reflection":"Which clue did you check last, and did your line still fit?","transfer":"Use cards to organise three steps in a story, a game setup or a making activity.","parent":{"aim":"Notice whether she combines two order constraints and verifies the whole line.","prompt":"Read each clue against your arrangement. Do both still work?","pitfall":"Following the newest clue while accidentally breaking an earlier one.","success":"She builds the complete order and explains the relation on either side of the middle item."}},{"id":"m04l02","module":4,"lesson":2,"title":"Match Each One","goal":"I can make one-to-one matches and use what is left after known matches.","story":"Three actors need three costumes, and each costume belongs to just one actor for the show. Pip has lost part of the list. Bella puts the known match down first, then uses a cannot clue to find the others. Help the theatre team keep each person and each costume in exactly one place.","tool":"Match, cross off, continue","steps":["Write the complete lists of people and choices.","Place a known match and remove that choice from the other people.","Use the remaining clues, then check that every choice is used once."],"worked":{"stem":"Ava, Ben and Cleo each look after one different toy pet: cat, dog or fish. Every pet is used once. Ava has the cat. Ben does not have the dog.","ask":"Who has the fish?","options":["Cleo.","Both Ben and Cleo.","Ben.","Ava."],"answer":2,"hints":["Start with Ava's known match.","Cross off both unavailable choices for Ben."],"explanation":["Ava uses the cat, so Ben chooses between dog and fish.","Ben is not matched to the dog.","Ben must have the fish, leaving the dog for Cleo."],"optionWhy":["Ben must have the fish, so Cleo has the remaining dog.","Each toy pet is assigned to exactly one person.","The cat is taken by Ava, and Ben cannot have the dog, leaving fish.","Ava already has the cat and each person has one pet."],"think":"Name all three matches and check that each pet is used once.","visual":null,"id":"m04l02-w","kind":"worked"},"questions":[{"stem":"Bella, Mia and Leo each play one different role: pirate, cook or magician. Each role is used once. Bella is the pirate. Mia is not the cook.","ask":"Which role belongs to Leo?","options":["Pirate.","Magician.","Both cook and magician.","Cook."],"answer":3,"hints":["Resolve Mia's role after placing Bella.","Then give Leo the unused role."],"explanation":["Bella takes pirate, leaving cook and magician.","Mia cannot take cook, so she takes magician.","Cook is then the only unused role for Leo."],"optionWhy":["That role is already used by Bella.","Mia must take magician because cook is ruled out for her.","Each performer has exactly one role.","Mia must be the magician after Bella takes pirate, so cook remains for Leo."],"think":"Which clue let you solve Mia's role before Leo's?","visual":null,"id":"m04l02-q1","kind":"guided"},{"stem":"Dot, Pip and Zog each receive one badge, with exactly one blue, one yellow and one green badge used. Dot has blue. Pip does not have green.","ask":"What colour badge does Zog have?","options":["Green.","Blue.","Yellow.","No badge."],"answer":0,"hints":["Remove Dot's colour from the remaining choices.","Use Pip's cannot clue before matching Zog."],"explanation":["Dot uses blue, leaving yellow and green.","Pip cannot use green and therefore uses yellow.","Zog receives the one remaining green badge."],"optionWhy":["Pip must have yellow, leaving green for Zog.","The single blue badge is already assigned to Dot.","Pip must take yellow after blue and green are excluded for Pip.","Every robot is specified to receive one badge."],"think":"Check that no badge colour has been used twice.","visual":null,"id":"m04l02-q2","kind":"practice"},{"stem":"A red box, a blue box and a green box each hold one different toy: a book, a ball or a car. Each toy appears in exactly one box. Red holds the book. Blue does not hold the ball.","ask":"Which toy is in the green box?","options":["All three toys.","The ball.","The book.","The car."],"answer":1,"hints":["Use the known red-box match first.","Decide between the two remaining toys for blue."],"explanation":["Red contains the book, leaving ball and car.","Blue cannot contain the ball, so it contains the car.","The ball must be in the green box."],"optionWhy":["Each box contains exactly one toy.","Blue must hold the car, leaving the ball for green.","The book is already in the red box.","The car is forced into the blue box."],"think":"Can you explain the answer without guessing a box?","visual":null,"id":"m04l02-q3","kind":"practice"},{"stem":"Jo, Nia and Sam each choose one different craft: a kite, a mask or a boat. All three crafts are chosen once. Sam chooses the boat. Jo does not choose the mask.","ask":"What does Nia choose?","options":["The boat.","Both kite and mask.","The mask.","The kite."],"answer":2,"hints":["Place Sam's choice, then consider Jo's remaining options.","Keep each choice assigned to only one child."],"explanation":["The boat is assigned to Sam.","Jo cannot have the mask, so Jo has the kite.","Nia takes the remaining mask."],"optionWhy":["Sam has already chosen the only boat craft.","Each child chooses only one craft.","Jo must choose the kite, so the mask remains for Nia.","Jo must take the kite after the other choices are ruled out."],"think":"Which word in the problem prevents two children choosing the same craft?","visual":null,"id":"m04l02-q4","kind":"practice"},{"stem":"In a story, Ari, Bo and Cy each reach the park in a different way: walking, cycling or by bus. Each way is used once. Cy walks. Ari does not cycle.","ask":"How does Bo reach the park?","options":["By walking.","By bus.","We must guess between walking and bus.","By cycling."],"answer":3,"hints":["Treat the travel methods like the three different toys or costumes.","Solve Ari's choice after placing Cy."],"explanation":["Cy takes the walking option.","Ari cannot cycle, so Ari must take the bus.","Cycling is the only option left for Bo."],"optionWhy":["Walking is already assigned to Cy.","The bus is the only option left for Ari.","The one-to-one clues already determine cycling for Bo.","Ari must use the bus, leaving cycling for Bo."],"think":"How is this travel story like the costume-matching problem?","visual":null,"id":"m04l02-q5","kind":"transfer"}],"activity":{"title":"Costume Casting","instructions":"Make three actor cards labelled Bella, Mia and Leo, and three costume cards labelled pirate, cook and magician. Give each actor exactly one costume and use each costume once. Use the clues Bella is pirate and Mia is not cook. Place each solved match, then explain why neither of the other costumes can go there.","coach":"Bella-pirate leaves two costumes. Mia-magician follows from the cannot clue, so Leo-cook is the final match. Emphasise the one-to-one rule."},"reflection":"Which known match reduced the choices for someone else?","transfer":"Use a match-and-cross-off approach when a story assigns different objects or jobs to different people.","parent":{"aim":"Check that she uses one-to-one restrictions explicitly rather than assuming duplicates are allowed.","prompt":"Which choices are still unused, and which are ruled out for this person?","pitfall":"Reusing an already assigned choice or forgetting that every person has exactly one.","success":"She justifies each match and verifies that every person and option appears exactly once."}},{"id":"m04l03","module":4,"lesson":3,"title":"Put the Clues on a Plan","goal":"I can use a position diagram or table to keep track of information.","story":"Pip is trying to remember every seat, shelf and activity in his head. Bella draws a small plan and suddenly the empty spaces are easier to notice. Today you will use simple tables and maps to hold the clues for you. The plan is a thinking tool, so always check that it matches the words.","tool":"Show the clues","steps":["Choose spaces or a table that matches the task.","Fill in only what a clue actually fixes.","Use the remaining spaces and recheck the original clues."],"worked":{"stem":"Mia, Ben and Pip each sit in one of three seats: left, middle and right. Each seat is used once. Mia sits on the left and Pip on the right.","ask":"Where does Ben sit?","options":["In the middle.","On the left.","On the right.","In both the left and right seats."],"answer":0,"hints":["Put the two fixed names in their positions.","Find the one empty position."],"explanation":["The left seat is fixed as Mia and the right seat as Pip.","There is one remaining person and one remaining seat.","Ben occupies the middle seat."],"optionWhy":["Left and right are occupied by Mia and Pip, leaving the middle seat.","Mia already occupies the only left seat.","Pip already occupies the only right seat.","Ben has one seat, and those seats are already taken."],"think":"Point to the gap that the diagram helps you notice.","visual":{"type":"table","headers":["Left","Middle","Right"],"rows":[["Mia","?","Pip"]],"caption":"Each of Mia, Ben and Pip sits once."},"id":"m04l03-w","kind":"worked"},"questions":[{"stem":"Three clubs meet once each on Monday, Tuesday and Wednesday, one club per day. The clubs are art, music and puzzles. Art is on Monday and music is on Wednesday.","ask":"On which day is the puzzles club?","options":["Friday.","Tuesday.","Monday.","Wednesday."],"answer":1,"hints":["Fill the known days in the three-day table.","Match the unused club with the unused day."],"explanation":["Monday is art and Wednesday is music.","Tuesday is the only unfilled day in the complete schedule.","The puzzles club must fill Tuesday."],"optionWhy":["Only Monday, Tuesday and Wednesday are used in this schedule.","Monday and Wednesday are used, leaving Tuesday for puzzles.","Monday is already assigned to art.","Wednesday is already assigned to music."],"think":"What would go wrong if you added an extra day?","visual":{"type":"table","headers":["Day","Club"],"rows":[["Monday","Art"],["Tuesday","?"],["Wednesday","Music"]],"caption":"Art, music and puzzles each appear once."},"id":"m04l03-q1","kind":"guided"},{"stem":"A fox, a rabbit and an owl each have one different cup: red, blue or green. Each cup is used once. The fox has green. The rabbit does not have red.","ask":"What colour cup does the owl have?","options":["Green.","Any of the three colours.","Red.","Blue."],"answer":2,"hints":["Mark the fox-green match first.","Cross off used or forbidden cups for the rabbit."],"explanation":["Green is assigned to the fox.","The rabbit cannot have green or red, so it has blue.","Red is then the remaining cup for the owl."],"optionWhy":["The fox already uses green.","The one-to-one clues determine a single colour.","The rabbit must use blue, leaving red for the owl.","Blue is the only remaining choice for the rabbit."],"think":"Show the matches in a table with one row for each animal.","visual":{"type":"table","headers":["Animal","Cup clue"],"rows":[["Fox","Green"],["Rabbit","Not red"],["Owl","Not yet filled"]],"caption":"Each colour is used exactly once."},"id":"m04l03-q2","kind":"practice"},{"stem":"A tiny map has two rows and two columns. The top row is lake on the left and kiosk on the right. The bottom row is tree on the left and pond on the right.","ask":"Which place is directly below the kiosk?","options":["The lake.","The tree.","The kiosk itself.","The pond."],"answer":3,"hints":["Find the kiosk before moving anywhere.","Keep the same column and move down one row."],"explanation":["The kiosk is in the top-right position.","Directly below means the same column in the next row.","The bottom-right position contains the pond."],"optionWhy":["The lake is to the left of the kiosk in the top row.","The tree is in the left-hand column, diagonally from the kiosk.","A place is not below itself on this map.","The pond is in the same right-hand column, one row below the kiosk."],"think":"What place is directly below the lake?","visual":{"type":"grid","rows":[["Lake","Kiosk"],["Tree","Pond"]],"caption":"Top row first; left column first."},"id":"m04l03-q3","kind":"practice"},{"stem":"A black box, a red box and a green box each occupy one shelf position: left, middle and right. Each position is used once. Black is on the left. Red is not in the middle.","ask":"Where must the red box be?","options":["On the right.","On the left.","In the middle.","Outside the three positions."],"answer":0,"hints":["Mark the fixed black box.","Cross out both positions red cannot occupy."],"explanation":["Black occupies the left position.","Red cannot use that occupied place or the forbidden middle.","Red must use the right position, leaving middle for green."],"optionWhy":["Left is used by black and middle is excluded for red.","The left position is already occupied by black.","That position is explicitly excluded for red.","Every box occupies one of the three specified positions."],"think":"Use the remaining space to place the green box.","visual":{"type":"table","headers":["Left","Middle","Right"],"rows":[["Black box","Not red","?"]],"caption":"Black, red and green each use one position."},"id":"m04l03-q4","kind":"practice"},{"stem":"Bella has three activity slots, first, second and third. She will have a snack, water the plants and read, once each. Snack is first and reading is third.","ask":"Where should watering the plants go on the plan?","options":["In a fourth slot.","In the second slot.","In the first slot.","In the third slot."],"answer":1,"hints":["Draw the three slots and fill the fixed activities.","Use the empty slot rather than inventing another."],"explanation":["Snack is fixed first and reading third.","Watering is the remaining activity.","It fits the remaining second slot."],"optionWhy":["The task specifies exactly three slots for three activities.","The first and third slots are filled, leaving the second.","Snack already fills the first slot.","Reading already fills the third slot."],"think":"Make a three-slot plan for a small task you will do today.","visual":{"type":"table","headers":["First","Second","Third"],"rows":[["Snack","?","Read"]],"caption":"Each of the three activities happens once."},"id":"m04l03-q5","kind":"transfer"}],"activity":{"title":"A Tiny Helpful Plan","instructions":"Draw three boxes labelled left, middle and right. Make red, green and black paper squares. Place black on the left and keep red out of the middle. Use the drawing to finish the arrangement, then point to each clue as you check it. Make a new version using three activities and first, second and third instead.","coach":"The same three-space representation can organise a shelf or a schedule. Ask the child to explain what each space means in the new context."},"reflection":"What did your table or picture help you keep track of?","transfer":"When a word problem feels crowded, draw a small plan and fill in only the known information.","parent":{"aim":"Check whether she uses an external representation faithfully and labels its meaning.","prompt":"Which clue belongs in this space, and which spaces are still open?","pitfall":"Filling a blank with a guess, then forgetting that it was not given.","success":"She distinguishes fixed information from possibilities and checks her completed representation against the text."}},{"id":"m04l04","module":4,"lesson":4,"title":"One Answer or More Than One?","goal":"I can find what is fixed while recognising what still has more than one answer.","story":"The festival plan is nearly ready. Some clues fix the whole order, but other clues fix only who goes first or last. Pip wants to fill every empty space immediately. Bella asks whether two different plans still work. Help them finish the parts they can prove and leave the unsettled parts open.","tool":"Find the fixed part","steps":["Build a complete arrangement that follows the clues.","Try changing the part the question asks about.","Report only what stays the same in every valid arrangement."],"worked":{"stem":"Leo, Bella and Mia perform once each. Leo must be before Bella. Mia cannot be first. There are exactly three performance positions.","ask":"Who must perform first?","options":["Mia.","The first performer is not determined.","Leo.","Bella."],"answer":2,"hints":["Check which people cannot occupy the first position.","A person who needs someone before them cannot be first."],"explanation":["Bella cannot be first because Leo must be before her.","Mia cannot be first by the other clue.","Leo is the only possible first performer, although the final two positions can vary."],"optionWhy":["The clues explicitly forbid Mia from being first.","Both Bella and Mia are ruled out from first, leaving Leo.","Bella needs Leo before her, and Mia is excluded, leaving Leo first.","Leo must perform before Bella, so Bella cannot be first."],"think":"Can you show two valid orders with different people last?","visual":null,"id":"m04l04-w","kind":"worked"},"questions":[{"stem":"Ava, Ben and Cleo each take one turn. Ava must come before Ben. There are no other order clues.","ask":"Which statement describes the first turn correctly?","options":["Ava must be first.","Cleo must be first.","Ben could be first.","Either Ava or Cleo could be first."],"answer":3,"hints":["Try moving Cleo while keeping Ava before Ben.","One relation may leave more than one complete order."],"explanation":["The clue prevents Ben from being first.","Ava can be first, and Cleo can also be first without breaking it.","The first turn is not uniquely assigned between Ava and Cleo."],"optionWhy":["Cleo-Ava-Ben is also a valid order.","Ava-Ben-Cleo is also a valid order.","Ben must have Ava before him.","Ava-Ben-Cleo and Cleo-Ava-Ben both work, while Ben cannot lead."],"think":"Make one valid line for each possible first person.","visual":null,"id":"m04l04-q1","kind":"guided"},{"stem":"Red, blue and green flags stand in a row, each once. Red must be before blue. Blue must be before green. No other flags are used.","ask":"How many complete orders follow these clues?","options":["Exactly one.","Exactly two.","All six possible orders.","None."],"answer":0,"hints":["Build the line from the two connected clues.","Try swapping any pair and check whether a rule breaks."],"explanation":["Red must precede blue, which must precede green.","That fixes red first, blue second and green third.","Only one complete arrangement satisfies both relationships."],"optionWhy":["The two relations force red, blue, green.","There is no second order that preserves both relations.","Most orders break at least one of the two clues.","Red, blue, green satisfies both clues."],"think":"Which clue would you remove to allow another arrangement?","visual":null,"id":"m04l04-q2","kind":"practice"},{"stem":"Ava, Ben and Cleo each receive one different badge: red, blue or green. Each badge is used once. Ava receives red. No clue distinguishes Ben's badge from Cleo's.","ask":"What can we conclude about Ben and Cleo?","options":["Both get blue.","They get blue and green, but we cannot tell which person gets which.","Ben must get blue.","Cleo must get green."],"answer":1,"hints":["Place the known red badge first.","Swap the remaining two colours and see whether any clue breaks."],"explanation":["Ava uses the red badge.","Blue and green remain for Ben and Cleo.","Either assignment of those two colours works, so their individual colours are not fixed."],"optionWhy":["Each colour is used once, and the green badge must also be assigned.","Both assignments of the two unused colours fit the clues.","Ben-green and Cleo-blue also fits.","Cleo-blue and Ben-green also fits."],"think":"Describe the two valid badge assignments.","visual":null,"id":"m04l04-q3","kind":"practice"},{"stem":"A star card, a circle card and a square card each occupy one place in a three-card row. The star is fixed on the left. No clue orders the other two cards.","ask":"Which statement must be true?","options":["The square is in the middle.","The circle is left of the star.","The star is left of both other cards.","The circle is in the middle."],"answer":2,"hints":["Separate the fixed position from the two free positions.","Try swapping circle and square while keeping the star fixed."],"explanation":["The star is always leftmost.","Circle and square can exchange the other two places.","Their order is unknown, but both remain to the right of the star."],"optionWhy":["The circle could be in the middle instead.","The star is already in the leftmost position.","The fixed left position puts both remaining cards to its right.","The square could be in the middle instead."],"think":"Name one fact that stays fixed and one that can change.","visual":{"type":"table","headers":["Left","Middle","Right"],"rows":[["Star","Circle or square","Square or circle"]],"caption":"Each card is used once; the star is fixed."},"id":"m04l04-q4","kind":"practice"},{"stem":"In a story, Mia visits the library, bakery and park, each once. She visits the park after both the library and the bakery. The story gives no order between the first two places.","ask":"Which summary is justified?","options":["The library must be first.","The bakery must be first.","The park could be first.","The park is last; the library and bakery can be in either order."],"answer":3,"hints":["First place the visit constrained by both clues.","Check whether the other two visits can swap."],"explanation":["The park follows both other visits, so it is last.","No clue orders the library relative to the bakery.","Two routes remain, sharing the same final stop."],"optionWhy":["Bakery, library, park also follows the clues.","Library, bakery, park also follows the clues.","The park must come after the other two visits.","Both must precede the park, but neither is required to precede the other."],"think":"How is this route like knowing the last performer but not the whole running order?","visual":null,"id":"m04l04-q5","kind":"transfer"}],"activity":{"title":"Make It Unique","instructions":"Write Ava, Ben and Cleo on three cards. Start with the clue Ava is first. Build both possible orders and keep a drawing of each. Add the clue Ben is before Cleo. Check both drawings again and cross out the one that fails. Explain which new information changed two valid orders into one.","coach":"Ava first allows Ava-Ben-Cleo and Ava-Cleo-Ben. Adding Ben before Cleo leaves only the first. The child should identify the exact eliminated arrangement."},"reflection":"Which part of your answer was fixed, and which part could still change?","transfer":"In reading or planning, say what the clues settle and what they leave open, instead of filling every gap.","parent":{"aim":"Observe whether she distinguishes a unique answer to one question from a fully determined whole arrangement.","prompt":"Can you change this part while keeping every clue true?","pitfall":"Assuming that knowing one fixed position determines every other position.","success":"She finds alternate valid arrangements and states exactly which features are shared by all of them."}},{"id":"m05l01","module":5,"lesson":1,"title":"Find the main claim","goal":"I can find the idea someone wants me to agree with.","story":"The Reason Workshop has a talking noticeboard. Every note has an idea, but some notes also have a reason tucked inside. Bella and a little robot called Pip are sorting the notes. Help them find what each writer wants people to believe or do before checking the reasons.","tool":"The big-idea finder","steps":["Ask what the speaker wants us to believe or do.","Separate that idea from the information offered to support it.","Say the main idea in one short sentence."],"worked":{"stem":"Mia says, \"We should put a cushion in the reading corner because the wooden seat feels hard.\"","ask":"What is Mia asking us to agree with?","explanation":["Mia describes a hard wooden seat.","She uses that information to recommend a change.","Her main claim is that a cushion should go in the reading corner."],"hints":["Look for the change Mia wants.","Which words say what we should do?"],"think":"Point to the claim, then point to its reason.","visual":null,"id":"m05l01-w","kind":"worked","options":["The seat is made of wood.","The seat feels hard.","Put a cushion in the reading corner.","Every corner needs a cushion."],"answer":2,"optionWhy":["This describes the seat; it is not her proposed change.","This is the reason Mia gives for adding a cushion.","This is the change Mia recommends.","Mia only mentions the reading corner."]},"questions":[{"stem":"Leo says, \"Let us move the toy box away from the door. People keep bumping into it when they enter.\"","ask":"What is Leo proposing?","explanation":["Leo tells us people bump into the box.","That is his reason for suggesting a change.","The proposed change is to move the box away from the door."],"hints":["Which sentence is asking for an action?","The other sentence explains the problem."],"think":"Finish: Leo wants us to...","visual":null,"id":"m05l01-q1","kind":"guided","options":["People enter through the door.","People bump into the box.","Throw away every toy.","Move the toy box away from the door."],"answer":3,"optionWhy":["This is background about the doorway.","This explains why Leo wants the box moved.","Leo does not suggest throwing toys away.","That is the action Leo recommends."]},{"stem":"Ava says, \"The puppet has wet paint on its feet. I think it walked across our clean paper.\"","ask":"Which idea is Ava trying to explain with the wet paint?","explanation":["The wet paint is the clue Ava gives.","She uses it to suggest an event.","Her claim is that the puppet walked across the paper; finding a claim does not prove it."],"hints":["Which part is a clue, and which part is a guess about what happened?","Look after the words \"I think\"."],"think":"Can you find Ava's claim without deciding whether it is true?","visual":null,"id":"m05l01-q2","kind":"practice","options":["The puppet walked across the paper.","The paper was clean.","The puppet has wet paint on its feet.","All puppets can walk by themselves."],"answer":0,"optionWhy":["This is the event Ava thinks happened.","This describes the paper before the suspected event.","This is Ava's clue, not the event she infers.","Ava does not make this much larger claim."]},{"stem":"Pip says, \"A lid would stop loose beads falling out of this tub. We should add a lid.\"","ask":"What is Pip's main recommendation?","explanation":["Pip first explains what a lid would do.","The last sentence says what should happen next.","The main recommendation is to add a lid to this tub."],"hints":["Find the action Pip wants.","A reason can come before its claim."],"think":"Say Pip's reason and recommendation in the opposite order.","visual":null,"id":"m05l01-q3","kind":"practice","options":["The tub holds beads.","Add a lid to the tub.","Loose beads can fall out.","Make the tub much bigger."],"answer":1,"optionWhy":["This is information about the tub.","Pip wants the group to take this action.","This is the problem behind Pip's recommendation.","Pip never recommends changing the tub's size."]},{"stem":"Noor says, \"I think the mystery animal is a rabbit. The story says it has long ears and hops.\"","ask":"Which sentence states Noor's main claim?","explanation":["Noor offers two clues from the story.","Both clues support her proposed identification.","Her claim concerns the one mystery animal, not every animal in the story."],"hints":["Which idea are the two clues meant to support?","Keep the claim about just one animal."],"think":"Which two details does Noor use as reasons?","visual":null,"id":"m05l01-q4","kind":"practice","options":["The story mentions long ears.","The story mentions hopping.","The mystery animal is a rabbit.","Every animal in the story is a rabbit."],"answer":2,"optionWhy":["This is one piece of evidence Noor uses.","This is another piece of evidence Noor uses.","This is the identification Noor wants us to accept.","Noor is speaking about one mystery animal."]},{"stem":"In a puppet script, Fox says, \"We ought to use the small stage today. Only three puppets are in our show.\"","ask":"What does Fox want the group to do?","explanation":["Fox gives the small number of puppets as a reason.","His proposal is about which stage to use.","The claim is limited to today's show."],"hints":["What choice is Fox trying to influence?","Notice the word \"today\"."],"think":"Act the line, stressing the main claim.","visual":null,"id":"m05l01-q5","kind":"transfer","options":["Count three puppets.","Use the small stage for every show.","Remove a puppet from the show.","Use the small stage today."],"answer":3,"optionWhy":["The count is already given as a reason.","Fox only makes a proposal for today.","Fox does not propose changing the cast.","This is Fox's proposal for the performance."]}],"activity":{"title":"Claim and reason cards","instructions":"Take four small pieces of paper. On two, write \"Use a tray\" and \"Put labels on the boxes\". On the others, write \"Loose crayons roll away\" and \"We cannot find the costumes\". Match each proposed action to its reason. Swap the order of each pair and read it aloud. Point to the claim each time.","coach":"Look for an action paired with a reason that addresses its problem. Changing sentence order must not change which part is the claim."},"reflection":"How did you find the claim when the reason came first?","transfer":"During reading, find one thing a character wants others to believe or do.","parent":{"aim":"Observe whether the child identifies the main proposal rather than repeating an interesting detail.","prompt":"What does this person want us to agree with?","pitfall":"Selecting the reason because it sounds factual, or enlarging a claim from one case to every case.","success":"The child states the claim briefly and points to the separate supporting reason."}},{"id":"m05l02","module":5,"lesson":2,"title":"Find the supporting reason","goal":"I can identify the information offered to support a claim.","story":"Pip has collected some ideas for a tiny theatre. Each speaker offers an idea and something that is meant to help it stand up. Your job is to find that supporting reason. You do not have to agree with every idea; first work out how the speaker connects the parts.","tool":"Because bridge","steps":["Find the claim first.","Ask what information is offered to support it.","Join the parts with \"because\" and check the connection."],"worked":{"stem":"Bella says, \"We should put name cards on the costume hooks because two actors mixed up their costumes yesterday.\"","ask":"Which reason does Bella give?","explanation":["The claim is to add name cards.","Bella then explains the costume mix-up.","The mix-up is her reason for wanting clearer labels."],"hints":["Ask why Bella wants name cards.","Look for the problem the cards would help with."],"think":"Complete: Add name cards because...","visual":null,"id":"m05l02-w","kind":"worked","options":["The hooks should have name cards.","All actors like writing names.","The theatre has a roof.","Two actors mixed up their costumes."],"answer":3,"optionWhy":["This repeats the proposal rather than its reason.","Bella does not give this information.","This is not a reason in Bella's statement.","This is the problem the name cards are meant to address."]},"questions":[{"stem":"Sam says, \"Our ball rolls through the gap in the fence. We should cover that gap.\"","ask":"What reason supports Sam's proposal?","explanation":["Sam proposes covering a particular gap.","The first sentence explains what goes wrong there.","The escaping ball is the reason offered."],"hints":["Find the problem before the recommendation.","Which fact explains why the gap matters?"],"think":"How does the proposed action connect to the reason?","visual":null,"id":"m05l02-q1","kind":"guided","options":["The ball rolls through the gap.","Cover the gap.","The ball is the newest one.","The fence must be blue."],"answer":0,"optionWhy":["Covering the gap addresses this stated problem.","That is the proposed action.","Its age is not given or used as a reason.","No fence colour is given, and it would not explain the proposal."]},{"stem":"Mia says, \"I think Box B holds the bell. When I gently shake Box B, I hear a ringing sound.\"","ask":"What evidence does Mia use for her claim?","explanation":["Mia's claim is that the bell is in Box B.","She supports it with a sound she hears.","Ringing is her evidence, although it does not rule out every other ringing object."],"hints":["Separate what Mia thinks from what she heard.","Which sentence describes an observation?"],"think":"Does finding her evidence mean the claim is proved?","visual":null,"id":"m05l02-q2","kind":"practice","options":["Box B holds the bell.","She hears ringing from Box B.","She prefers the letter B.","Every box holds a bell."],"answer":1,"optionWhy":["This repeats the claim she is trying to support.","This observation is the evidence Mia offers.","Mia does not mention this, and it would not locate a bell.","Mia only makes a claim about Box B."]},{"stem":"Leo says, \"Let us choose the ten-minute game. We have only twelve minutes before the bus leaves.\"","ask":"Why does Leo suggest that game?","explanation":["Leo wants a game that fits the time available.","He states that the bus leaves in twelve minutes.","That time limit is his reason for proposing the ten-minute game."],"hints":["What limit is Leo thinking about?","Find the number that describes the time available."],"think":"Would the same reason support a twenty-minute game?","visual":null,"id":"m05l02-q3","kind":"practice","options":["The game should be chosen.","The bus driver likes games.","There are only twelve minutes available.","Ten is always the best number."],"answer":2,"optionWhy":["This restates the proposal.","That is not information Leo gives.","The available time is the reason for choosing a short game.","Leo makes no such general claim."]},{"stem":"Ari says, \"The low shelf is easy for us to reach. We should keep our drawing paper there.\"","ask":"What is Ari's supporting reason?","explanation":["The recommendation is to store paper on the low shelf.","Ari explains an advantage of that shelf.","Being easy to reach is the offered reason."],"hints":["Ask what makes the shelf a useful choice.","Which part describes an advantage?"],"think":"Join the claim and the reason using \"because\".","visual":null,"id":"m05l02-q4","kind":"practice","options":["Keep drawing paper there.","The paper must be green.","Low shelves are always empty.","The shelf is easy to reach."],"answer":3,"optionWhy":["This is the recommendation, not the reason.","Ari gives no paper colour.","Ari never says this.","This explains why the shelf is useful for the paper."]},{"stem":"In a story, Mole says, \"We should take the lantern. The tunnel ahead has no lights.\"","ask":"Which part gives Mole's reason?","explanation":["Mole recommends bringing a lantern.","He describes the lighting in one particular tunnel.","The absence of lights is his stated reason."],"hints":["Which part answers \"Why take it?\"","Keep the reason about this tunnel."],"think":"Read the line with a pause between the claim and its reason.","visual":null,"id":"m05l02-q5","kind":"transfer","options":["The tunnel ahead has no lights.","We should take the lantern.","Mole is the first speaker.","Every tunnel has no lights."],"answer":0,"optionWhy":["This explains the proposed need for a lantern.","This is Mole's proposal.","Speaking order does not explain taking a lantern.","Mole only describes the tunnel ahead."]}],"activity":{"title":"Build a because bridge","instructions":"Put a pencil, a cup and a tray on the table. Make three proposals, one about each object, and supply a reason for each. For example, \"Put the pencil in the cup because it keeps rolling off.\" Ask a partner to point to the reason. Then swap roles and say the reason before the proposal.","coach":"Accept different sensible proposals. Check that the child can identify the supporting information even when sentence order changes."},"reflection":"How can you tell a repeated claim from a supporting reason?","transfer":"When a character makes a suggestion, find the sentence that explains why.","parent":{"aim":"Observe whether the child distinguishes a proposal from the evidence offered for it.","prompt":"Which part answers why?","pitfall":"Choosing the claim again, or inventing a reason that the speaker did not give.","success":"The child locates the actual stated reason and explains its connection to the claim."}},{"id":"m05l03","module":5,"lesson":3,"title":"Keep the useful information","goal":"I can choose information that helps answer the actual question.","story":"The noticeboard is crowded with true facts. Some help with today's problem and some are simply interesting. Pip wants to use every fact at once! Help him slow down. Read the question first, then keep the information that helps answer it. A true fact can still belong to a different problem.","tool":"Question spotlight","steps":["Say exactly what needs to be decided.","Check how each fact connects to that decision.","Keep useful facts and set unrelated facts aside."],"worked":{"stem":"Bella is checking whether a box is narrow enough to pass through a doorway. All four facts below are true.","ask":"Which fact is most useful for answering that question?","explanation":["The question concerns fitting through a space.","Comparing the box width with the doorway width helps with that decision.","The picture, paint date and preference do not provide those measurements."],"hints":["What must be compared to check a fit?","Look for information about the size of both things."],"think":"Name one true fact here that answers a different question.","visual":null,"id":"m05l03-w","kind":"worked","options":["The box is 30 cm wide and the doorway is 50 cm wide.","The box has a picture of a fox.","The doorway was painted yesterday.","Bella likes carrying boxes."],"answer":0,"optionWhy":["The two widths can be compared to check the fit.","The picture does not tell us whether the box fits.","Painting time does not give the space available.","Her preference does not tell us the sizes."]},"questions":[{"stem":"The class wants to choose a game that everyone in the group can join at the same time. There are six children.","ask":"Which new fact helps most?","explanation":["The aim is for six children to play together.","The useful information is the number the game can accommodate.","A six-player limit answers that need directly."],"hints":["Which requirement must the game meet?","Look for information about players, not appearance."],"think":"What different question could the box colour help answer?","visual":null,"id":"m05l03-q1","kind":"guided","options":["The game box is orange.","The game allows six players at once.","The game was a birthday present.","The game has a funny name."],"answer":1,"optionWhy":["Box colour does not determine how many children can play.","This directly matches the number of children who need to join.","Its history does not state its player limit.","A funny name does not tell us who can join."]},{"stem":"Leo asks whether the library is open at 4 pm on Saturday. The following facts are all true.","ask":"Which fact answers Leo's question?","explanation":["The question specifies both Saturday and 4 pm.","Saturday's hours are 10 am to 5 pm.","Four o'clock falls inside that interval."],"hints":["Match both the day and the time.","Information about a different day may be true but unhelpful here."],"think":"Why is the Monday fact not enough?","visual":null,"id":"m05l03-q2","kind":"practice","options":["The library has four large windows.","The library opens at 9 am on Mondays.","On Saturdays, the library opens at 10 am and closes at 5 pm.","Leo borrowed two books last week."],"answer":2,"optionWhy":["The number of windows does not show opening times.","Monday hours do not answer a Saturday question.","The opening interval includes 4 pm.","A previous visit does not give Saturday hours."]},{"stem":"Mia wants a bag that can hold her 20 cm long ruler without bending it. Four descriptions are true.","ask":"Which description is useful for checking the space inside?","explanation":["The ruler needs 20 cm of straight space.","An inside length of 25 cm is enough for that length.","The other facts describe decoration, ownership or preference."],"hints":["What measurement matters for a straight ruler?","Look inside the bag, not at its decoration."],"think":"Say what the useful fact lets you compare.","visual":null,"id":"m05l03-q3","kind":"practice","options":["The bag has a star on its handle.","The bag belongs to her cousin.","The ruler is Mia's favourite tool.","The bag has a straight inside space 25 cm long."],"answer":3,"optionWhy":["The decoration does not measure the inside space.","Ownership does not show the available length.","Preference does not tell us whether it fits.","This gives a space longer than the ruler."]},{"stem":"Ari wants to know which plant grew more centimetres this week. Plant A grew from 8 cm to 11 cm. Plant B grew from 4 cm to 8 cm.","ask":"Which information should Ari compare?","explanation":["Ari asks about growth during the week.","Growth is the final height minus the starting height.","Plant A grew 3 cm and Plant B grew 4 cm, so changes are the relevant information."],"hints":["Is the question about being tall or becoming taller?","You need a before and an after measurement for each plant."],"think":"How would the useful information change if the question were \"Which is taller now?\"","visual":null,"id":"m05l03-q4","kind":"practice","options":["The increase in each plant's height.","Only their final heights.","The colours of their pots.","Only their starting heights."],"answer":0,"optionWhy":["The question asks about growth, so compare each change.","A taller final plant need not have grown more this week.","Pot colours do not measure growth.","Starting heights alone do not show changes."]},{"stem":"A puppet director needs a sound effect that lasts no longer than five seconds. The story mentions a bell sound and a drum sound.","ask":"Which fact helps choose a sound that meets the time limit?","explanation":["The requirement is a sound of five seconds or less.","The bell lasts four seconds and meets the requirement; the drum lasts eight and does not.","The durations are therefore the useful information."],"hints":["What limit must be met?","Choose the fact that lets you compare both sounds with that limit."],"think":"Explain why an interesting costume detail can be left aside.","visual":null,"id":"m05l03-q5","kind":"transfer","options":["The bell is painted yellow.","The bell sound lasts four seconds; the drum sound lasts eight.","The drummer wears a tall hat.","The play has a fox in it."],"answer":1,"optionWhy":["Paint colour does not tell us the sound length.","These durations can be checked against the five-second limit.","The performer's costume does not provide a duration.","A character name does not show which sound fits the limit."]}],"activity":{"title":"Spotlight a question","instructions":"Choose a familiar object, such as a pencil case. Make four fact cards: its colour, length, owner and number of pockets. Ask \"Will my pencil fit?\" and select the useful card. Then ask \"Whose case is this?\" and select again. Explain how the same fact can be useful for one question and unhelpful for another.","coach":"Look for a connection between the fact and the particular question. Do not label a fact permanently useful or useless."},"reflection":"Which fact was interesting but did not help with the question?","transfer":"In a maths word problem, point to the information needed before doing any calculation.","parent":{"aim":"Observe whether the child begins with the question and selects information for that purpose.","prompt":"What are we trying to find out?","pitfall":"Using every number or picking an attractive detail without checking relevance.","success":"The child explains why a fact helps this question and why another can be set aside."}},{"id":"m05l04","module":5,"lesson":4,"title":"Compare two reasons","goal":"I can choose the reason that best connects to a stated goal.","story":"The theatre team has many suggestions. Some reasons point straight at the problem, while others only sound cheerful or impressive. Bella is choosing which reasons will help the team make a decision. Keep the goal in view, then ask how each reason helps achieve it. Different goals can need different reasons.","tool":"Goal and reason match","steps":["State the goal or problem.","Check what each reason would change about that goal.","Choose the most direct support without making the claim bigger."],"worked":{"stem":"The class wants to find costume boxes quickly. Pip suggests putting clear labels on them.","ask":"Which reason best supports Pip's suggestion for this goal?","explanation":["The goal is to locate costumes quickly.","A clear contents label lets someone choose a box before opening it.","That is a direct link between the suggestion and the goal."],"hints":["Which reason explains how searching becomes easier?","Keep the goal about finding costumes, not enjoying crafts."],"think":"Could Pip enjoy labels even if they did not help?","visual":null,"id":"m05l04-w","kind":"worked","options":["Labels come in many colours.","A label shows what is inside without opening every box.","Pip enjoys making labels.","Some boxes are square."],"answer":1,"optionWhy":["A range of colours alone does not show which box holds a costume.","This directly explains how labels can help people find costumes faster.","His enjoyment does not show that searching will be quicker.","Box shape does not explain the benefit of clear labels."]},"questions":[{"stem":"Mia wants fewer dropped crayons while carrying twelve of them. She suggests using a tray with raised edges.","ask":"Which reason best supports that choice?","explanation":["Mia wants to reduce dropped crayons.","The proposed tray has a feature that blocks rolling crayons.","Raised edges are the reason connected to her goal."],"hints":["What is going wrong when Mia carries crayons?","Find the feature that addresses that exact problem."],"think":"What would be a relevant question about the tray's size?","visual":null,"id":"m05l04-q1","kind":"guided","options":["The tray has a cat picture.","Mia likes the word tray.","Raised edges help stop the crayons rolling off.","The tray was bought on Tuesday."],"answer":2,"optionWhy":["The picture does not stop crayons falling.","Liking a word does not affect carrying crayons.","This addresses the problem of crayons falling during carrying.","The purchase day does not explain how it prevents drops."]},{"stem":"Leo wants people at the back of the room to read a sign. He suggests using larger letters.","ask":"Which reason best supports the suggestion?","explanation":["The goal concerns reading from the back.","The try-out compares readability from that position.","The result supports larger letters for this sign, without promising success in every room."],"hints":["Which reason checks the sign from where readers will be?","Look for a test of the actual goal."],"think":"Why is the place where the test happened useful?","visual":null,"id":"m05l04-q2","kind":"practice","options":["Leo wrote the sign after lunch.","The sign uses Leo's favourite word.","The paper came in a packet.","In a try-out from the back, children read the larger letters more easily."],"answer":3,"optionWhy":["Writing time does not show whether the back row can read it.","A favourite word does not establish distance readability.","Packaging tells us nothing about reading the letters.","This observation tests the suggestion at the required distance."]},{"stem":"Noor wants to keep a waiting line clear of a doorway. She suggests placing a waiting marker farther from the door.","ask":"Which reason best supports the move?","explanation":["Noor wants an unobstructed doorway.","The new marker puts waiting people away from that space.","The reason directly addresses the location problem."],"hints":["What space needs to stay clear?","Look for a reason about where people will stand."],"think":"What should you check if the line gets much longer?","visual":null,"id":"m05l04-q3","kind":"practice","options":["People standing at the new marker leave the doorway clear.","The marker is Noor's favourite colour.","Noor can count the people in the line.","The doorway is in a school."],"answer":0,"optionWhy":["This directly links the new position to the goal.","Colour preference does not show that the door stays clear.","Counting alone does not explain why the marker should move.","The building type does not establish the benefit of this position."]},{"stem":"Ari wants to choose the quieter of two toy drums for indoor practice. Both cost the same.","ask":"Which reason best supports choosing Drum B?","explanation":["The stated goal is quieter indoor practice.","Using the same taps makes the sound comparison more useful.","The softer sound supports choosing Drum B for that goal."],"hints":["What quality matters for this choice?","Choose a reason that compares that quality in both drums."],"think":"Would the same reason decide which drum has the prettiest picture?","visual":null,"id":"m05l04-q4","kind":"practice","options":["Drum B has more stars painted on it.","Played with the same taps, Drum B sounds softer than Drum A.","Drum B has a shorter name.","Ari saw Drum B first."],"answer":1,"optionWhy":["Decoration does not compare sound level.","This comparison directly addresses quietness.","Name length does not tell us how loud it sounds.","Seeing it first is not evidence that it is quieter."]},{"stem":"A story club wants a book that will fit into its fifteen-minute reading session. Two books have been timed aloud: Book A takes ten minutes and Book B takes twenty.","ask":"Which reason best supports choosing Book A for this session?","explanation":["The club has fifteen minutes.","Book A takes ten minutes and fits; Book B takes twenty and does not.","Reading time is the reason that answers this particular choice."],"hints":["Keep the session limit in mind.","Which reason compares the book with that limit?"],"think":"Name another goal that would need different information about the books.","visual":null,"id":"m05l04-q5","kind":"transfer","options":["Its title comes first in the alphabet.","Book B is also a real book.","Its ten-minute reading time fits the fifteen minutes available.","The group read a book last week."],"answer":2,"optionWhy":["Alphabetical order does not show that a reading will fit.","This does not compare either book with the available time.","This directly checks the club's time requirement.","Last week's activity does not establish today's fit."]}],"activity":{"title":"One choice, two goals","instructions":"Put two empty containers on a table. Choose a pretend goal: carry ten counters without spilling, or show a visitor a favourite decoration. Give a reason for choosing a container for each goal. Then change the goal and check whether the same reason still helps. Your partner should ask how your reason connects to the goal.","coach":"Accept either container when the reason genuinely fits the stated goal. Check the child is comparing relevant features rather than always defending a favourite."},"reflection":"What made one reason stronger for the stated goal?","transfer":"Before choosing a story, activity or tool, agree on the goal and give a reason linked to it.","parent":{"aim":"Observe whether the child relates a reason to the exact purpose of a choice.","prompt":"How would that help with our goal?","pitfall":"Treating enthusiasm, decoration or speaking confidence as evidence for an unrelated goal.","success":"The child selects a direct reason and can explain why another reason addresses a different matter."}},{"id":"m06l01","module":6,"lesson":1,"title":"One example can break an all-claim","goal":"I can find a real exception to a claim about every member of a group.","story":"A tiny museum has a sign that says, \"All our paper birds are blue.\" Pip wants to check it. Counting more blue birds might help, but a single paper bird of another colour would change the answer. Today you will look carefully at the group named in a claim and search for a genuine exception.","tool":"Exception checker","steps":["Find the group and the word \"all\", \"every\" or \"none\".","Look for one member of that group that breaks the claim.","Explain exactly which part of the claim the example breaks."],"worked":{"stem":"A sign says, \"All the paper birds in this museum are blue.\" Four new discoveries are listed below.","ask":"Which discovery proves that the sign is wrong?","explanation":["The claim covers every paper bird in this museum.","A yellow paper bird here is inside that group but does not have the claimed colour.","That single exception is enough to prove the all-claim wrong."],"hints":["Check both membership of the group and colour.","An exception must be a paper bird in this museum."],"think":"Why does a yellow kite not break this claim?","visual":null,"id":"m06l01-w","kind":"worked","options":["A blue paper bird in this museum.","A yellow paper kite in this museum.","A yellow paper bird in a different museum.","A yellow paper bird in this museum."],"answer":3,"optionWhy":["This bird fits the sign rather than breaking it.","The sign is about birds, not kites.","The sign only concerns birds in this museum.","It belongs to the named group but is not blue."]},"questions":[{"stem":"Leo says, \"Every invitation in this pile has a star printed on it.\"","ask":"Which finding would prove Leo's claim wrong?","explanation":["The claim concerns the invitations in one pile.","An invitation with no star would fail the stated requirement.","A different kind of paper does not test the claim."],"hints":["What must every invitation have?","Find an invitation, not a nearby object."],"think":"Would two stars count as having a star?","visual":null,"id":"m06l01-q1","kind":"guided","options":["An invitation in the pile with no star.","An invitation in the pile with two stars.","A blank shopping list beside the pile.","A star on the envelope."],"answer":0,"optionWhy":["This is a member of the pile that lacks the claimed feature.","It still has a star, so it fits the claim.","A shopping list is not one of the invitations.","This does not show whether every invitation has a star."]},{"stem":"Mia says, \"None of the puppets on this shelf is wearing a hat.\"","ask":"Which observation proves Mia wrong?","explanation":["\"None\" means no puppet in the named group has the feature.","One puppet on that shelf wearing a hat is enough to contradict it.","Nearby hats and people belong to different situations."],"hints":["What would \"none\" forbid?","Look for the feature on a puppet in the stated place."],"think":"Explain how one observation can test a claim about none.","visual":null,"id":"m06l01-q2","kind":"practice","options":["One puppet on the shelf has no hat.","One puppet on the shelf is wearing a hat.","A hat is lying in a drawer.","A person near the shelf wears a hat."],"answer":1,"optionWhy":["This puppet fits the claim.","A single hat-wearing puppet contradicts \"none\".","A stored hat is not a puppet wearing one on the shelf.","The claim concerns puppets, not people."]},{"stem":"Pip claims, \"Every large box in our storeroom contains at least one ball.\"","ask":"Which discovery is a counterexample?","explanation":["Pip's claim applies only to large boxes in this storeroom.","The scarf box is a large box here and has zero balls.","That is a direct exception to the at-least-one claim."],"hints":["Check size, place and contents.","A useful exception must meet the first two conditions and fail the last."],"think":"Why is an empty small box not enough?","visual":null,"id":"m06l01-q3","kind":"practice","options":["A small storeroom box with no balls.","A large storeroom box with two balls.","A large storeroom box containing only scarves and no balls.","A large box of balls in another building."],"answer":2,"optionWhy":["Small boxes are outside the claim.","Two balls meet the at-least-one requirement.","It is a large box in the group but contains no ball.","The claim concerns this storeroom."]},{"stem":"Ari says, \"Every path from Start to Finish on this park map goes past the pond.\"","ask":"Which new information would prove the claim wrong?","explanation":["The claim is about complete Start-to-Finish paths.","A complete path that avoids the pond breaks it.","A path to a bench is not the kind of route the claim describes."],"hints":["What beginning and ending must the path have?","An exception must reach Finish as well as avoid the pond."],"think":"What two checks make this a genuine counterexample?","visual":null,"id":"m06l01-q4","kind":"practice","options":["One path from Start to Finish passes the pond twice.","A short path starts at Start but ends at a bench.","The pond has three ducks.","One path connects Start to Finish without passing the pond."],"answer":3,"optionWhy":["It still passes the pond, as the claim says.","It is not a path all the way to Finish.","Duck numbers do not tell us where the paths go.","This is a complete route of the stated kind that misses the pond."]},{"stem":"In a story, the narrator says, \"Every dragon on Moon Island can breathe fire.\" Later you learn one new fact.","ask":"Which fact would contradict the narrator?","explanation":["The narrator claims an ability for every dragon in one place.","Luma is a dragon in that place without the ability.","Luma therefore contradicts the claim within the story's own information."],"hints":["Use the story's rules, not real-world facts about dragons.","Check creature, island and ability."],"think":"Write a more careful claim the narrator could use.","visual":null,"id":"m06l01-q5","kind":"transfer","options":["Luma is a dragon on Moon Island who cannot breathe fire.","Luma is a dragon on Moon Island who can breathe fire.","A horse on Moon Island cannot breathe fire.","A dragon on Sun Island cannot breathe fire."],"answer":0,"optionWhy":["Luma belongs to the claimed group and lacks its claimed ability.","This example agrees with the narrator.","The claim is about dragons, not horses.","The narrator only names Moon Island."]}],"activity":{"title":"Build it, then break it","instructions":"Draw six shapes on small cards: three circles and three squares. Colour them as you choose. Make a claim such as \"All my circles are red.\" Ask a partner to check every circle and find a counterexample if one exists. Swap roles. A square cannot break a claim that only names circles.","coach":"An exception must belong to the named group and fail the claimed feature. If no exception exists, the claim may be true for this complete set."},"reflection":"What two things must you check before calling something a counterexample?","transfer":"In a story, notice a sentence containing \"every\" and check whether the story gives an exception.","parent":{"aim":"Observe whether the child checks both group membership and the claimed property.","prompt":"Is this example inside the group the speaker named?","pitfall":"Using an exception from another group or assuming many confirming examples prove an unrestricted all-claim.","success":"The child identifies a genuine exception and explains which word or property it contradicts."}},{"id":"m06l02","module":6,"lesson"
